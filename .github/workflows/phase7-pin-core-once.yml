name: Phase 7 pin completed core once

on:
  push:
    paths:
      - .github/workflows/phase7-pin-core-once.yml

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update core pin, projection bridge, and canonical expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          old_core = 'd6d5f90aabab4d106265113bad09fc5984f4808e'
          new_core = '2b746b121ed0e44cfe86ba8377969b8d8bf197c7'

          userscript = Path('chatgpt-conversation-markdown-export.user.js')
          text = userscript.read_text(encoding='utf-8')
          if old_core not in text:
            raise SystemExit('old userscript core pin not found')
          text = text.replace(old_core, new_core, 1)
          text = text.replace('// @version      0.6.148', '// @version      0.6.149', 1)

          old_record = '''  function canonicalRecordBlock(record, event) {
            assert(canonicalMessageRecordEligible(record, event),
              `AIConversationCore message record ${record?.id ?? 'unknown'} is not eligible for canonical rendering.`);
            const role = record?.author?.role;
            const plainHeading = role === 'user'
              ? '## User'
              : record?.channel === 'commentary' ? '## ChatGPT Commentary' : '## ChatGPT';
            const rendered = canonicalCore().renderCanonicalMarkdown([event]).trimEnd();
            assert(rendered === plainHeading || rendered.startsWith(`${plainHeading}\\n`),
              `AIConversationCore rendered an unexpected heading for source record ${record?.id ?? 'unknown'}.`);
            return `${transcriptHeading(record)}${rendered.slice(plainHeading.length)}`;
          }'''
          new_record = '''  function canonicalRecordBlock(record, event) {
            assert(canonicalMessageRecordEligible(record, event),
              `AIConversationCore message record ${record?.id ?? 'unknown'} is not eligible for canonical rendering.`);
            const sourceId = typeof record?.id === 'string' ? record.id : '';
            const projectedEvent = sourceId
              ? {
                  ...event,
                  projection: {
                    ...(event?.projection ?? {}),
                    heading_suffix: ` <!-- turn_id=${sourceId} -->`
                  }
                }
              : event;
            return canonicalCore().renderCanonicalMarkdown([projectedEvent]).trimEnd();
          }'''
          if old_record not in text:
            raise SystemExit('canonicalRecordBlock anchor not found')
          text = text.replace(old_record, new_record, 1)

          old_segment = '''  function canonicalAssistantSegmentBlock(records, events) {
            assert(canonicalAssistantSegmentEligible(records, events),
              'AIConversationCore Assistant segment contains an unsupported record.');
            const rendered = canonicalCore().renderCanonicalMarkdown(events).trimEnd();
            /**
             * Handles message record.
             */
            const messageRecord = [...records].reverse().find((record, indexFromEnd) => {
              const index = records.length - 1 - indexFromEnd;
              return canonicalMessageRecordEligible(record, events[index]);
            }) ?? null;
            /**
             * Handles heading record.
             */
            const headingRecord = messageRecord ?? records.find(record => record?.author?.role === 'assistant') ?? records[0];
            const plainHeading = messageRecord?.channel === 'commentary' ? '## ChatGPT Commentary' : '## ChatGPT';
            assert(rendered === plainHeading || rendered.startsWith(`${plainHeading}\\n`),
              'AIConversationCore rendered an unexpected Assistant segment heading.');
            return `${transcriptHeading(headingRecord)}${rendered.slice(plainHeading.length)}`;
          }'''
          new_segment = '''  function canonicalAssistantSegmentBlock(records, events) {
            assert(canonicalAssistantSegmentEligible(records, events),
              'AIConversationCore Assistant segment contains an unsupported record.');
            /**
             * Handles message record.
             */
            const messageRecord = [...records].reverse().find((record, indexFromEnd) => {
              const index = records.length - 1 - indexFromEnd;
              return canonicalMessageRecordEligible(record, events[index]);
            }) ?? null;
            /**
             * Handles heading record.
             */
            const headingRecord = messageRecord ?? records.find(record => record?.author?.role === 'assistant') ?? records[0];
            const headingSourceId = typeof headingRecord?.id === 'string' ? headingRecord.id : '';
            const projectedEvents = events.map((event, index) => {
              const commentarySourceId = event?.kind === 'commentary' && typeof records[index]?.id === 'string'
                ? records[index].id
                : '';
              const sourceId = commentarySourceId || (index === 0 ? headingSourceId : '');
              if (!sourceId) return event;
              return {
                ...event,
                projection: {
                  ...(event?.projection ?? {}),
                  heading_suffix: ` <!-- turn_id=${sourceId} -->`
                }
              };
            });
            return canonicalCore().renderCanonicalMarkdown(projectedEvents).trimEnd();
          }'''
          if old_segment not in text:
            raise SystemExit('canonicalAssistantSegmentBlock anchor not found')
          text = text.replace(old_segment, new_segment, 1)
          userscript.write_text(text, encoding='utf-8')

          for filename in ['tests/core-integration.test.mjs', 'tests/phase5-rich-core-integration.test.mjs']:
            path = Path(filename)
            value = path.read_text(encoding='utf-8')
            if old_core not in value:
              raise SystemExit(f'old test core pin not found in {filename}')
            value = value.replace(old_core, new_core, 1)
            value = value.replace('/<summary>Thoughts<\\/summary>/', '/<summary>Having a thought<\\/summary>/')
            path.write_text(value, encoding='utf-8')

          rich = Path('tests/phase5-rich-core-integration.test.mjs')
          value = rich.read_text(encoding='utf-8')
          value = value.replace(
            "assert.match(rendered, /^## ChatGPT Commentary <!-- turn_id=commentary-message -->/);\n  assert.equal((rendered.match(/^## ChatGPT$/gm) ?? []).length, 0,\n    'Commentary + tool activity must not manufacture a second ChatGPT section.');",
            "assert.match(rendered, /^## ChatGPT <!-- turn_id=commentary-message -->/);\n  assert.match(rendered, /^### ChatGPT Commentary <!-- turn_id=commentary-message -->$/m);\n  assert.equal((rendered.match(/^## ChatGPT(?: |$)/gm) ?? []).length, 1,\n    'Commentary + tool activity must remain inside exactly one ChatGPT response section.');"
          )
          value = value.replace(
            "assert.match(rendered, new RegExp(`^## ChatGPT Commentary <!-- turn_id=commentary-${contentType} -->`));",
            "assert.match(rendered, new RegExp(`^## ChatGPT <!-- turn_id=commentary-${contentType} -->`));\n    assert.match(rendered, new RegExp(`^### ChatGPT Commentary <!-- turn_id=commentary-${contentType} -->$`, 'm'));"
          )
          rich.write_text(value, encoding='utf-8')

          core_test = Path('tests/core-integration.test.mjs')
          value = core_test.read_text(encoding='utf-8')
          old_loop = '''  for (const record of [
              textRecord('markdown-user', 'user', markdown),
              textRecord('markdown-assistant', 'assistant', markdown),
              textRecord('markdown-commentary', 'assistant', markdown, { channel: 'commentary' })
            ]) {
              const event = phase5.canonicalEventsBySourceRecord([record]).get(record.id);
              assert.equal(phase5.canonicalPlainRecordBlock(record, event), productionPlainBlock(record));
            }'''
          new_loop = '''  for (const record of [
              textRecord('markdown-user', 'user', markdown),
              textRecord('markdown-assistant', 'assistant', markdown)
            ]) {
              const event = phase5.canonicalEventsBySourceRecord([record]).get(record.id);
              assert.equal(phase5.canonicalPlainRecordBlock(record, event), productionPlainBlock(record));
            }
            const commentary = textRecord('markdown-commentary', 'assistant', markdown, { channel: 'commentary' });
            const commentaryEvent = phase5.canonicalEventsBySourceRecord([commentary]).get(commentary.id);
            const commentaryRendered = phase5.canonicalPlainRecordBlock(commentary, commentaryEvent);
            assert.match(commentaryRendered, /^## ChatGPT <!-- turn_id=markdown-commentary -->/);
            assert.match(commentaryRendered, /^### ChatGPT Commentary <!-- turn_id=markdown-commentary -->$/m);
            assert.ok(commentaryRendered.endsWith(context.__productionQuoteMarkdown(markdown)));'''
          if old_loop not in value:
            raise SystemExit('core commentary legacy-parity loop anchor not found')
          core_test.write_text(value.replace(old_loop, new_loop, 1), encoding='utf-8')

          ci = Path('.github/workflows/ci.yml')
          value = ci.read_text(encoding='utf-8')
          old_cmd = 'node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs'
          new_cmd = old_cmd + ' tests/tool-language-diagnostics.test.mjs'
          if old_cmd not in value:
            raise SystemExit('CI rendering regression command not found')
          ci.write_text(value.replace(old_cmd, new_cmd, 1), encoding='utf-8')
          PY
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: All rendering regressions against completed core
        run: node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs tests/tool-language-diagnostics.test.mjs
      - name: Remaining permanent regressions
        run: node --test tests/test-list-ui.test.mjs tests/recorder-panel-ui.test.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified Phase 7 pin slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs .github/workflows/ci.yml
          git commit -m "phase7: project source headings through completed core"
          git push
