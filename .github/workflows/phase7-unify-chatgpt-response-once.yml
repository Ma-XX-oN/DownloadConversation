name: Phase 7 unify ChatGPT response once

on:
  push:
    paths:
      - .github/workflows/phase7-unify-chatgpt-response-once.yml
      - scripts/phase7-unify-chatgpt-response.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply proven response-buffering fix
        run: python scripts/phase7-unify-chatgpt-response.py
      - name: Production documentation
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Existing rendering regressions
        run: node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs tests/tool-language-diagnostics.test.mjs
      - name: Cross-consumer final-render regression
        run: |
          git clone https://github.com/Ma-XX-oN/AIConversationCore.git .phase7-core
          git -C .phase7-core checkout 29a9fea4903f0214d450e1399a7af8e20823fcd1
          git clone https://github.com/Ma-XX-oN/AI-General-Memory.git .phase7-aigm
          git -C .phase7-aigm checkout 264379d7f5db42217dc56498605ce03da0459b60
          python -m pip install colorama regex
          PHASE7_CORE_ROOT="$PWD/.phase7-core" PHASE7_AIGM_ROOT="$PWD/.phase7-aigm" node tests/phase7-cross-consumer-parity.mjs
      - name: Remaining regressions
        run: node --test tests/test-list-ui.test.mjs tests/recorder-panel-ui.test.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified response-buffering fix
        run: |
          rm -rf .phase7-core .phase7-aigm
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs
          git commit -m "phase7: keep commentary inside one ChatGPT response"
          git push
