name: Issue 75 historical-loading diagnostics

on:
  push:
    branches:
      - issue-75-jump-materialization-convergence

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'ci(#75): apply historical-loading diagnostics' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply evidence-only production patch
        run: python scripts/issue-75-loading-diagnostics.py
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Version identity regression
        run: node --test tests/version-identity.test.mjs
      - name: Jump loading diagnostics regression
        run: node --test tests/jump-loading-diagnostics.test.mjs
      - name: Existing Jump materialization regression
        run: node --test tests/jump-materialization.test.mjs
      - name: Stock network diagnostics regression
        run: node --test tests/stock-network-diagnostics.test.mjs
      - name: DRY contract regression
        run: node --test tests/dry-contract.test.mjs
      - name: Diff integrity
        run: git diff --check
      - name: Commit verified evidence-only production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js
          git diff --cached --check
          git diff --cached --quiet && { echo "No production diff produced"; exit 1; }
          git commit -m "diag(#75): capture stock historical-loading evidence"
          git push origin HEAD:issue-75-jump-materialization-convergence
