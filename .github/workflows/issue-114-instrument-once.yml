name: Issue 114 instrumentation patch

on:
  push:
    branches:
      - issue-114-export-tail-instrumentation
    paths:
      - .github/workflows/issue-114-instrument-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-114-export-tail-instrumentation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply issue 114 diagnostics
        run: python scripts/issue-114-apply-instrumentation.py
      - name: Remove one-shot patch scaffolding
        run: rm .github/workflows/issue-114-instrument-once.yml scripts/issue-114-apply-instrumentation.py
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Focused diagnostics regression
        run: node --test tests/tool-language-diagnostics.test.mjs
      - name: Relevant production regressions
        run: node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs tests/tool-language-diagnostics.test.mjs tests/test-list-ui.test.mjs tests/recorder-panel-ui.test.mjs tests/heading-metadata-controls.test.mjs
      - name: Commit instrumentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: instrument export tail pipeline (#114)'
          git push origin HEAD:issue-114-export-tail-instrumentation
