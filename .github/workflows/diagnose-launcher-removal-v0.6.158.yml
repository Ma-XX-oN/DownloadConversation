name: Diagnose launcher removal v0.6.158

on:
  push:
    paths:
      - .github/workflows/diagnose-launcher-removal-v0.6.158.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply diagnostic-only launcher instrumentation
        run: |
          set -euo pipefail
          python .github/scripts/diagnose-launcher-removal-v0.6.158.py
          rm .github/scripts/diagnose-launcher-removal-v0.6.158.py
          rm .github/workflows/diagnose-launcher-removal-v0.6.158.yml
      - name: Verify syntax and regression tests
        run: |
          set -euo pipefail
          node --check chatgpt-conversation-markdown-export.user.js
          node --test tests/*.test.mjs
          git diff --check
      - name: Commit diagnostic product version and self-clean workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'diagnostics: capture launcher removal call stacks v0.6.158'
          git push origin HEAD:main
