name: Diagnose launcher removal v0.6.158

on:
  push:
    paths:
      - .github/workflows/diagnose-launcher-removal-v0.6.158.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply diagnostic-only launcher instrumentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script_path = Path('chatgpt-conversation-markdown-export.user.js')
          text = script_path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
            global text
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{label}: expected exactly one match, found {count}')
            text = text.replace(old, new, 1)

          replace_once('// @version      0.6.157', '// @version      0.6.158', 'userscript version')

          recovery = """  /**
   * Reattaches the launcher if host-page reconciliation removes the userscript's direct BODY child.
   *
   * The observer watches only direct BODY child-list changes, so normal conversation subtree
   * updates do not invoke it.  Recovery is deferred to the next animation frame so the host
   * reconciliation that removed the launcher can finish before the launcher is restored.
   *
   * @param {HTMLElement} launcher - The launcher element to keep mounted.
   * @returns {void} No value is returned.
   */
  function keepLauncherMounted(launcher) {
    const body = document.body;
    if (!(body instanceof HTMLBodyElement)) return;
    let recoveryPending = false;
    const observer = new MutationObserver(records => {
      if (launcher.isConnected || recoveryPending) return;
      const removed = records.some(record => [...record.removedNodes].some(node =>
        node === launcher || (node instanceof Element && node.contains(launcher))));
      if (!removed) return;
      recoveryPending = true;
      requestAnimationFrame(() => {
        recoveryPending = false;
        if (launcher.isConnected || document.body !== body) return;
        body.append(launcher);
        console.warn(`[DownloadConversation v${VERSION}] launcher restored after host-page removal`,
          launcherLifecycleState(launcher));
      });
    });
    observer.observe(body, { childList: true });
  }

"""

          diagnostics = """  /**
   * Logs a DOM operation that is about to remove or replace the launcher.
   *
   * This is diagnostic-only.  It never restores, moves, or otherwise changes the launcher.
   * The stack is captured before the native DOM operation so the caller that initiated the
   * removal remains visible in DevTools.
   *
   * @param {string} operation - DOM operation being performed.
   * @param {Node|null} affectedNode - Node whose removal/replacement would affect the launcher.
   * @param {Object} [details={}] - Operation-specific diagnostic details.
   * @returns {void} No value is returned.
   */
  function logLauncherRemovalOperation(operation, affectedNode, details = {}) {
    const launcher = document.getElementById(LAUNCHER_ID);
    if (!(launcher instanceof HTMLElement) || !(affectedNode instanceof Node)) return;
    if (affectedNode !== launcher && !affectedNode.contains(launcher)) return;
    const body = document.body;
    const bodyChildren = body ? [...body.childNodes] : [];
    const bodyChildIndex = launcher.parentNode === body ? bodyChildren.indexOf(launcher) : -1;
    const payload = {
      version: VERSION,
      operation,
      stack: new Error(`launcher removal via ${operation}`).stack || null,
      affected_node: launcherNodeSummary(affectedNode),
      details,
      launcher: launcherLifecycleState(launcher),
      body_child_index: bodyChildIndex,
      body_child_count: bodyChildren.length,
      previous_body_sibling: bodyChildIndex > 0 ? launcherNodeSummary(bodyChildren[bodyChildIndex - 1]) : null,
      next_body_sibling: bodyChildIndex >= 0 && bodyChildIndex + 1 < bodyChildren.length
        ? launcherNodeSummary(bodyChildren[bodyChildIndex + 1])
        : null
    };
    console.warn(
      `[DownloadConversation v${VERSION}] launcher removal operation JSON\\n${JSON.stringify(payload, null, 2)}`
    );
  }

  /**
   * Installs targeted DOM-operation wrappers used to identify who removes the launcher.
   *
   * Wrappers preserve the native return values and exceptions.  They only log when the exact
   * operation would remove the launcher or an ancestor that contains it.  No recovery behavior
   * is installed here.
   *
   * @returns {void} No value is returned.
   */
  function installLauncherRemovalDiagnostics() {
    const originalRemoveChild = Node.prototype.removeChild;
    Node.prototype.removeChild = function(child) {
      logLauncherRemovalOperation('Node.removeChild', child, {
        parent: launcherNodeSummary(this),
        child_index: child instanceof Node ? [...this.childNodes].indexOf(child) : -1
      });
      return Reflect.apply(originalRemoveChild, this, [child]);
    };

    const originalReplaceChild = Node.prototype.replaceChild;
    Node.prototype.replaceChild = function(newChild, oldChild) {
      logLauncherRemovalOperation('Node.replaceChild', oldChild, {
        parent: launcherNodeSummary(this),
        old_child_index: oldChild instanceof Node ? [...this.childNodes].indexOf(oldChild) : -1,
        new_child: launcherNodeSummary(newChild)
      });
      return Reflect.apply(originalReplaceChild, this, [newChild, oldChild]);
    };

    const originalRemove = Element.prototype.remove;
    Element.prototype.remove = function() {
      logLauncherRemovalOperation('Element.remove', this, {
        parent: launcherNodeSummary(this.parentNode)
      });
      return Reflect.apply(originalRemove, this, []);
    };

    const originalReplaceWith = Element.prototype.replaceWith;
    Element.prototype.replaceWith = function(...nodes) {
      logLauncherRemovalOperation('Element.replaceWith', this, {
        parent: launcherNodeSummary(this.parentNode),
        replacement_count: nodes.length
      });
      return Reflect.apply(originalReplaceWith, this, nodes);
    };

    const originalReplaceChildren = Element.prototype.replaceChildren;
    Element.prototype.replaceChildren = function(...nodes) {
      logLauncherRemovalOperation('Element.replaceChildren', this, {
        replacement_count: nodes.length
      });
      return Reflect.apply(originalReplaceChildren, this, nodes);
    };

    const innerHtml = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
    if (innerHtml?.set) {
      Object.defineProperty(Element.prototype, 'innerHTML', {
        ...innerHtml,
        set(value) {
          logLauncherRemovalOperation('Element.innerHTML=', this, {
            replacement_length: typeof value === 'string' ? value.length : null
          });
          return Reflect.apply(innerHtml.set, this, [value]);
        }
      });
    }

    const textContent = Object.getOwnPropertyDescriptor(Node.prototype, 'textContent');
    if (textContent?.set) {
      Object.defineProperty(Node.prototype, 'textContent', {
        ...textContent,
        set(value) {
          logLauncherRemovalOperation('Node.textContent=', this, {
            replacement_length: typeof value === 'string' ? value.length : null
          });
          return Reflect.apply(textContent.set, this, [value]);
        }
      });
    }

    const outerHtml = Object.getOwnPropertyDescriptor(Element.prototype, 'outerHTML');
    if (outerHtml?.set) {
      Object.defineProperty(Element.prototype, 'outerHTML', {
        ...outerHtml,
        set(value) {
          logLauncherRemovalOperation('Element.outerHTML=', this, {
            replacement_length: typeof value === 'string' ? value.length : null
          });
          return Reflect.apply(outerHtml.set, this, [value]);
        }
      });
    }
  }

"""
          replace_once(recovery, diagnostics, 'replace recovery with removal diagnostics')

          replace_once('''    document.body.append(launcher);\n    keepLauncherMounted(launcher);\n    watchLauncherLifecycle(launcher);''',
                       '''    document.body.append(launcher);\n    watchLauncherLifecycle(launcher);''',
                       'remove launcher recovery installation')

          replace_once('''    if (document.body) {\n      makeLauncher();\n      return;\n    }''',
                       '''    if (document.body) {\n      makeLauncher();\n      makePanel();\n      return;\n    }''',
                       'restore initial panel creation')

          replace_once('''      makeLauncher();\n    }).observe(document.documentElement, { childList: true, subtree: true });''',
                       '''      makeLauncher();\n      makePanel();\n    }).observe(document.documentElement, { childList: true, subtree: true });''',
                       'restore late-body panel creation')

          replace_once('''  installNetworkCapture();\n  bootstrapUi();''',
                       '''  installLauncherRemovalDiagnostics();\n  installNetworkCapture();\n  bootstrapUi();''',
                       'install launcher removal diagnostics before bootstrap')

          script_path.write_text(text, encoding='utf-8')

          heading_path = Path('tests/heading-metadata-controls.test.mjs')
          heading = heading_path.read_text(encoding='utf-8')
          old = "assert.match(userscript, /\\/\\/ @version      0\\.6\\.157/);"
          new = "assert.match(userscript, /\\/\\/ @version      0\\.6\\.158/);"
          if heading.count(old) != 1:
            raise SystemExit(f'heading version expectation: expected exactly one match, found {heading.count(old)}')
          heading_path.write_text(heading.replace(old, new, 1), encoding='utf-8')

          panel_path = Path('tests/recorder-panel-ui.test.mjs')
          panel = panel_path.read_text(encoding='utf-8')
          old_block = """  assert.match(userscript, /function keepLauncherMounted\\(launcher\\)/,
    'Launcher must install a host-removal recovery observer.');
  assert.match(userscript, /observer\\.observe\\(body, \\{ childList: true \\}\\)/,
    'Launcher recovery must observe only direct BODY child-list mutations.');
  assert.match(userscript, /requestAnimationFrame\\(\\(\\) => \\{[\\s\\S]*body\\.append\\(launcher\\)/,
    'Launcher recovery must defer reattachment until host reconciliation finishes.');
  assert.match(userscript, /document\\.body\\.append\\(launcher\\);\\n    keepLauncherMounted\\(launcher\\);/,
    'Launcher recovery must be installed immediately after the initial mount.');
  assert.doesNotMatch(userscript, /if \\(document\\.body\\) \\{\\n      makeLauncher\\(\\);\\n      makePanel\\(\\);/,
    'Bootstrap must not pre-create the hidden panel during host hydration.');
"""
          new_block = """  assert.doesNotMatch(userscript, /function keepLauncherMounted\\(/,
    'Diagnostic build must not restore a launcher that the host removed.');
  assert.match(userscript, /function installLauncherRemovalDiagnostics\\(\\)/,
    'Launcher-removal call-stack diagnostics must be installed.');
  assert.match(userscript, /Node\\.prototype\\.removeChild = function\\(child\\)/,
    'Direct DOM removals must capture the initiating JavaScript stack.');
  assert.match(userscript, /body_child_index: bodyChildIndex/,
    'Removal diagnostics must record the launcher direct-BODY index.');
  assert.match(userscript, /stack: new Error\\(`launcher removal via \\${operation}`\\)\\.stack/,
    'Removal diagnostics must capture a pre-operation stack.');
  assert.match(userscript, /installLauncherRemovalDiagnostics\\(\\);\\n  installNetworkCapture\\(\\);\\n  bootstrapUi\\(\\);/,
    'Removal diagnostics must be installed before UI bootstrap.');
  assert.match(userscript, /if \\(document\\.body\\) \\{\\n      makeLauncher\\(\\);\\n      makePanel\\(\\);/,
    'Diagnostic build must preserve the pre-recovery bootstrap behavior.');
"""
          if panel.count(old_block) != 1:
            raise SystemExit(f'panel recovery assertion block: expected exactly one match, found {panel.count(old_block)}')
          panel_path.write_text(panel.replace(old_block, new_block, 1), encoding='utf-8')
          PY

          rm .github/workflows/diagnose-launcher-removal-v0.6.158.yml

      - name: Verify syntax and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check chatgpt-conversation-markdown-export.user.js
          node --test tests/*.test.mjs
          git diff --check

      - name: Commit diagnostic product version and self-clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'diagnostics: capture launcher removal call stacks v0.6.158'
          git push origin HEAD:main
