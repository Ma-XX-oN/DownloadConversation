name: Tag v0.6.157

on:
  push:
    paths:
      - .github/workflows/tag-v0.6.157.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create and verify exact product tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target='a9cdb58138bc18d4059b5f6622a1f367757d81e5'
          tag='v0.6.157'
          if existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha 2>/dev/null); then
            test "$existing" = "$target"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="$target" >/dev/null
          fi
          actual=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha)
          test "$actual" = "$target"
          echo "Verified ${tag} -> ${actual}."
