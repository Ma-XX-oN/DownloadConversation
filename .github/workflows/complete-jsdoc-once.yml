name: Complete typed JSDoc once

on:
  push:
    paths:
      - .github/workflows/complete-jsdoc-once.yml
      - scripts/apply-complete-jsdoc-once.py
      - scripts/check-jsdoc.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve production invariants
        run: |
          grep -F '// @version      0.6.148' chatgpt-conversation-markdown-export.user.js
      - name: Apply complete typed JSDoc
        run: python scripts/apply-complete-jsdoc-once.py
      - name: Audit complete JSDoc
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Full tests
        run: node --test tests/*.test.mjs
      - name: Verify userscript changes are comments only
        run: |
          git diff --check
          if git diff -U0 -- chatgpt-conversation-markdown-export.user.js | grep -E '^[+-][^+-]' | grep -vE '^[+][[:space:]]*(/\*\*|\*|\*/)?[[:space:]]*$|^[+][[:space:]]*/\*\*|^[+][[:space:]]*\*|^-[[:space:]]*(/\*\*|\*|\*/)?[[:space:]]*$|^-[[:space:]]*/\*\*|^-[[:space:]]*\*'; then
            echo 'Unexpected non-comment userscript change detected.' >&2
            exit 1
          fi
          grep -F '// @version      0.6.148' chatgpt-conversation-markdown-export.user.js
      - name: Commit verified documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js AI_AGENT_RULES.md
          git commit -m "docs: add complete typed JSDoc contracts"
          git push
