name: Issue 140 apply reload resume route

on:
  push:
    branches:
      - issue-140-reload-resume-terminal

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply verified resume route correction
        run: python scripts/issue-140-apply.py
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Resume parser and endpoint regressions
        run: node --test tests/agent-resume-metadata-patch.test.mjs tests/agent-turn-stopwatch-stream.test.mjs
      - name: Response ownership regression
        run: node --test tests/generation-response-clone-timing.test.mjs
      - name: Shared lifecycle consumers
        run: node --test tests/agent-terminal-dispatch.test.mjs tests/agent-completion-sounds.test.mjs tests/agent-turn-stopwatch.test.mjs tests/agent-turn-stopwatch-reload.test.mjs tests/agent-favicon-state.test.mjs tests/agent-favicon-browser-selection.test.mjs tests/agent-terminal-polling-timeout.test.mjs
      - name: Stream-tail recovery regression
        run: node --test tests/stream-tail-recovery.test.mjs
      - name: Version identity regression
        run: node --test tests/version-identity.test.mjs
      - name: Commit resume route correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js
          git diff --cached --check
          git commit -m "fix(#140): observe terminal resume stream after reload"
          git push origin HEAD:issue-140-reload-resume-terminal
