name: Restore recorder status-dot UI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-recorder-status-dot.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore established recorder status-dot UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('chatgpt-conversation-markdown-export.user.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
            global text
            count = text.count(old)
            assert count == 1, f'Expected exactly one match, got {count}: {old[:120]!r}'
            text = text.replace(old, new, 1)

          replace_once('// @version      0.6.116', '// @version      0.6.117')
          replace_once("  const LAUNCHER_ID = 'tm-conversation-recorder-launcher';\n", '')

          old_styles = '''      #${LAUNCHER_ID}{position:fixed;right:18px;bottom:18px;z-index:2147483647;border:1px solid #666;border-radius:9px;background:#292929;color:#fff;padding:9px 16px;font:16px/1.45 system-ui,sans-serif;cursor:pointer}
      #${PANEL_ID}{position:fixed;right:18px;bottom:18px;z-index:2147483647;width:min(405px,calc(100vw - 36px));box-sizing:border-box;padding:16px 18px;border:1px solid #555;border-radius:16px;background:#191919;color:#f2f2f2;box-shadow:0 10px 35px rgba(0,0,0,.5);font:16px/1.45 system-ui,sans-serif}
      #${PANEL_ID} .tm-title{font-size:16px;margin:0 28px 8px 0}
      #${PANEL_ID} .tm-close{position:absolute;right:9px;top:7px;border:0;background:transparent;color:#fff;font-size:24px;cursor:pointer}
      #${PANEL_ID} .tm-status{white-space:pre-wrap;margin:10px 0 12px;min-height:24px}
      #${PANEL_ID} .tm-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
      #${PANEL_ID} select,#${PANEL_ID} button{border:1px solid #666;border-radius:9px;background:#292929;color:#fff;padding:9px 12px;font:inherit}
      #${PANEL_ID} select{flex:1;min-width:150px}
      #${PANEL_ID} button{cursor:pointer}
      #${PANEL_ID} button:disabled{opacity:.45;cursor:not-allowed}
      #${PANEL_ID} .tm-switch{margin-left:auto;border-radius:999px;padding:6px 13px;font-weight:600}
      #${PANEL_ID} .tm-label{color:#ddd}
'''
          new_styles = '''      #${PANEL_ID}{position:fixed;right:16px;bottom:16px;z-index:2147483647;font:13px/1.35 system-ui,sans-serif;color:#fff}
      #${PANEL_ID} .tm-recorder-button{width:36px;height:32px;border:1px solid #777;border-radius:9px;background:#242424;cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.35);position:relative}
      #${PANEL_ID} .tm-recorder-button:hover,#${PANEL_ID} .tm-recorder-button:focus-visible{background:#303030;border-color:#999}
      #${PANEL_ID} .tm-recorder-button::before{content:'';width:16px;height:16px;border-radius:50%;background:#d0d0d0;display:block}
      #${PANEL_ID}[data-busy="true"] .tm-recorder-button::before{background:#e53935}
      #${PANEL_ID} .tm-recorder-popup{visibility:hidden;opacity:0;pointer-events:none;position:absolute;right:0;bottom:38px;width:300px;box-sizing:border-box;padding:12px;border:1px solid rgba(127,127,127,.55);border-radius:12px;background:rgba(24,24,24,.97);box-shadow:0 6px 24px rgba(0,0,0,.35);transition:opacity .12s ease}
      #${PANEL_ID}[data-popup-open="true"] .tm-recorder-popup{visibility:visible;opacity:1;pointer-events:auto}
      #${PANEL_ID} .tm-title{font-size:13px;margin:0 28px 8px 0}
      #${PANEL_ID} .tm-close{position:absolute;right:7px;top:5px;border:0;background:transparent;color:#fff;font-size:20px;cursor:pointer;padding:0}
      #${PANEL_ID} .tm-status{white-space:pre-wrap;margin:8px 0;min-height:18px;overflow-wrap:anywhere}
      #${PANEL_ID} .tm-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
      #${PANEL_ID} select,#${PANEL_ID} .tm-action{border:1px solid #666;border-radius:7px;background:#292929;color:#fff;padding:6px 9px;font:13px/1.35 system-ui,sans-serif}
      #${PANEL_ID} select{flex:1;min-width:120px}
      #${PANEL_ID} button{cursor:pointer}
      #${PANEL_ID} button:disabled{opacity:.45;cursor:not-allowed}
      #${PANEL_ID} .tm-switch{margin-left:auto;border:1px solid #666;border-radius:12px;background:#171717;color:#bbb;min-width:44px;height:24px;padding:0 8px;font:700 11px/1 system-ui,sans-serif}
      #${PANEL_ID} .tm-switch[aria-checked="true"]{background:#2d5f35;color:#fff;border-color:#6d9b73}
      #${PANEL_ID} .tm-label{color:#ddd}
'''
          replace_once(old_styles, new_styles)

          start = text.index('  function makeLauncher() {')
          end = text.index('  function bootstrapUi() {', start)
          replacement = '''  function makePanel() {
    if (document.getElementById(PANEL_ID) || !document.body) return;
    injectStyles();
    const panel = document.createElement('div');
    panel.id = PANEL_ID;
    panel.dataset.popupOpen = 'false';
    panel.dataset.busy = 'false';
    panel.innerHTML = `
      <button class="tm-recorder-button" type="button" data-role="record" aria-label="Open conversation recorder" title="Conversation recorder"></button>
      <div class="tm-recorder-popup">
        <button class="tm-close" type="button" aria-label="Close">×</button>
        <div class="tm-title" data-role="title"></div>
        <div class="tm-status" data-role="status"></div>
        <div class="tm-row"><span class="tm-label">Diagnostics</span><select data-role="diagnostics"><option value="errors">Errors</option><option value="warnings">Warnings</option><option value="debug">Debug</option><option value="verbose">Verbose</option></select><button class="tm-action" data-role="test" type="button">Test</button></div>
        <div class="tm-row"><span class="tm-label">Screen on when extracting</span><button class="tm-switch" data-role="screen-on" type="button"></button></div>
        <div class="tm-row"><button class="tm-action" data-role="extract-jsonl" type="button">Extract JSONL</button><button class="tm-action" data-role="extract-md" type="button">Extract MD</button></div>
      </div>
    `;

    const openPopup = () => {
      panel.dataset.popupOpen = 'true';
      updateUi();
    };
    let closeTimer = null;
    const scheduleClose = () => {
      clearTimeout(closeTimer);
      closeTimer = setTimeout(() => {
        if (exportInProgress || testInProgress) return;
        if (!panel.matches(':hover') && !panel.matches(':focus-within')) panel.dataset.popupOpen = 'false';
      }, 900);
    };

    panel.querySelector('[data-role="record"]').addEventListener('click', openPopup);
    panel.addEventListener('mouseenter', openPopup);
    panel.addEventListener('mouseleave', scheduleClose);
    panel.addEventListener('focusin', openPopup);
    panel.addEventListener('focusout', scheduleClose);
    panel.querySelector('.tm-close').addEventListener('click', () => {
      panel.dataset.popupOpen = 'false';
      panel.querySelector('[data-role="record"]').focus({ preventScroll: true });
    });

    const diagnostics = panel.querySelector('[data-role="diagnostics"]');
    diagnostics.value = diagnosticsLevel;
    diagnostics.addEventListener('change', () => {
      diagnosticsLevel = diagnostics.value;
      localStorage.setItem('tm-conversation-recorder-diagnostics', diagnosticsLevel);
      logDiagnostic('debug', 'diagnostics-level-changed', { diagnostics_level: diagnosticsLevel });
    });
    panel.querySelector('[data-role="test"]').addEventListener('click', () => void runTests());
    panel.querySelector('[data-role="screen-on"]').addEventListener('click', () => {
      screenOnWhenCapturing = !screenOnWhenCapturing;
      localStorage.setItem(SCREEN_ON_STORAGE_KEY, String(screenOnWhenCapturing));
      if (screenOnWhenCapturing) void acquireWakeLock();
      else void releaseWakeLock();
      updateUi();
    });
    panel.querySelector('[data-role="extract-jsonl"]').addEventListener('click', () => void runExport('jsonl'));
    panel.querySelector('[data-role="extract-md"]').addEventListener('click', () => void runExport('md'));
    document.body.append(panel);
    updateUi();
  }

'''
          text = text[:start] + replacement + text[end:]

          replace_once('''  function bootstrapUi() {
    if (document.body) {
      makeLauncher();
      makePanel();
      return;
    }
    new MutationObserver((_, observer) => {
      if (!document.body) return;
      observer.disconnect();
      makeLauncher();
      makePanel();
    }).observe(document.documentElement, { childList: true, subtree: true });
  }
''', '''  function bootstrapUi() {
    if (document.body) {
      makePanel();
      return;
    }
    new MutationObserver((_, observer) => {
      if (!document.body) return;
      observer.disconnect();
      makePanel();
    }).observe(document.documentElement, { childList: true, subtree: true });
  }
''')

          replace_once('''    const screen = panel.querySelector('[data-role="screen-on"]');
    if (screen) screen.textContent = screenOnWhenCapturing ? 'ON' : 'OFF';
    refreshStatus();
''', '''    const screen = panel.querySelector('[data-role="screen-on"]');
    if (screen) {
      screen.textContent = screenOnWhenCapturing ? 'ON' : 'OFF';
      screen.setAttribute('aria-checked', screenOnWhenCapturing ? 'true' : 'false');
    }
    panel.dataset.busy = exportInProgress || testInProgress ? 'true' : 'false';
    if (exportInProgress || testInProgress) panel.dataset.popupOpen = 'true';
    refreshStatus();
''')

          assert '// @version      0.6.117' in text
          assert 'LAUNCHER_ID' not in text
          assert 'tm-recorder-button' in text
          assert "panel.dataset.popupOpen = 'false'" in text
          assert 'discoverPageCount' not in text
          assert 'const PAGE_TURNS = 100;' in text
          path.write_text(text, encoding='utf-8')
          PY

      - name: Syntax and UI contract checks
        shell: bash
        run: |
          node --check chatgpt-conversation-markdown-export.user.js
          grep -q '@version      0.6.117' chatgpt-conversation-markdown-export.user.js
          grep -q 'tm-recorder-button::before' chatgpt-conversation-markdown-export.user.js
          grep -q 'right:16px;bottom:16px' chatgpt-conversation-markdown-export.user.js
          grep -q 'bottom:38px;width:300px' chatgpt-conversation-markdown-export.user.js
          ! grep -q 'LAUNCHER_ID' chatgpt-conversation-markdown-export.user.js
          ! grep -q "textContent = 'Record'" chatgpt-conversation-markdown-export.user.js
          ! grep -q 'discoverPageCount' chatgpt-conversation-markdown-export.user.js

      - name: Commit restored UI and remove workflow
        shell: bash
        run: |
          rm .github/workflows/restore-recorder-status-dot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chatgpt-conversation-markdown-export.user.js .github/workflows/restore-recorder-status-dot.yml
          git commit -m 'Restore established status-dot UI in v0.6.117 [skip ci]'
          git push
