name: DC temporary artifact preparation

on:
  push:
    paths:
      - '.ci/dc-release-prepare'

permissions:
  contents: write

concurrency:
  group: dc-release-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: startsWith(github.ref, 'refs/heads/issue-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail
          line="$(head -n 1 .ci/dc-release-prepare)"
          version="${line%%#*}"
          version="$(printf '%s' "$version" | xargs)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Eq "^// @version[[:space:]]+$version$" src/userscript-header.js
      - name: Rebuild and verify exact pinned userscript
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-userscript.mjs
          node scripts/verify-userscript-artifact.mjs
      - name: Commit regenerated release artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- chatgpt-conversation-markdown-export.user.js
          if ! git diff --cached --quiet; then
            git commit -m 'release: build DC 1.11.15 with stable AICC pin'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
