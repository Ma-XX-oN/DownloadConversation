name: Issue 109 Finish

on:
  push:
    paths:
      - scripts/issue-109-finish.py

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply issue 109 final patch
        run: python scripts/issue-109-finish.py
      - name: JSDoc
        run: node scripts/check-jsdoc.mjs
      - name: Syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Local regressions
        run: node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs tests/tool-language-diagnostics.test.mjs tests/test-list-ui.test.mjs tests/recorder-panel-ui.test.mjs tests/heading-metadata-controls.test.mjs
      - name: Commit final patch and remove helpers
        shell: bash
        run: |
          rm scripts/issue-109-finish.py .github/workflows/issue-109-finish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "export: add optional turn ID heading control"
          git push origin HEAD:main
