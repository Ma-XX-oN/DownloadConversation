name: Temporary AICC 127 branch artifact builder
on:
  push:
    branches: [issue-127-live-test-matrix-v1]
permissions:
  contents: write
jobs:
  prepare-staged-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-127-live-test-matrix-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise navigation and witness fixture cases
        run: node --test tests/issue127-navigation-checkpoint.test.mjs tests/issue127-live-witness-runtime.test.mjs tests/issue127-live-test-matrix.test.mjs
      - name: Materialize deterministic userscript
        run: |
          node scripts/build-userscript.mjs
          node scripts/verify-userscript-artifact.mjs
      - name: Commit regenerated versioned artifact on existing test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js
          if ! git diff --cached --quiet; then
            git commit -m "test(#127): generate navigation-checkpoint userscript .127.8"
            git push origin HEAD:issue-127-live-test-matrix-v1
          fi
