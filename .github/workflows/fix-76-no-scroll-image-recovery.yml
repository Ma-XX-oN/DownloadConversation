name: Fix 76 no-scroll image recovery

on:
  push:
    branches: [fix-76-no-scroll-image-recovery]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove Extract MD scrolling
        shell: bash
        run: |
          git show origin/fix-76-no-scroll-image-recovery:.github/fix76_no_scroll.py > /tmp/fix76_no_scroll.py
          python3 /tmp/fix76_no_scroll.py
          node --check chatgpt-conversation-markdown-export.user.js
          python3 - <<'PY'
          from pathlib import Path
          text = Path('chatgpt-conversation-markdown-export.user.js').read_text()
          start = text.index('  async function recoverUserImages(spine) {')
          end = text.index('\n  async function runExport(kind) {', start)
          body = text[start:end]
          assert 'jumpToResolvedTarget(' not in body
          assert 'conversation-image-dom-recovery-skipped' in body
          assert 'cgResolveImagePointerMarkdown(expectedParts[index]' in body
          assert '// @version      0.6.131' in text
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js
          git commit -m 'fix: keep Extract MD image recovery non-scrolling [skip ci]'
          git push origin HEAD:main
