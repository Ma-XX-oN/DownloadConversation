name: Issue 110 console diagnostics migration

on:
  push:
    branches:
      - issue-102-single-api-snapshot

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply issue 110 migration
        run: python scripts/issue-110-console-diagnostics.py
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: Issue 110 regressions
        run: node --test tests/console-diagnostics.test.mjs
      - name: Complete DownloadConversation node test suite
        run: node --test tests/*.test.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove migration infrastructure
        run: git rm scripts/issue-110-console-diagnostics.py .github/workflows/issue110-migrate.yml
      - name: Final diff hygiene
        run: git diff --check
      - name: Verify intended diff
        run: |
          git status --short
          git diff --stat
          git diff -- chatgpt-conversation-markdown-export.user.js DESIGN.md .github/workflows/ci.yml tests/console-diagnostics.test.mjs tests/heading-metadata-controls.test.mjs tests/sediment-resolver.test.mjs tests/tool-language-diagnostics.test.mjs
      - name: Commit verified issue 110 change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'diagnostics: gate console output after status panel (#110)'
          git push
