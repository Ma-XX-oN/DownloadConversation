name: Tag v0.6.156

on:
  push:
    paths:
      - .github/workflows/tag-v0.6.156.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create and verify tag
        shell: bash
        run: |
          set -euo pipefail
          target='f1b22a00305acf30abce6133de2191027e9c48b1'
          tag='v0.6.156'
          if existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha 2>/dev/null); then
            test "$existing" = "$target"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="$target" >/dev/null
          fi
          actual=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha)
          test "$actual" = "$target"
          echo "Verified ${tag} -> ${actual}."
