name: Issue 148 restore owning version

on:
  push:
    branches:
      - issue-148-agent-favicon-state

permissions:
  contents: write

jobs:
  restore-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore receiving branch version before further work
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('chatgpt-conversation-markdown-export.user.js')
          text = path.read_text(encoding='utf-8')
          old = '// @version      1.5.0-issue.140.4'
          new = '// @version      1.5.0-issue.148.3'
          if text.count(old) != 1:
            raise SystemExit(f'Expected exactly one stale #140 version, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify exact version
        run: grep -Fxq '// @version      1.5.0-issue.148.3' chatgpt-conversation-markdown-export.user.js
      - name: Commit version restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js
          git diff --cached --check
          git commit -m "chore(#148): restore 1.5.0-issue.148.3 version identity"
          git push origin HEAD:issue-148-agent-favicon-state
