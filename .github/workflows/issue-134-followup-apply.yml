name: Issue 134 follow-up apply

on:
  push:
    branches:
      - issue-134-communication-log-file-controls
    paths:
      - .github/workflows/issue-134-followup-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-134-communication-log-file-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Issue 134 follow-up
        run: python .github/issue134_followup_apply.py
      - name: Focused Issue 134 regressions
        run: node --test tests/communication-log-file-controls.test.mjs tests/communication-log-layout-contract.test.mjs
      - name: Disk communication recorder regression
        run: node --test tests/disk-communication-recorder.test.mjs
      - name: Recorder panel UI regression
        run: node --test tests/recorder-panel-ui.test.mjs
      - name: Tail consistency regression
        run: node --test tests/tail-consistency.test.mjs
      - name: Stream tail recovery regression
        run: node --test tests/stream-tail-recovery.test.mjs
      - name: Stock network diagnostics regression
        run: node --test tests/stock-network-diagnostics.test.mjs
      - name: Directory picker gesture regression
        run: node --test tests/directory-picker-gesture.test.mjs
      - name: Directory picker JSDoc regression
        run: node tests/directory-picker-gesture-jdoc.test.mjs
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Version identity regression
        run: node --test tests/version-identity.test.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit verified revision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js DESIGN.md
          git commit -m 'fix(#134): complete communication log controls follow-up'
          git push origin HEAD:issue-134-communication-log-file-controls
