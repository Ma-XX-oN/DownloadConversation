name: Issue 134 follow-up apply

on:
  push:
    branches:
      - issue-134-communication-log-file-controls
    paths:
      - .github/workflows/issue-134-followup-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-134-communication-log-file-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize patch literal quoting
        run: python -c 'from pathlib import Path; p=Path(".github/issue134_followup_apply.py"); s=p.read_text(); p.write_text(s.replace(chr(92)*2+chr(34), chr(92)+chr(34)))'
      - name: Apply Issue 134 follow-up
        run: python .github/issue134_followup_apply.py
      - name: Focused Issue 134 regression
        run: node --test tests/communication-log-file-controls.test.mjs
      - name: Communication recorder regressions
        run: node --test tests/disk-communication-recorder.test.mjs tests/recorder-panel-ui.test.mjs
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Version identity regression
        run: node --test tests/version-identity.test.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit verified revision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js DESIGN.md
          git commit -m 'fix: finish Issue 134 live feedback'
          git push origin HEAD:issue-134-communication-log-file-controls
