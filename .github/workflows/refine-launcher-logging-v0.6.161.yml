name: Refine launcher logging v0.6.161

on:
  push:
    paths:
      - .github/workflows/refine-launcher-logging-v0.6.161.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply launcher logging cleanup
        run: python .github/scripts/refine-launcher-logging-v0.6.161.py
      - name: Verify full repository checks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-jsdoc.mjs
          node --check chatgpt-conversation-markdown-export.user.js
          node --test tests/*.test.mjs
          git diff --check
      - name: Commit product change and self-clean helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refine-launcher-logging-v0.6.161.yml
          rm .github/scripts/refine-launcher-logging-v0.6.161.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: make launcher diagnostics lightweight by default v0.6.161'
          git push origin HEAD:main
