name: Instrument launcher topology v0.6.159

on:
  push:
    paths:
      - .github/workflows/instrument-launcher-topology-v0.6.159.yml
      - .github/patch-launcher-topology-v0.6.159.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply topology and timing diagnostics
        run: python .github/patch-launcher-topology-v0.6.159.py
      - name: Verify syntax and regression tests
        run: |
          set -euo pipefail
          node --check chatgpt-conversation-markdown-export.user.js
          node --test tests/*.test.mjs
          git diff --check
      - name: Commit diagnostic product version and self-clean helpers
        run: |
          set -euo pipefail
          rm .github/workflows/instrument-launcher-topology-v0.6.159.yml
          rm .github/patch-launcher-topology-v0.6.159.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'diagnostics: map launcher topology and timing v0.6.159'
          git push origin HEAD:main
