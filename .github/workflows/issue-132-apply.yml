name: Issue 132 apply

on:
  push:
    branches:
      - issue-132-preserve-partial-communication-body

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-132-preserve-partial-communication-body
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove regression and apply Issue 132 correction
        run: python scripts/issue-132-apply.py

      - name: Focused Issue 132 regression
        run: node --test tests/disk-communication-recorder.test.mjs

      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs

      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js

      - name: Version identity regression
        run: node --test tests/version-identity.test.mjs

      - name: Diff whitespace check
        run: git diff --check

      - name: Commit verified Issue 132 correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js tests/disk-communication-recorder.test.mjs
          git commit -m "Fix #132 preserve partial communication bodies"
          git push origin HEAD:issue-132-preserve-partial-communication-body
