name: Issue 140 terminal dispatch guard

on:
  push:
    branches:
      - issue-140-success-terminal-capture

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact shared-terminal correction
        run: node scripts/issue-140-terminal-dispatch-apply.mjs
      - name: Check patch whitespace
        run: git diff --check
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Shared terminal dispatch regression
        run: node --test tests/agent-terminal-dispatch.test.mjs
      - name: Agent completion sound regression
        run: node --test tests/agent-completion-sounds.test.mjs
      - name: Agent stopwatch regressions
        run: node --test tests/agent-turn-stopwatch.test.mjs tests/agent-turn-stopwatch-stream.test.mjs tests/agent-turn-stopwatch-live-total.test.mjs
      - name: Polling-timeout regression
        run: node --test tests/agent-terminal-polling-timeout.test.mjs
      - name: Generation response clone timing regression
        run: node --test tests/generation-response-clone-timing.test.mjs
      - name: Stream-tail regression
        run: node --test tests/stream-tail-recovery.test.mjs
      - name: Stock-network regression
        run: node --test tests/stock-network-diagnostics.test.mjs
      - name: Commit verified correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js DESIGN.md \
            tests/agent-completion-sounds.test.mjs \
            tests/agent-turn-stopwatch.test.mjs \
            tests/agent-turn-stopwatch-stream.test.mjs \
            tests/agent-terminal-polling-timeout.test.mjs
          git diff --cached --check
          git commit -m 'fix(#140): unify agent terminal dispatch'
          git push origin HEAD:issue-140-success-terminal-capture
