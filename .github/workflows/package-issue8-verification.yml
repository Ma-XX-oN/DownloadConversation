name: Package Issue 8 verification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/package-issue8-verification.yml

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source before packaging
        shell: bash
        run: |
          set -euo pipefail
          grep -F '// @version      0.6.133' chatgpt-conversation-markdown-export.user.js
          node --check chatgpt-conversation-markdown-export.user.js
      - name: Build verification ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -j 'chatgpt-conversation-markdown-export(20260826-183117).zip' chatgpt-conversation-markdown-export.user.js
          unzip -t 'chatgpt-conversation-markdown-export(20260826-183117).zip'
      - uses: actions/upload-artifact@v4
        with:
          name: issue8-verification
          path: chatgpt-conversation-markdown-export(20260826-183117).zip
          if-no-files-found: error
