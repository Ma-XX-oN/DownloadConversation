name: Issue 134 regression isolation

on:
  push:
    branches:
      - issue-134-communication-log-file-controls
    paths:
      - .github/workflows/issue-134-regression-isolation.yml

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact combined command
        continue-on-error: true
        run: node --test tests/tail-consistency.test.mjs tests/stream-tail-recovery.test.mjs tests/stock-network-diagnostics.test.mjs tests/disk-communication-recorder.test.mjs tests/directory-picker-gesture.test.mjs
      - name: Exact combined command serialized
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/tail-consistency.test.mjs tests/stream-tail-recovery.test.mjs tests/stock-network-diagnostics.test.mjs tests/disk-communication-recorder.test.mjs tests/directory-picker-gesture.test.mjs
      - name: Tail plus stream
        continue-on-error: true
        run: node --test tests/tail-consistency.test.mjs tests/stream-tail-recovery.test.mjs
      - name: Stock plus disk
        continue-on-error: true
        run: node --test tests/stock-network-diagnostics.test.mjs tests/disk-communication-recorder.test.mjs
      - name: Disk plus directory
        continue-on-error: true
        run: node --test tests/disk-communication-recorder.test.mjs tests/directory-picker-gesture.test.mjs
