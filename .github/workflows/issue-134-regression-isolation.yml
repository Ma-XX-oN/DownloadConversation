name: Issue 134 regression isolation

on:
  push:
    branches:
      - issue-134-communication-log-file-controls
    paths:
      - .github/workflows/issue-134-regression-isolation.yml

jobs:
  patch-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture patch result
        shell: bash
        run: |
          set +e
          python3 .github/issue134_followup_apply.py > issue134-patch-diagnostic.txt 2>&1
          status=$?
          echo "patch_status=$status" >> issue134-patch-diagnostic.txt
          exit 0
      - name: Upload patch diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: issue134-patch-diagnostic
          path: issue134-patch-diagnostic.txt
          if-no-files-found: error
