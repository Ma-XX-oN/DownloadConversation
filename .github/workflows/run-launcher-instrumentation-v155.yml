name: Run launcher instrumentation v0.6.155

on:
  push:
    paths:
      - .github/workflows/run-launcher-instrumentation-v155.yml

permissions:
  contents: write

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply instrumentation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/instrument-launcher-v155.py

      - name: Commit instrumentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js
          git diff --cached --check
          git diff --cached --quiet && { echo 'No instrumentation changes produced.' >&2; exit 1; }
          git commit -m 'diagnostics: focus launcher removal evidence v0.6.155'
          git push origin HEAD:main
