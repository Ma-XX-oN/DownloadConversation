name: Apply Issue 123.11

on:
  push:
    branches:
      - issue-123-tail-consistency
    paths:
      - .github/workflows/apply-issue-123-11.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-123-tail-consistency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply production patch
        run: python scripts/apply-issue-123-11.py
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Version identity regression
        run: node --test tests/version-identity.test.mjs
      - name: Disk communication recorder regression
        run: node --test tests/disk-communication-recorder.test.mjs tests/directory-picker-gesture.test.mjs
      - name: Tail and network regression
        run: node --test tests/tail-consistency.test.mjs tests/stream-tail-recovery.test.mjs tests/stock-network-diagnostics.test.mjs tests/export-single-snapshot.test.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js DESIGN.md
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "logging: checkpoint communication writer and recover swaps (#123)"
          git push origin HEAD:issue-123-tail-consistency
