name: Bootstrap project TODO

on:
  push:
    paths:
      - .bootstrap-trigger

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct TODO generator
        run: |
          cat .bootstrap/generate-TODO.b64.* | base64 --decode | gzip --decompress > generate-TODO.py
      - name: Generate TODO
        run: python generate-TODO.py
      - name: Commit generated project files
        run: |
          rm -rf .bootstrap .bootstrap-trigger .github/workflows/bootstrap-todo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add TODO ledger and generator"
          git push
