name: Repin AIConversationCore once

on:
  push:
    paths:
      - .github/workflows/repin-core-once.yml

permissions:
  contents: write

jobs:
  repin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded version and core pin update
        shell: python
        run: |
          from pathlib import Path

          userscript = Path('chatgpt-conversation-markdown-export.user.js')
          text = userscript.read_text(encoding='utf-8')
          old_version = '// @version      0.6.141'
          new_version = '// @version      0.6.142'
          old_pin = 'b5afdafee5a732b35e491a2227c892b34c86370f'
          new_pin = '0382415b13b2e9266beeb94f702475272b86d038'
          assert text.count(old_version) == 1
          assert text.count(old_pin) == 1
          text = text.replace(old_version, new_version).replace(old_pin, new_pin)
          userscript.write_text(text, encoding='utf-8')

          test_path = Path('tests/core-integration.test.mjs')
          test_text = test_path.read_text(encoding='utf-8')
          assert test_text.count(old_pin) == 1
          test_text = test_text.replace(old_pin, new_pin)
          test_path.write_text(test_text, encoding='utf-8')
      - name: Run complete DownloadConversation preflight
        run: |
          node --check chatgpt-conversation-markdown-export.user.js
          node --test tests/*.test.mjs
          grep -Fq '// @version      0.6.142' chatgpt-conversation-markdown-export.user.js
          grep -Fq '0382415b13b2e9266beeb94f702475272b86d038' chatgpt-conversation-markdown-export.user.js
          grep -Fq "assert.equal(requireMatch[2], '0382415b13b2e9266beeb94f702475272b86d038');" tests/core-integration.test.mjs
      - name: Verify scoped diff
        run: |
          test -z "$(git status --short | grep -vE '^( M|\?\?) (chatgpt-conversation-markdown-export.user.js|tests/core-integration.test.mjs)$')"
      - name: Commit verified repin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js tests/core-integration.test.mjs
          git commit -m "fix: consume adaptive ChatGPT tool fences"
          git push
