name: Issue 135 pending-sound patch verifier

on:
  push:
    branches:
      - issue-135-agent-completion-sounds

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: windows-latest
    steps:
      - name: Check out DownloadConversation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply pending-sound production patch when needed
        shell: pwsh
        run: |
          if (Select-String -Quiet -Path chatgpt-conversation-markdown-export.user.js -Pattern 'let agentSoundPendingTerminal = null;') {
            Write-Host 'Production patch already present; verification-only run.'
          } else {
            python scripts/issue-135-pending-sound.py
          }

      - name: Development branch/version identity
        run: node scripts/check-development-version.mjs
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: All repository Node regressions
        shell: pwsh
        run: |
          $tests = Get-ChildItem -Path tests -Filter '*.test.mjs' -File | ForEach-Object { $_.FullName }
          node --test $tests

      - name: Check out pinned DownloadConversation AIConversationCore
        uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/AIConversationCore
          ref: cf34d9374f51ac525acfb90cfd6b247006a7bf6e
          path: .phase7-core
      - name: Check out pinned AI-General-Memory
        uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/AI-General-Memory
          ref: b2cc257cb586bd944ebca352e316780841217cc1
          path: .phase7-aigm
      - name: Check out pinned AI-transcript AIConversationCore
        uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/AIConversationCore
          ref: 4b1bebe6fd7d82d8bbb15f4ad5c1a59cfd03132a
          path: .phase7-aigm-core
      - name: Install DownloadConversation AIConversationCore dependencies
        working-directory: .phase7-core
        run: npm ci
      - name: Install AI-transcript presentation dependencies
        run: python -m pip install colorama regex
      - name: Mixed rich final-render parity
        env:
          PHASE7_CORE_ROOT: ${{ github.workspace }}/.phase7-core
          PHASE7_AIGM_ROOT: ${{ github.workspace }}/.phase7-aigm
          PHASE7_AIGM_CORE_ROOT: ${{ github.workspace }}/.phase7-aigm-core
        run: node tests/phase7-cross-consumer-parity.mjs
      - name: Markdown-shape and multi-exchange parity
        env:
          PHASE7_CORE_ROOT: ${{ github.workspace }}/.phase7-core
          PHASE7_AIGM_ROOT: ${{ github.workspace }}/.phase7-aigm
          PHASE7_AIGM_CORE_ROOT: ${{ github.workspace }}/.phase7-aigm-core
        run: node tests/phase7-cross-consumer-markdown-shape.mjs
      - name: Adversarial containment and normalization parity
        env:
          PHASE7_CORE_ROOT: ${{ github.workspace }}/.phase7-core
          PHASE7_AIGM_ROOT: ${{ github.workspace }}/.phase7-aigm
          PHASE7_AIGM_CORE_ROOT: ${{ github.workspace }}/.phase7-aigm-core
        run: node tests/phase7-cross-consumer-adversarial.mjs

      - name: Commit verified production patch
        shell: pwsh
        run: |
          git status --short
          if (git diff --quiet -- chatgpt-conversation-markdown-export.user.js) {
            Write-Host 'No production userscript change to commit.'
            exit 0
          }
          git add chatgpt-conversation-markdown-export.user.js
          git config user.name 'Ma-XX-oN'
          git config user.email 'Ma-XX-oN@users.noreply.github.com'
          git commit -m 'fix(#135): replay pending terminal cue after audio unlock'
          git push origin HEAD:issue-135-agent-completion-sounds
