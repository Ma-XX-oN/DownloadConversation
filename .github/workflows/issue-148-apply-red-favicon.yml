name: Issue 148 apply red favicon and browser candidate fix

on:
  push:
    branches:
      - issue-148-agent-favicon-state

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply production, tests, and design correction
        run: python scripts/issue-148-favicon-red-browser-fix.py
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Favicon regressions
        run: node --test tests/agent-favicon-state.test.mjs tests/agent-favicon-browser-selection.test.mjs
      - name: Completion sound regression
        run: node --test tests/agent-completion-sounds.test.mjs
      - name: Shared terminal dispatch regression
        run: node --test tests/agent-terminal-dispatch.test.mjs
      - name: Stopwatch regression
        run: node --test tests/agent-turn-stopwatch.test.mjs
      - name: Stopwatch stream regression
        run: node --test tests/agent-turn-stopwatch-stream.test.mjs
      - name: Stopwatch reload regression
        run: node --test tests/agent-turn-stopwatch-reload.test.mjs
      - name: Polling-timeout regression
        run: node --test tests/agent-terminal-polling-timeout.test.mjs
      - name: Stream-tail regression
        run: node --test tests/stream-tail-recovery.test.mjs tests/generation-response-clone-timing.test.mjs
      - name: Version identity regression
        run: node --test tests/version-identity.test.mjs
      - name: Design documentation checks
        run: |
          grep -Fq 'Observe once, normalize once, fan out' DESIGN.md
          grep -Fq 'Documentation is part of the implementation' DESIGN.md
          grep -Fq 'CHATGPT-WEB-INTEGRATION.md' DESIGN.md
          grep -Fq 'yellow → light green → red' DESIGN.md
          grep -Fq 'Agent lifecycle evidence is **observed once, normalized once, then projected to consumers**' CHATGPT-WEB-INTEGRATION.md
      - name: Commit verified correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js tests/agent-favicon-state.test.mjs tests/agent-favicon-browser-selection.test.mjs DESIGN.md
          git diff --cached --check
          git commit -m "fix(#148): project terminal favicon states to stock candidates"
          git push origin HEAD:issue-148-agent-favicon-state
