name: Restore recorder panel UI once

on:
  push:
    paths:
      - 'scripts/issue96-panel-ui-patch.py'
      - '.github/workflows/issue96-panel-ui-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/issue96-panel-ui-patch.py
      - run: node --check chatgpt-conversation-markdown-export.user.js
      - run: node --test tests/core-integration.test.mjs
      - run: node --test tests/test-list-ui.test.mjs
      - run: node --test tests/recorder-panel-ui.test.mjs
      - name: Commit Issue 96 UI restoration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js tests/recorder-panel-ui.test.mjs .github/workflows/ci.yml
          git commit -m 'ui: restore recorder panel controls'
          git push
