name: Apply production JSDoc once

on:
  push:
    paths:
      - .github/workflows/apply-jsdoc-requirement-once.yml
      - scripts/apply-jsdoc-requirement.py
      - scripts/fill-missed-jsdoc.py
      - scripts/check-jsdoc.mjs
      - tests/fallback-adaptive-fence.test.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve production invariants
        run: |
          grep -F '// @version      0.6.148' chatgpt-conversation-markdown-export.user.js
          grep -F 'd6d5f90aabab4d106265113bad09fc5984f4808e/dist/aiconversationcore.chatgpt.browser.js' chatgpt-conversation-markdown-export.user.js
      - name: Fill any named functions missed by the initial pass
        run: python scripts/fill-missed-jsdoc.py
      - name: JSDoc audit
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Full tests
        run: node --test tests/*.test.mjs
      - name: Verify userscript changes are comments only
        run: |
          git diff --check
          if git diff -U0 -- chatgpt-conversation-markdown-export.user.js | grep -E '^[+-][^+-]' | grep -vE '^[+][[:space:]]*(/\*\*|\*|\*/)?[[:space:]]*$|^[+][[:space:]]*/\*\*|^[+][[:space:]]*\*'; then
            echo 'Unexpected non-comment userscript change detected.' >&2
            exit 1
          fi
          if git diff -U0 -- chatgpt-conversation-markdown-export.user.js | grep -E '^-[^ -]'; then
            echo 'Unexpected userscript deletion detected.' >&2
            exit 1
          fi
          grep -F '// @version      0.6.148' chatgpt-conversation-markdown-export.user.js
          grep -F 'd6d5f90aabab4d106265113bad09fc5984f4808e/dist/aiconversationcore.chatgpt.browser.js' chatgpt-conversation-markdown-export.user.js
      - name: Commit verified documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js
          git commit -m "docs: complete named-function documentation"
          git push
