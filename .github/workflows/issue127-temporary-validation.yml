name: Temporary DC 127 validation lane
on:
  push:
    branches: [issue-127-live-test-matrix-v1]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test A-B-A, missing identity and reload checkpoint
        run: node --test tests/issue127-navigation-checkpoint.test.mjs tests/issue127-live-witness-runtime.test.mjs tests/issue127-live-test-matrix.test.mjs
      - name: Verify JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: Verify source syntax
        run: |
          node --check src/userscript/06-image-export-tests/07-issue127-live-test.js
          node --check src/userscript/06-image-export-tests/07a-issue127-navigation.js
