name: Apply Issue 123 Stream Tail

on:
  push:
    branches:
      - issue-123-tail-consistency

permissions:
  contents: write

jobs:
  apply:
    if: "${{ startsWith(github.event.head_commit.message, 'chore: stage issue 123 stream tail implementation') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-123-tail-consistency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply production patch
        run: node scripts/apply-issue-123-stream-tail.mjs
      - name: Verify production syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Verify production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: Run streamed-tail regressions
        run: node --test tests/tail-consistency.test.mjs tests/stream-tail-recovery.test.mjs
      - name: Run single-snapshot regression
        run: node --test tests/export-single-snapshot.test.mjs
      - name: Verify patch whitespace
        run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js DESIGN.md tests/stream-tail-recovery.test.mjs
          git diff --cached --quiet && exit 1
          git commit -m 'fix: recover issue 123 tail from live stream'
          git push origin HEAD:issue-123-tail-consistency
