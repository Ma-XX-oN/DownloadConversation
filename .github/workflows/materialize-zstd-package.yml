name: Materialize Zstd compressor package

on:
  push:
    branches:
      - issue-188-codec-neutral-compressor
    paths:
      - '.github/workflows/materialize-zstd-package.yml'
      - 'vendor/compressor/manifest.json'
      - 'vendor/compressor/bridge.js'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-188-codec-neutral-compressor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984
        with:
          version: 3.1.51
          no-cache: true
      - name: Checkout benchmark build recipe
        uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/xz-js-benchmark
          ref: 7205a3dd4fcc4788cdd60de5ae2c4175a363227c
          path: .benchmark-src
      - name: Checkout pinned Zstd source
        uses: actions/checkout@v4
        with:
          repository: facebook/zstd
          ref: 01b7154f1172432f8abe9b3bb9909e14a1176b7d
          path: .zstd-src
      - name: Build the selected Zstd WASM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .compressor-build
          emcc .benchmark-src/src/zstd-wasm-wrapper.c \
            .zstd-src/lib/common/*.c \
            .zstd-src/lib/compress/*.c \
            .zstd-src/lib/decompress/*.c \
            -I.zstd-src/lib -Os \
            -s STANDALONE_WASM=1 -s ALLOW_MEMORY_GROWTH=1 -Wl,--no-entry \
            -Wl,--export=zs_compress_bound -Wl,--export=zs_compress \
            -Wl,--export=zs_decompress -Wl,--export=zs_is_error \
            -Wl,--export=zs_malloc -Wl,--export=zs_free \
            -o .compressor-build/zstd.wasm
      - name: Materialize verified compressor payload
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const zlib = require('zlib');

          const manifestPath = 'vendor/compressor/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const wasm = fs.readFileSync('.compressor-build/zstd.wasm');
          const gzip = zlib.gzipSync(wasm, { level: 9, mtime: 0 });
          const sha256 = data => crypto.createHash('sha256').update(data).digest('hex');

          manifest.wasm_raw_bytes = wasm.length;
          manifest.wasm_raw_sha256 = sha256(wasm);
          manifest.wasm_gzip_bytes = gzip.length;
          manifest.wasm_gzip_sha256 = sha256(gzip);
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

          const dir = 'vendor/compressor/wasm-gzip-base64';
          fs.rmSync(dir, { recursive: true, force: true });
          fs.mkdirSync(dir, { recursive: true });
          const base64 = gzip.toString('base64');
          const chunkChars = 8000;
          for (let offset = 0, index = 0; offset < base64.length; offset += chunkChars, index += 1) {
            const name = String(index).padStart(2, '0') + '.txt';
            fs.writeFileSync(`${dir}/${name}`, base64.slice(offset, offset + chunkChars));
          }

          const rebuiltGzip = Buffer.from(
            fs.readdirSync(dir).sort().map(name => fs.readFileSync(`${dir}/${name}`, 'utf8')).join(''),
            'base64'
          );
          const rebuiltWasm = zlib.gunzipSync(rebuiltGzip);
          if (sha256(rebuiltGzip) !== manifest.wasm_gzip_sha256) throw new Error('gzip payload hash mismatch');
          if (sha256(rebuiltWasm) !== manifest.wasm_raw_sha256) throw new Error('WASM payload hash mismatch');
          if (!rebuiltWasm.equals(wasm)) throw new Error('WASM payload byte mismatch');

          console.log(JSON.stringify({
            raw_bytes: wasm.length,
            raw_sha256: manifest.wasm_raw_sha256,
            gzip_bytes: gzip.length,
            gzip_sha256: manifest.wasm_gzip_sha256,
            chunks: fs.readdirSync(dir).length
          }, null, 2));
          NODE
      - name: Commit materialized package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor/compressor/manifest.json vendor/compressor/wasm-gzip-base64/
          if git diff --cached --quiet; then
            echo 'Compressor package already matches the pinned GitHub build.'
            exit 0
          fi
          git commit -m 'build: materialize pinned zstd compressor package [skip ci]'
          git push origin HEAD:issue-188-codec-neutral-compressor
