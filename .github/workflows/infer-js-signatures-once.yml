name: Infer JS signatures once

on:
  push:
    paths:
      - .github/workflows/infer-js-signatures-once.yml

jobs:
  infer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Strip JSDoc without changing line count
        run: |
          python - <<'PY'
          import re
          text = open('chatgpt-conversation-markdown-export.user.js', encoding='utf-8').read()
          text = re.sub(r'/\*\*[\s\S]*?\*/', lambda m: re.sub(r'[^\n]', ' ', m.group(0)), text)
          open('/tmp/userscript.js', 'w', encoding='utf-8').write(text)
          PY
      - name: Infer declarations from implementation
        run: |
          npx --yes --package typescript tsc /tmp/userscript.js --allowJs --declaration --emitDeclarationOnly --noCheck --target ES2022 --module None --outFile /tmp/userscript.d.ts
          cat /tmp/userscript.d.ts
