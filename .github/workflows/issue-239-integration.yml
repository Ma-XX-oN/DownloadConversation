name: Issue 239 COMM Integration Verification

on:
  push:
    branches:
      - issue-239-comm-convergence-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile integrated userscript
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Run leaf and join integration tests
        run: >-
          node --test
          tests/issue247-comm-sealed-version-preservation.test.mjs
          tests/issue-248-recovery.test.cjs
          tests/comm-duplicate-version-header.test.mjs
          tests/issue-250-metadata-timestamps.cjs
          tests/issue-239-comm-integration.test.cjs
      - name: Verify generated artifact against full build inputs
        run: node scripts/build-userscript.mjs --check
