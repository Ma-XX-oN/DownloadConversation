name: Fix launcher v0.6.157

on:
  push:
    paths:
      - .github/workflows/fix-launcher-v0.6.157.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply verified launcher recovery patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script_path = Path('chatgpt-conversation-markdown-export.user.js')
          text = script_path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
            global text
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{label}: expected exactly one match, found {count}')
            text = text.replace(old, new, 1)

          replace_once('// @version      0.6.156', '// @version      0.6.157', 'userscript version')

          marker = '''  /**\n   * Handles make launcher.\n   *\n   * @returns {void} No value is returned.\n   */\n  function makeLauncher() {'''
          helper = '''  /**\n   * Reattaches the launcher if host-page reconciliation removes the userscript's direct BODY child.\n   *\n   * The observer watches only direct BODY child-list changes, so normal conversation subtree\n   * updates do not invoke it.  Recovery is deferred to the next animation frame so the host\n   * reconciliation that removed the launcher can finish before the launcher is restored.\n   *\n   * @param {HTMLElement} launcher - The launcher element to keep mounted.\n   * @returns {void} No value is returned.\n   */\n  function keepLauncherMounted(launcher) {\n    const body = document.body;\n    if (!(body instanceof HTMLBodyElement)) return;\n    let recoveryPending = false;\n    const observer = new MutationObserver(records => {\n      if (launcher.isConnected || recoveryPending) return;\n      const removed = records.some(record => [...record.removedNodes].some(node =>\n        node === launcher || (node instanceof Element && node.contains(launcher))));\n      if (!removed) return;\n      recoveryPending = true;\n      requestAnimationFrame(() => {\n        recoveryPending = false;\n        if (launcher.isConnected || document.body !== body) return;\n        body.append(launcher);\n        console.warn(`[DownloadConversation v${VERSION}] launcher restored after host-page removal`,\n          launcherLifecycleState(launcher));\n      });\n    });\n    observer.observe(body, { childList: true });\n  }\n\n'''
          replace_once(marker, helper + marker, 'launcher recovery helper insertion')

          replace_once('''    document.body.append(launcher);\n    watchLauncherLifecycle(launcher);''',
                       '''    document.body.append(launcher);\n    keepLauncherMounted(launcher);\n    watchLauncherLifecycle(launcher);''',
                       'launcher recovery installation')

          replace_once('''    if (document.body) {\n      makeLauncher();\n      makePanel();\n      return;\n    }''',
                       '''    if (document.body) {\n      makeLauncher();\n      return;\n    }''',
                       'initial panel deferral')

          replace_once('''      makeLauncher();\n      makePanel();\n    }).observe(document.documentElement, { childList: true, subtree: true });''',
                       '''      makeLauncher();\n    }).observe(document.documentElement, { childList: true, subtree: true });''',
                       'late-body panel deferral')

          script_path.write_text(text, encoding='utf-8')

          heading_path = Path('tests/heading-metadata-controls.test.mjs')
          heading = heading_path.read_text(encoding='utf-8')
          old = r"assert.match(userscript, /\\/\\/ @version      0\\.6\\.156/);"
          new = r"assert.match(userscript, /\\/\\/ @version      0\\.6\\.157/);"
          if heading.count(old) != 1:
            raise SystemExit(f'heading version expectation: expected exactly one match, found {heading.count(old)}')
          heading_path.write_text(heading.replace(old, new, 1), encoding='utf-8')

          panel_path = Path('tests/recorder-panel-ui.test.mjs')
          panel = panel_path.read_text(encoding='utf-8')
          insertion = '''  assert.match(userscript, /function keepLauncherMounted\\(launcher\\)/,\n    'Launcher must install a host-removal recovery observer.');\n  assert.match(userscript, /observer\\.observe\\(body, \\{ childList: true \\}\\)/,\n    'Launcher recovery must observe only direct BODY child-list mutations.');\n  assert.match(userscript, /requestAnimationFrame\\(\\(\\) => \\{[\\s\\S]*body\\.append\\(launcher\\)/,\n    'Launcher recovery must defer reattachment until host reconciliation finishes.');\n  assert.match(userscript, /document\\.body\\.append\\(launcher\\);\\n    keepLauncherMounted\\(launcher\\);/,\n    'Launcher recovery must be installed immediately after the initial mount.');\n  assert.doesNotMatch(userscript, /if \\(document\\.body\\) \\{\\n      makeLauncher\\(\\);\\n      makePanel\\(\\);/,\n    'Bootstrap must not pre-create the hidden panel during host hydration.');\n'''
          anchor = "  assert.match(userscript, /if \\(md\\?\\.checked\\) await runExport\\('md'\\)/);\n});\n"
          if panel.count(anchor) != 1:
            raise SystemExit(f'panel test insertion anchor: expected exactly one match, found {panel.count(anchor)}')
          panel = panel.replace(anchor, "  assert.match(userscript, /if \\(md\\?\\.checked\\) await runExport\\('md'\\)/);\n" + insertion + "});\n", 1)
          panel_path.write_text(panel, encoding='utf-8')
          PY

          rm .github/workflows/fix-launcher-v0.6.157.yml

      - name: Verify syntax and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check chatgpt-conversation-markdown-export.user.js
          node --test tests/*.test.mjs

      - name: Commit product fix and self-clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: restore launcher after host reconciliation v0.6.157'
          git push origin HEAD:main
