name: Restore v0.6.133 userscript again

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-v06133-again.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact verified userscript
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git show d272bda5570c8e4afe0403d08e742a423e01708b:chatgpt-conversation-markdown-export.user.js > chatgpt-conversation-markdown-export.user.js
          grep -F '// @version      0.6.133' chatgpt-conversation-markdown-export.user.js
          node --check chatgpt-conversation-markdown-export.user.js
          git add chatgpt-conversation-markdown-export.user.js
          git commit -m 'Restore verified v0.6.133 userscript again [skip ci]'
          git push origin main
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          git rm -f .github/workflows/restore-v06133-again.yml
          git commit -m 'Remove temporary restore workflow [skip ci]'
          git push origin main
