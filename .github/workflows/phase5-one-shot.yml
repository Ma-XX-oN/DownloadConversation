name: Phase 5 one-shot patch

on:
  push:
    paths:
      - '.github/workflows/phase5-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Phase 5 patch
        run: python3 scripts/phase5-complete.py
      - name: Syntax check
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Existing core integration regression
        run: node --test tests/core-integration.test.mjs
      - name: Commit production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js tests/core-integration.test.mjs
          git diff --cached --check
          git commit -m 'feat: complete canonical ChatGPT renderer integration'
          git push origin HEAD:main
