name: Fix issue 83 JSONL metadata

on:
  push:
    branches:
      - issue-83-jsonl-metadata

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Preserve patch script and switch to main
        run: |
          cp .github/fix83.py /tmp/fix83.py
          git fetch origin main
          git checkout -B main origin/main
      - name: Apply patch
        run: python /tmp/fix83.py
      - name: Verify and commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js
          git commit -m 'fix: prepend conversation metadata to JSONL [skip ci]'
          git push origin HEAD:main
