name: Issue 97 staging

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage Issue 97 implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('chatgpt-conversation-markdown-export.user.js')
          text = path.read_text()

          old = """  function canonicalPlainRecordBlock(record, event) {\n    const role = record?.author?.role;\n    const plainHeading = role === 'user'\n      ? '## User'\n      : record?.channel === 'commentary' ? '## ChatGPT Commentary' : '## ChatGPT';\n    const rendered = canonicalCore().renderCanonicalMarkdown([event]).trimEnd();\n    assert(rendered === plainHeading || rendered.startsWith(`${plainHeading}\\n`),\n      `AIConversationCore rendered an unexpected heading for source record ${record?.id ?? 'unknown'}.`);\n    return `${transcriptHeading(record)}${rendered.slice(plainHeading.length)}`;\n  }\n"""
          new = old + """\n  function canonicalPlainAssistantSegmentEligible(records) {\n    if (!Array.isArray(records) || records.length < 2) return false;\n    let hasAssistantMessage = false;\n    for (const record of records) {\n      if (cgIsHidden(record)) return false;\n      if (record?.author?.role !== 'assistant') return false;\n      const type = record?.content?.content_type;\n      if (type === 'thoughts') continue;\n      if (type !== 'text' || !canonicalPlainRecordEligible(record)) return false;\n      hasAssistantMessage = true;\n    }\n    return hasAssistantMessage;\n  }\n\n  function canonicalPlainAssistantSegmentBlock(records, events) {\n    assert(canonicalPlainAssistantSegmentEligible(records),\n      'AIConversationCore Assistant segment requires only plain visible Assistant records.');\n    const rendered = canonicalCore().renderCanonicalMarkdown(events).trimEnd();\n    assert(rendered === '## ChatGPT' || rendered.startsWith('## ChatGPT\\n'),\n      'AIConversationCore rendered an unexpected Assistant segment heading.');\n    const headingRecord = [...records].reverse().find(record => record?.content?.content_type === 'text') ?? records[0];\n    return `${transcriptHeading(headingRecord)}${rendered.slice('## ChatGPT'.length)}`;\n  }\n"""
          if old not in text:
            raise SystemExit('canonicalPlainRecordBlock target not found')
          text = text.replace(old, new, 1)

          old_loop = """      if (canonicalEvent && canonicalPlainRecordEligible(record)) {\n        if (record?.author?.role === 'user') {\n          flushAssistantBlock();\n          output.push(canonicalPlainRecordBlock(record, canonicalEvent));\n          continue;\n        }\n        if (record?.author?.role === 'assistant' && pendingThoughts.length === 0) {\n          output.push(canonicalPlainRecordBlock(record, canonicalEvent));\n          continue;\n        }\n      }\n"""
          new_loop = """      if (canonicalEvent && canonicalPlainRecordEligible(record)) {\n        if (record?.author?.role === 'user') {\n          flushAssistantBlock();\n          output.push(canonicalPlainRecordBlock(record, canonicalEvent));\n          continue;\n        }\n        if (record?.author?.role === 'assistant' && pendingThoughts.length === 0) {\n          output.push(canonicalPlainRecordBlock(record, canonicalEvent));\n          continue;\n        }\n        if (record?.author?.role === 'assistant' && pendingThoughts.length > 0) {\n          const segmentRecords = [...pendingThoughts, record];\n          const segmentEvents = segmentRecords\n            .map(item => canonicalEventBySourceRecord.get(item.id) ?? null)\n            .filter(Boolean);\n          if (segmentEvents.length === segmentRecords.length &&\n              canonicalPlainAssistantSegmentEligible(segmentRecords)) {\n            output.push(canonicalPlainAssistantSegmentBlock(segmentRecords, segmentEvents));\n            pendingThoughts = [];\n            continue;\n          }\n        }\n      }\n"""
          if old_loop not in text:
            raise SystemExit('render loop target not found')
          text = text.replace(old_loop, new_loop, 1)
          text = text.replace('// @version      0.6.138', '// @version      0.6.139', 1)
          path.write_text(text)

          test_path = Path('tests/core-integration.test.mjs')
          test_text = test_path.read_text()
          test_text = test_text.replace(
            "this.__phase5 = { canonicalEventsBySourceRecord, canonicalPlainRecordEligible, canonicalPlainRecordBlock };",
            "this.__phase5 = { canonicalEventsBySourceRecord, canonicalPlainRecordEligible, canonicalPlainRecordBlock, canonicalPlainAssistantSegmentEligible, canonicalPlainAssistantSegmentBlock };",
            1)
          old_test = """  assert.match(userscript, /pendingThoughts\\.length === 0/,\n    'Assistant records with pending thoughts must remain on the existing host composition path.');\n});\n"""
          new_test = """});\n\ntest('plain Assistant thought segments use the canonical renderer', () => {\n  const thought = {\n    id: 'thought-1',\n    author: { role: 'assistant', name: null, metadata: {} },\n    create_time: 200,\n    update_time: null,\n    content: {\n      content_type: 'thoughts',\n      thoughts: [{ summary: 'Checking', content: 'Inspecting the request.' }]\n    },\n    metadata: {},\n    recipient: 'all',\n    channel: 'analysis',\n    status: 'finished_successfully',\n    end_turn: false\n  };\n  const final = textRecord('assistant-final', 'assistant', 'Done.', { create_time: 201 });\n  const records = [thought, final];\n  const eventsByRecord = phase5.canonicalEventsBySourceRecord(records);\n  const events = records.map(record => eventsByRecord.get(record.id));\n  assert.equal(phase5.canonicalPlainAssistantSegmentEligible(records), true);\n  const rendered = phase5.canonicalPlainAssistantSegmentBlock(records, events);\n  assert.match(rendered, /^## ChatGPT <!-- turn_id=assistant-final -->/);\n  assert.match(rendered, /<summary>Thoughts<\\/summary>/);\n  assert.match(rendered, /Inspecting the request\\./);\n  assert.match(rendered, /> Done\\./);\n});\n"""
          if old_test not in test_text:
            raise SystemExit('core integration rich fallback test target not found')
          test_text = test_text.replace(old_test, new_test, 1)
          test_path.write_text(test_text)
          PY

          node --check chatgpt-conversation-markdown-export.user.js
          node --test tests/core-integration.test.mjs tests/test-list-ui.test.mjs tests/recorder-panel-ui.test.mjs

      - name: Commit staged implementation
        run: |
          git config user.name "Ma-XX-oN"
          git config user.email "Ma-XX-oN@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js tests/core-integration.test.mjs
          git commit -m "feat: migrate plain Assistant thought segments"
          git push
