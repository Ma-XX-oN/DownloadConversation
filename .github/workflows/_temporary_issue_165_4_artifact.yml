name: Temporary issue 165.4 generated artifact

on:
  push:
    branches:
      - issue-165-repoworkflow-adoption
    paths:
      - .github/workflows/_temporary_issue_165_4_artifact.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-165-repoworkflow-adoption
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure generated-artifact identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build and independently verify generated userscript
        shell: bash
        run: |
          node scripts/build-userscript.mjs
          node scripts/verify-userscript-artifact.mjs
          changed="$(git status --porcelain)"
          if [ "$changed" != " M chatgpt-conversation-markdown-export.user.js" ]; then
            echo "Unexpected generated-artifact write set:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git add chatgpt-conversation-markdown-export.user.js
          git commit -m "build(test-cycle): materialize 1.5.0-issue.165.4 [skip ci]"
          git push origin HEAD:issue-165-repoworkflow-adoption
