name: Apply issue 109

on:
  push:
    paths:
      - '.github/workflows/issue-109-run.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply feature patch
        run: python scripts/issue-109-apply.py
      - name: Run repository gates
        run: |
          node --check chatgpt-conversation-markdown-export.user.js
          node scripts/check-jsdoc.mjs
          node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs tests/tool-language-diagnostics.test.mjs
          node --test tests/test-list-ui.test.mjs
          node --test tests/recorder-panel-ui.test.mjs
          git diff --check
      - name: Commit gated feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js tests/core-integration.test.mjs tests/recorder-panel-ui.test.mjs DESIGN.md
          git commit -m 'export: add Markdown heading metadata controls'
          git push
