name: Issue 149 finalize version-guard documentation

on:
  push:
    branches:
      - issue-149-version-identity-guard

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Document version-first invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('DESIGN.md')
          text = path.read_text(encoding='utf-8')
          needle = """use the plain `x.y.0` form for that promotion.\n\nThe AIConversationCore browser dependency remains pinned to an exact commit."""
          replacement = """use the plain `x.y.0` form for that promotion.\n\nVersion identity is established before issue work proceeds. On every issue-owned development branch, setting the correct `x.y.z-issue.<issue>.<iteration>` version is the first branch change before feature, production, test, documentation, or integration work. After integrating a dependency branch whose version belongs to another issue, the receiving branch immediately restores or advances its own issue-qualified version before any other work continues. Version correction is never deferred to cleanup, CI completion, user testing, or release preparation.\n\nOrdinary CI runs `scripts/check-development-version.mjs` before feature-specific verification. The guard derives the owning issue from `issue-<number>-...` branch identity, parses exactly one production userscript `@version`, and fails when the issue qualifier is malformed or belongs to a different issue. The guard validates only; it never rewrites a version or supplies a fallback. Non-issue branches do not invent an issue owner requirement.\n\nThe AIConversationCore browser dependency remains pinned to an exact commit."""
          if text.count(needle) != 1:
            raise SystemExit(f'Expected one version-design insertion point, found {text.count(needle)}')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Verify guard and fixed regression
        run: |
          node scripts/check-development-version.mjs --branch issue-149-version-identity-guard
          node --test tests/development-version-guard.test.mjs
          git diff --check
      - name: Remove temporary finalize workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-149-finalize.yml
          git add DESIGN.md
          git commit -m "docs(#149): enforce version-first branch identity"
          git push origin HEAD:issue-149-version-identity-guard
