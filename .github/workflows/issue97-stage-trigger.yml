name: Issue 97 staging trigger

on:
  push:
    paths:
      - '.github/workflows/issue97-stage-trigger.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Issue 97 implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('chatgpt-conversation-markdown-export.user.js')
          text = path.read_text()
          stage = Path('.github/workflows/issue97-stage.yml').read_text()
          body = stage.split("          python - <<'PY'\n", 1)[1].split("          PY\n", 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(body, 'issue97-stage.py', 'exec'), {})
          PY

          node --check chatgpt-conversation-markdown-export.user.js
          node --test tests/core-integration.test.mjs tests/test-list-ui.test.mjs tests/recorder-panel-ui.test.mjs

          git config user.name "Ma-XX-oN"
          git config user.email "Ma-XX-oN@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js tests/core-integration.test.mjs
          git commit -m "feat: migrate plain Assistant thought segments"
          git pull --rebase origin main
          git push
