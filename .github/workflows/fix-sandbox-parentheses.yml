name: Fix sandbox parentheses rewrite

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-sandbox-parentheses.yml
      - .github/scripts/fix_issue8.py

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix_issue8.py
      - name: Syntax check
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Verify focused source changes
        shell: bash
        run: |
          set -euo pipefail
          grep -F "fixture(phase2).txt" chatgpt-conversation-markdown-export.user.js
          grep -F "fixture((phase2)).txt" chatgpt-conversation-markdown-export.user.js
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js
          git commit -m 'fix: preserve parentheses in sandbox Markdown links [skip ci]'
          git push origin main
      - name: Remove temporary files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          git rm -f .github/workflows/fix-sandbox-parentheses.yml .github/scripts/fix_issue8.py
          git commit -m 'Remove temporary Issue 8 fix workflow [skip ci]'
          git push origin main
