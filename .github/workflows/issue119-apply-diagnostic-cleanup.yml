name: Issue 119 apply diagnostic cleanup

on:
  push:
    branches: [issue-119-image-export-timing]
    paths: [.github/workflows/issue119-apply-diagnostic-cleanup.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-119-image-export-timing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify
        shell: bash
        run: |
          git apply --check scripts/issue119-diagnostic-cleanup.patch
          git apply scripts/issue119-diagnostic-cleanup.patch
          git diff --check
          node --check chatgpt-conversation-markdown-export.user.js
          node scripts/check-jsdoc.mjs
          node --test tests/tool-language-diagnostics.test.mjs tests/sediment-resolver.test.mjs tests/heading-metadata-controls.test.mjs
          node --test tests/*.test.mjs
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js tests/heading-metadata-controls.test.mjs tests/sediment-resolver.test.mjs tests/tool-language-diagnostics.test.mjs
          git commit -m 'fix: redact signed diagnostics and remove stale tool dumps (#119)'
          git push origin HEAD:issue-119-image-export-timing
