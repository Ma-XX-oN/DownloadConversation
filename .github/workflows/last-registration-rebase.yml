name: Generate Last rebase DC artifact
on:
  push:
    branches: [issue-360-last-registration-rebase-20261024]
    paths: ['src/**', 'tests/issue298-registered-activity-bridge.test.mjs', '.github/workflows/last-registration-rebase.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-userscript.mjs
      - run: node --test tests/issue298-registered-activity-bridge.test.mjs
      - run: node scripts/verify-userscript-artifact.mjs
      - name: Commit generated userscript on staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js
          if ! git diff --cached --quiet; then
            git commit -m "build(#360): rebuild Last-enabled registered userscript"
            git push origin HEAD:issue-360-last-registration-rebase-20261024
          fi
