name: Issue 139 guarded correction

on:
  push:
    branches:
      - issue-139-terminal-delivery-timeout

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply asserted correction
        run: python scripts/apply-issue-139.py
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Polling-timeout regression
        run: node --test tests/agent-terminal-polling-timeout.test.mjs
      - name: Agent completion sound regression
        run: node --test tests/agent-completion-sounds.test.mjs
      - name: Agent turn stopwatch regression
        run: node --test tests/agent-turn-stopwatch.test.mjs
      - name: Agent turn stopwatch stream integration
        run: node --test tests/agent-turn-stopwatch-stream.test.mjs
      - name: Agent turn stopwatch live total
        run: node --test tests/agent-turn-stopwatch-live-total.test.mjs
      - name: Stream tail recovery regression
        run: node --test tests/stream-tail-recovery.test.mjs
      - name: Stock network diagnostics regression
        run: node --test tests/stock-network-diagnostics.test.mjs
      - name: Recorder panel UI regression
        run: node --test tests/recorder-panel-ui.test.mjs tests/modal-focus-retention.test.mjs tests/heading-metadata-controls.test.mjs
      - name: Commit verified correction
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js DESIGN.md tests/agent-completion-sounds.test.mjs tests/agent-turn-stopwatch.test.mjs tests/agent-turn-stopwatch-stream.test.mjs tests/agent-terminal-polling-timeout.test.mjs
          git diff --cached --quiet && { echo "No correction produced"; exit 1; }
          git commit -m "fix(#139): handle terminal polling timeout"
          git push
