name: Repin tool-result text/code once

on:
  push:
    paths:
      - .github/workflows/repin-tool-result-text-code-once.yml
      - scripts/repin-tool-result-text-code.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded repin and regression
        run: python scripts/repin-tool-result-text-code.py
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Focused integration regression
        run: node --test tests/phase5-rich-core-integration.test.mjs tests/core-integration.test.mjs
      - name: Full tests
        run: node --test tests/*.test.mjs
      - name: Verify scoped diff
        run: |
          git status --short
          test -z "$(git status --short | grep -vE '^( M|\?\?) (chatgpt-conversation-markdown-export.user.js|tests/core-integration.test.mjs|tests/phase5-rich-core-integration.test.mjs)$')"
      - name: Commit verified consumer change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs
          git commit -m "fix: keep text and code tool results canonical"
          git push
