name: Apply single export snapshot fix

on:
  push:
    paths:
      - .github/workflows/fix-single-export-snapshot-apply.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal production refactor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('chatgpt-conversation-markdown-export.user.js')
          text = path.read_text(encoding='utf-8')
          assert text.count('// @version      0.6.143') == 1
          text = text.replace('// @version      0.6.143', '// @version      0.6.144', 1)

          start = text.index('  async function runExport(kind) {')
          end = text.index('\n  async function testApiPaginationLogic()', start)
          block = text[start:end]
          assert block.count('await fetchConversationPages(') == 1
          block = block.replace('  async function runExport(kind) {', '  async function runExport(kinds) {', 1)
          block = block.replace(
            "    if (exportInProgress || testInProgress || jumpInProgress) return;\n    const conversationId = currentConversationId();",
            "    if (exportInProgress || testInProgress || jumpInProgress) return;\n    const selectedKinds = [...new Set((Array.isArray(kinds) ? kinds : [kinds])\n      .filter(kind => kind === 'jsonl' || kind === 'md'))];\n    assert(selectedKinds.length > 0, 'At least one export format must be selected.');\n    const conversationId = currentConversationId();",
            1)
          block = block.replace('    exportKind = kind;', "    exportKind = selectedKinds.join('+');", 1)
          block = block.replace("      if (kind === 'jsonl') {", "      if (selectedKinds.includes('jsonl')) {", 1)
          block = block.replace(
            "      } else {\n        progressState.stage = 'recovering-images';",
            "      }\n      if (selectedKinds.includes('md')) {\n        progressState.stage = 'recovering-images';",
            1)
          block = block.replace(
            "      setStatus(\n        `${kind === 'md' ? 'Markdown' : 'JSONL'} extraction failed: ` +\n        `${error instanceof Error ? error.message : String(error)}`\n      );",
            "      const label = selectedKinds.length === 1\n        ? selectedKinds[0] === 'md' ? 'Markdown' : 'JSONL'\n        : 'Export';\n      setStatus(`${label} extraction failed: ${error instanceof Error ? error.message : String(error)}`);",
            1)
          assert 'kind ===' not in block
          assert block.count('await fetchConversationPages(') == 1
          text = text[:start] + block + text[end:]

          old_ui = """    const runSelectedExports = async () => {
              const jsonl = panel.querySelector('[data-role=\"format-jsonl\"]');
              const md = panel.querySelector('[data-role=\"format-md\"]');
              if (jsonl?.checked) await runExport('jsonl');
              if (md?.checked) await runExport('md');
            };
"""
          new_ui = """    const runSelectedExports = async () => {
              const jsonl = panel.querySelector('[data-role=\"format-jsonl\"]');
              const md = panel.querySelector('[data-role=\"format-md\"]');
              const kinds = [];
              if (jsonl?.checked) kinds.push('jsonl');
              if (md?.checked) kinds.push('md');
              if (kinds.length) await runExport(kinds);
            };
"""
          assert text.count(old_ui) == 1
          text = text.replace(old_ui, new_ui, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Add focused orchestration regression
        run: |
          cat > tests/export-orchestration.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import test from 'node:test';
          import vm from 'node:vm';

          const userscript = await readFile(new URL('../chatgpt-conversation-markdown-export.user.js', import.meta.url), 'utf8');
          const start = userscript.indexOf('  async function runExport(kinds) {');
          const end = userscript.indexOf('\n  async function testApiPaginationLogic()', start);
          assert.ok(start >= 0 && end > start, 'Production runExport implementation is missing.');
          const source = userscript.slice(start, end);

          function harness() {
            const state = { fetchCount: 0, jsonlSpine: null, markdownSpine: null, recoverySpine: null };
            const context = {
              exportInProgress: false, testInProgress: false, jumpInProgress: false,
              exportKind: null, progressState: null, performance: { now: () => 1 }, Blob,
              assert(condition, message) { if (!condition) throw new Error(message); },
              currentConversationId: () => 'conversation-1',
              startStatusTimer() {}, stopStatusTimer() {}, updateUi() {}, refreshStatus() {}, setStatus() {},
              acquireWakeLock: async () => {}, releaseWakeLock: async () => {},
              async fetchConversationPages(_id, progress) {
                state.fetchCount += 1;
                progress?.({ page_count: 1, raw_record_count: 2 });
                return { pages: [{ messages: [{ id: 'a' }, { id: 'b' }] }] };
              },
              conversationSpineFromPages: pages => ({ records: pages[0].messages.map(message => ({ message })) }),
              sanitizeFileName: value => value, conversationTitle: () => 'Conversation',
              apiRecordsJsonl(spine) { state.jsonlSpine = spine; return 'jsonl'; },
              async recoverUserImages(spine) { state.recoverySpine = spine; return new Map(); },
              renderConversationMarkdown(spine, progress) {
                state.markdownSpine = spine;
                progress?.({ record_number: 2, record_count: 2 });
                return 'markdown';
              },
              downloadBlob() {}
            };
            vm.runInNewContext(`${source}\nthis.__runExport = runExport;`, context);
            return { state, runExport: context.__runExport };
          }

          for (const [name, kinds] of [['JSONL', ['jsonl']], ['Markdown', ['md']], ['dual', ['jsonl', 'md']]]) {
            test(`${name} extraction acquires the Conversation API exactly once`, async () => {
              const { state, runExport } = harness();
              await runExport(kinds);
              assert.equal(state.fetchCount, 1);
              if (kinds.includes('jsonl')) assert.ok(state.jsonlSpine);
              if (kinds.includes('md')) assert.ok(state.markdownSpine);
              if (kinds.length === 2) {
                assert.strictEqual(state.jsonlSpine, state.markdownSpine,
                  'Both output serializers must receive the identical in-memory spine.');
                assert.strictEqual(state.recoverySpine, state.markdownSpine,
                  'Image recovery must use that same source snapshot.');
              }
            });
          }
          EOF
      - name: Run complete DownloadConversation preflight
        run: |
          node --check chatgpt-conversation-markdown-export.user.js
          node --test tests/*.test.mjs
          grep -Fq '// @version      0.6.144' chatgpt-conversation-markdown-export.user.js
          test "$(sed -n '/async function runExport(kinds)/,/async function testApiPaginationLogic/p' chatgpt-conversation-markdown-export.user.js | grep -c 'await fetchConversationPages')" -eq 1
          ! grep -Fq "if (jsonl?.checked) await runExport('jsonl')" chatgpt-conversation-markdown-export.user.js
          ! grep -Fq "if (md?.checked) await runExport('md')" chatgpt-conversation-markdown-export.user.js
      - name: Verify scoped diff
        run: |
          test -z "$(git status --short | grep -vE '^( M|\?\?) (chatgpt-conversation-markdown-export.user.js|tests/export-orchestration.test.mjs)$')"
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js tests/export-orchestration.test.mjs
          git commit -m "fix: reuse one API snapshot for selected exports"
          git push
