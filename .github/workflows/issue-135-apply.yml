name: Issue 135 apply shared-watcher correction

on:
  push:
    branches:
      - issue-135-agent-completion-sounds

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal production correction
        shell: python
        run: |
          from pathlib import Path

          path = Path('chatgpt-conversation-markdown-export.user.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              '// @version      1.5.0',
              '// @version      1.5.0-issue.135.2'
            ),
            (
              'const providerCode = candidate.code ?? candidate?.error?.code ?? null;',
              'const providerCode = candidate.error_code ?? candidate.code ?? candidate?.error?.code ?? null;'
            ),
            (
              "if (candidate.type === 'error' && providerCode === 'conversation_too_large') return 'error';",
              "if (providerCode === 'conversation_too_large' &&\n          (candidate.type === 'error' || candidate.error_code === 'conversation_too_large')) return 'error';"
            ),
            (
              "const finalMessage = kind === 'success' ? agentTerminalSuccessfulFinal(capture) : null;",
              "const finalMessage = agentTerminalSuccessfulFinal(capture);"
            ),
            (
              "const key = terminal?.terminal_key ?? null;\n    if (!kind) return;",
              "const key = terminal?.terminal_key ?? null;\n    const soundKey = key && kind ? `${key}:${kind}` : null;\n    if (!kind) return;"
            ),
            (
              "if (!key) return;\n    if (agentSoundTerminalKeys.has(key)) {",
              "if (!soundKey) return;\n    if (agentSoundTerminalKeys.has(soundKey)) {"
            ),
            (
              'if (playAgentSound(kind)) agentSoundRememberTerminalKey(key);',
              'if (playAgentSound(kind)) agentSoundRememberTerminalKey(soundKey);'
            ),
            (
              '* Retains one terminal turn key in a bounded insertion-ordered set.',
              '* Retains one terminal sound-event identity in a bounded insertion-ordered set.'
            ),
            (
              '* @param {string} key - Stable terminal turn key.',
              '* @param {string} key - Stable terminal sound-event key.'
            )
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
            text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Completion sound regression
        run: node --test tests/agent-completion-sounds.test.mjs
      - name: Shared terminal dispatch regression
        run: node --test tests/agent-terminal-dispatch.test.mjs
      - name: Polling-timeout regression
        run: node --test tests/agent-terminal-polling-timeout.test.mjs
      - name: Stopwatch regression
        run: node --test tests/agent-turn-stopwatch.test.mjs
      - name: Stopwatch stream regression
        run: node --test tests/agent-turn-stopwatch-stream.test.mjs
      - name: Stream-tail recovery regression
        run: node --test tests/stream-tail-recovery.test.mjs
      - name: Version identity regression
        run: node --test tests/version-identity.test.mjs
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js
          git diff --cached --check
          git commit -m "fix(#135): preserve distinct terminal sound kinds"
          git push origin HEAD:issue-135-agent-completion-sounds
