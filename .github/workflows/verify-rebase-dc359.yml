name: DC 359 independent rebase acceptance matrix
on:
  push:
    branches:
      - verify-rebase-dc359-20261024
permissions:
  contents: read
jobs:
  test:
    name: matrix-${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: full, command: 'python scripts/repoworkflow-validate.py' }
          - { label: plugin, command: 'node --test tests/agent-plugin-background-fetch.test.mjs' }
          - { label: inventory, command: 'node --test tests/ci-test-inventory.test.mjs' }
          - { label: typescript, command: 'node scripts/check-userscript-types.mjs' }
          - { label: build, command: 'node scripts/build-userscript.mjs --check' }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Establish ancestry
        run: git merge-base --is-ancestor e6a083cd883e99e9d30e7ba440062bea6060b9be HEAD
      - name: Run ${{ matrix.label }} acceptance
        run: ${{ matrix.command }}
