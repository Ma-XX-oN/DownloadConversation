name: Issue 110 Console Diagnostics

on:
  push:
    paths:
      - scripts/issue-110-console-diagnostics.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply console diagnostics patch
        run: python scripts/issue-110-console-diagnostics.py
      - name: JSDoc
        run: node scripts/check-jsdoc.mjs
      - name: Syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Regressions
        run: node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs tests/tool-language-diagnostics.test.mjs tests/test-list-ui.test.mjs tests/recorder-panel-ui.test.mjs tests/heading-metadata-controls.test.mjs tests/console-diagnostics.test.mjs
      - name: Commit tested product patch
        shell: bash
        run: |
          rm scripts/issue-110-console-diagnostics.py
          git checkout -- .github/workflows/issue-110-console-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "diagnostics: mirror recorder logging to console"
          git push origin HEAD:main
