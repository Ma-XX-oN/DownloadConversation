name: Compare rich ChatGPT renderer outputs
on: push
jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public fixture and Python source
        run: |
          git clone --depth 1 https://github.com/Ma-XX-oN/AIConversationCore.git /tmp/ai-conversation-core
          git clone --depth 1 https://github.com/Ma-XX-oN/AI-General-Memory.git /tmp/ai-general-memory
      - name: Render current AI-transcript.py
        run: |
          mkdir -p /tmp/comparison
          python /tmp/ai-general-memory/scripts/AI-transcript.py \
            --chatgpt \
            --file /tmp/ai-conversation-core/tests/fixtures/chatgpt/chatgpt-direct.jsonl \
            --color=never \
            > /tmp/comparison/ai-transcript.md
      - name: Render current DownloadConversation production renderer
        run: |
          cat > /tmp/render-download-conversation.cjs <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          globalThis.localStorage = { getItem: () => null, setItem: () => {} };
          globalThis.sessionStorage = { getItem: () => null, setItem: () => {} };
          globalThis.window = {};
          globalThis.document = {};

          const userscriptPath = 'chatgpt-conversation-markdown-export.user.js';
          let source = fs.readFileSync(userscriptPath, 'utf8');
          const marker = "  document.addEventListener('visibilitychange'";
          if (!source.includes(marker)) throw new Error('Could not locate userscript bootstrap marker.');
          source = source.replace(
            marker,
            "  globalThis.__dcProductionRenderer = { renderConversationMarkdown };\n  return;\n\n" + marker
          );
          vm.runInThisContext(source, { filename: userscriptPath });
          if (!globalThis.__dcProductionRenderer?.renderConversationMarkdown) {
            throw new Error('Production renderConversationMarkdown was not exposed.');
          }

          const fixture = fs.readFileSync(
            '/tmp/ai-conversation-core/tests/fixtures/chatgpt/chatgpt-direct.jsonl',
            'utf8'
          ).split(/\r?\n/).filter(line => line.trim()).map(line => JSON.parse(line));
          const spine = {
            records: fixture.map((message, ordinal) => ({
              ordinal,
              message_id: message.id,
              role: message?.author?.role ?? null,
              message
            }))
          };
          const markdown = globalThis.__dcProductionRenderer.renderConversationMarkdown(spine);
          fs.writeFileSync('/tmp/comparison/download-conversation.md', markdown, 'utf8');
          NODE
          node /tmp/render-download-conversation.cjs
      - name: Record provenance and diff
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess

          out = pathlib.Path('/tmp/comparison')
          fixture = pathlib.Path('/tmp/ai-conversation-core/tests/fixtures/chatgpt/chatgpt-direct.jsonl')
          py_script = pathlib.Path('/tmp/ai-general-memory/scripts/AI-transcript.py')
          dc_script = pathlib.Path('chatgpt-conversation-markdown-export.user.js')
          def sha256(path):
            return hashlib.sha256(path.read_bytes()).hexdigest()
          data = {
            'fixture_commit': subprocess.check_output(['git','-C','/tmp/ai-conversation-core','rev-parse','HEAD'], text=True).strip(),
            'fixture_sha256': sha256(fixture),
            'ai_transcript_commit': subprocess.check_output(['git','-C','/tmp/ai-general-memory','rev-parse','HEAD'], text=True).strip(),
            'ai_transcript_script_sha256': sha256(py_script),
            'ai_transcript_output_sha256': sha256(out / 'ai-transcript.md'),
            'download_conversation_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
            'download_conversation_script_sha256': sha256(dc_script),
            'download_conversation_output_sha256': sha256(out / 'download-conversation.md'),
            'download_conversation_execution': 'Production userscript loaded unchanged except for a test-only injection exposing renderConversationMarkdown and returning before UI/bootstrap side effects.',
            'image_scope': 'No authenticated image-resource recovery data supplied; renderer fallback semantics only.'
          }
          (out / 'provenance.json').write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          diff -u /tmp/comparison/ai-transcript.md /tmp/comparison/download-conversation.md > /tmp/comparison/raw.diff || true
      - name: Print comparison evidence
        run: |
          echo '===== PROVENANCE ====='
          cat /tmp/comparison/provenance.json
          echo '===== AI-TRANSCRIPT OUTPUT ====='
          cat /tmp/comparison/ai-transcript.md
          echo '===== DOWNLOADCONVERSATION OUTPUT ====='
          cat /tmp/comparison/download-conversation.md
          echo '===== RAW DIFF ====='
          cat /tmp/comparison/raw.diff
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-direct-renderer-comparison
          path: /tmp/comparison
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/compare-rich-chatgpt-renderers.yml
          git commit -m "chore: remove temporary rich ChatGPT comparison workflow"
          git push
