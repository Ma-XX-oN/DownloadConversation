name: Issue 140 stable release promotion

on:
  push:
    branches:
      - issue-140-success-terminal-capture

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Promote accepted build to 1.5.0
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
            text = path.read_text(encoding='utf-8')
            count = text.count(old)
            assert count == 1, f'{path}: expected exactly one {old!r}, found {count}'
            path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
            Path('chatgpt-conversation-markdown-export.user.js'),
            '// @version      1.4.0-issue.140.3',
            '// @version      1.5.0'
          )
          replace_once(
            Path('tests/agent-turn-stopwatch-reload.test.mjs'),
            r'assert.match(userscript, /@version\s+1\.4\.0-issue\.140\.3/);',
            r'assert.match(userscript, /@version\s+1\.5\.0/);'
          )
          replace_once(
            Path('tests/agent-turn-stopwatch.test.mjs'),
            r'assert.match(userscript, /@version\s+1\.4\.0/);',
            r'assert.match(userscript, /@version\s+1\.5\.0/);'
          )
          PY
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Version identity regression
        run: node --test tests/version-identity.test.mjs
      - name: Reload stopwatch restoration regression
        run: node --test tests/agent-turn-stopwatch-reload.test.mjs
      - name: Agent terminal shared dispatch regression
        run: node --test tests/agent-terminal-dispatch.test.mjs
      - name: Agent completion sound regression
        run: node --test tests/agent-completion-sounds.test.mjs
      - name: Agent turn stopwatch regression
        run: node --test tests/agent-turn-stopwatch.test.mjs
      - name: Agent turn stopwatch stream integration
        run: node --test tests/agent-turn-stopwatch-stream.test.mjs
      - name: Agent turn stopwatch live total
        run: node --test tests/agent-turn-stopwatch-live-total.test.mjs
      - name: Agent terminal polling-timeout regression
        run: node --test tests/agent-terminal-polling-timeout.test.mjs
      - name: Generation response clone timing
        run: node --test tests/generation-response-clone-timing.test.mjs
      - name: Stream tail recovery regression
        run: node --test tests/stream-tail-recovery.test.mjs
      - name: Stock network diagnostics regression
        run: node --test tests/stock-network-diagnostics.test.mjs
      - name: Commit stable promotion
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js tests/agent-turn-stopwatch-reload.test.mjs tests/agent-turn-stopwatch.test.mjs
          git diff --cached --quiet && { echo "No stable promotion produced"; exit 1; }
          git commit -m "release(#140): promote accepted fixes to 1.5.0"
          git push
