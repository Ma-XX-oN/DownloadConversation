name: Issue 243 Integration Verification
on:
  push:
    branches: [issue-243-final-version-integration-v3]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GEN and COMM integration
        run: |
          node --test tests/gen-provenance-convergence.test.mjs tests/gen-snapshot-restore.test.mjs tests/gen-startup-version.test.mjs tests/gen-version-convergence.test.mjs tests/gen-boundary-version.test.mjs tests/issue-241-comm-boundary.test.cjs tests/issue-242-combined-version-export.test.cjs tests/issue-239-comm-integration.test.cjs
      - name: Build verify documentation and segment size
        run: |
          node scripts/build-userscript.mjs
          node --check chatgpt-conversation-markdown-export.user.js
          node scripts/check-jsdoc.mjs
          node scripts/build-userscript.mjs --check
          node --test tests/modular-userscript-build.test.mjs
      - name: Commit artifact
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add chatgpt-conversation-markdown-export.user.js
          if ! git diff --cached --quiet; then
            git commit -m "build(#243): regenerate tested integrated userscript"
            git push origin HEAD:issue-243-final-version-integration-v3
          fi
