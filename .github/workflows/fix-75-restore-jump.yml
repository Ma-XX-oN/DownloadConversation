name: Fix 75 restore Jump

on:
  push:
    branches: [fix-75-restore-jump]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore Jump control
        shell: bash
        run: |
          echo ' ' | base64 -d > /tmp/fix75.py
          python3 /tmp/fix75.py
          node --check chatgpt-conversation-markdown-export.user.js
          grep -q '// @version      0.6.122' chatgpt-conversation-markdown-export.user.js
          grep -q 'data-role="jump"' chatgpt-conversation-markdown-export.user.js
          grep -q "\['-2', 1, 'user', 'u2'\]" chatgpt-conversation-markdown-export.user.js
          grep -q "\['a2', 1, 'assistant', 'a2'\]" chatgpt-conversation-markdown-export.user.js
          git diff --check
          git diff -- chatgpt-conversation-markdown-export.user.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js
          git commit -m 'fix: restore Jump control [skip ci]'
          git push origin HEAD:main
