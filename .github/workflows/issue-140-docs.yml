name: Issue 140 apply reload integration docs

on:
  push:
    branches:
      - issue-140-reload-resume-terminal

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply durable integration documentation
        run: python scripts/issue-140-apply.py
      - name: Verify documentation contract
        run: |
          git diff --check
          grep -Fq 'POST /backend-api/f/conversation/resume' DESIGN.md
          grep -Fq 'Both SSE sources feed the same stream parser and terminal normalizer' DESIGN.md
          grep -Fq '## Reload continuation stream' CHATGPT-WEB-INTEGRATION.md
          grep -Fq '## Provider v1 patch semantics' CHATGPT-WEB-INTEGRATION.md
          grep -Fq 'merge the appended fields into the existing object' CHATGPT-WEB-INTEGRATION.md
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DESIGN.md CHATGPT-WEB-INTEGRATION.md
          git commit -m "docs(#140): document reload resume lifecycle source"
          git push origin HEAD:issue-140-reload-resume-terminal
