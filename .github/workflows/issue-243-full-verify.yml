name: Issue 243 Full Integration Verification
on:
  push:
    branches: [issue-243-final-version-integration-v3]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test GEN and COMM convergence and source-ordered export
        run: |
          node --test tests/gen-provenance-convergence.test.mjs tests/gen-snapshot-restore.test.mjs tests/gen-startup-version.test.mjs tests/gen-version-convergence.test.mjs tests/gen-boundary-version.test.mjs tests/issue-241-comm-boundary.test.cjs tests/issue-242-combined-version-export.test.cjs tests/issue-239-comm-integration.test.cjs tests/merged-log-extraction.test.mjs tests/merged-log-save-integration.test.mjs tests/merged-log-storage-integration.test.mjs tests/log-extraction-dialog.test.mjs tests/nonmonotonic-log-filter-order.test.mjs
      - name: Verify build and full syntax
        run: |
          node scripts/build-userscript.mjs
          node --check chatgpt-conversation-markdown-export.user.js
          node scripts/check-jsdoc.mjs
          node scripts/build-userscript.mjs --check
          node --test tests/modular-userscript-build.test.mjs
      - name: Verify 16KiB source-segment cap
        run: |
          node --input-type=module -e "import {readFileSync,statSync} from 'node:fs';const m=JSON.parse(readFileSync('src/userscript-manifest.json'));for(const f of m.modules.flatMap(x=>x.files)){if(statSync(f).size>=16384)throw Error(f+' exceeds 16KiB');}"
      - name: Commit generated artifact
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add chatgpt-conversation-markdown-export.user.js
          if ! git diff --cached --quiet; then
            git commit -m "build(#243): regenerate integrated provenance and grouped export"
            git fetch origin issue-243-final-version-integration-v3
            git rebase origin/issue-243-final-version-integration-v3
            git push origin HEAD:issue-243-final-version-integration-v3
          fi
