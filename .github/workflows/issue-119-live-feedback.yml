name: Issue 119 live feedback

on:
  push:
    branches:
      - issue-119-image-export-timing

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify helper syntax
        run: python -m py_compile scripts/issue-119-live-feedback.py

      - name: Restore accidentally overwritten production files without rewriting history
        run: |
          git checkout 16066ed7e893433c049956d7d4e6d1d63529304f -- README.md chatgpt-conversation-markdown-export.user.js
          git diff --check
          diff -u <(git show 16066ed7e893433c049956d7d4e6d1d63529304f:README.md) README.md

      - name: Patch dry run
        run: python scripts/issue-119-live-feedback.py --check

      - name: Apply live-evidence correction
        run: python scripts/issue-119-live-feedback.py

      - name: Diff preflight
        run: |
          git diff --check
          git diff -- README.md DESIGN.md chatgpt-conversation-markdown-export.user.js tests/heading-metadata-controls.test.mjs tests/recorder-panel-ui.test.mjs tests/tool-language-diagnostics.test.mjs
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {
            'README.md',
            'DESIGN.md',
            'chatgpt-conversation-markdown-export.user.js',
            'tests/heading-metadata-controls.test.mjs',
            'tests/recorder-panel-ui.test.mjs',
            'tests/tool-language-diagnostics.test.mjs',
          }
          if changed != expected:
            raise SystemExit(f'Unexpected changed files: {sorted(changed)}')
          PY
          diff -u <(git show 16066ed7e893433c049956d7d4e6d1d63529304f:README.md) README.md

      - name: Verify version, page size, and Core pin
        run: |
          grep -F '// @version      0.6.169' chatgpt-conversation-markdown-export.user.js
          grep -F 'const PAGE_TURNS = 100;' chatgpt-conversation-markdown-export.user.js
          grep -F '@require      https://raw.githubusercontent.com/Ma-XX-oN/AIConversationCore/3233cba838bbf2d2cea5a2a6f1900ed6014dcfb0/dist/aiconversationcore.chatgpt.browser.js' chatgpt-conversation-markdown-export.user.js
          ! grep -F "phase: 'markdown-diagnostics'" chatgpt-conversation-markdown-export.user.js
          ! grep -F 'diagnosticTextHash(' chatgpt-conversation-markdown-export.user.js
          ! grep -F 'diagnosticMarkdownTurnInventory(' chatgpt-conversation-markdown-export.user.js

      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs

      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js

      - name: Focused issue 119 regressions
        run: |
          node --test tests/heading-metadata-controls.test.mjs
          node --test tests/recorder-panel-ui.test.mjs
          node --test tests/tool-language-diagnostics.test.mjs

      - name: Full JavaScript suite
        run: node --test tests/*.test.mjs

      - name: Commit verified correction and accidental-overwrite repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md DESIGN.md chatgpt-conversation-markdown-export.user.js tests/heading-metadata-controls.test.mjs tests/recorder-panel-ui.test.mjs tests/tool-language-diagnostics.test.mjs
          git diff --check --cached
          git commit -m 'perf: use measured export feedback path (#119)'
          git push origin HEAD:issue-119-image-export-timing
