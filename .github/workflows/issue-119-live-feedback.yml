name: Issue 119 live feedback

on:
  push:
    branches:
      - issue-119-image-export-timing

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify helper syntax
        run: python -m py_compile scripts/issue-119-live-feedback.py

      - name: Restore accidentally overwritten production files without rewriting history
        run: |
          git checkout 16066ed7e893433c049956d7d4e6d1d63529304f -- chatgpt-conversation-markdown-export.user.js
          rm README.md
          git diff --check
          test ! -e README.md
          if git cat-file -e 16066ed7e893433c049956d7d4e6d1d63529304f:README.md 2>/dev/null; then
            echo 'Unexpected README.md exists in the clean pre-accident tree.' >&2
            exit 1
          fi

      - name: Patch dry run
        run: python scripts/issue-119-live-feedback.py --check

      - name: Apply live-evidence correction
        run: |
          python scripts/issue-119-live-feedback.py
          python - <<'PY'
          from pathlib import Path

          design = Path('DESIGN.md')
          design.write_text(design.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')

          path = Path('tests/tool-language-diagnostics.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = """test('issue 119 gates expensive export-tail fingerprints behind debug diagnostics and reuses the result', () => {
  const readyIndex = userscript.indexOf(\"logDiagnostic('debug', 'conversation-export-markdown-ready'\");
  const blobIndex = userscript.indexOf(\"logDiagnostic('debug', 'conversation-export-blob-created'\");
  assert.ok(readyIndex > 0 && blobIndex > readyIndex);
  const diagnosticStart = userscript.lastIndexOf('const diagnosticStartedAt = performance.now();', readyIndex);
  const diagnosticEnd = userscript.indexOf('const blobStartedAt = performance.now();', readyIndex);
  assert.ok(diagnosticStart > 0 && diagnosticEnd > diagnosticStart,
    'Markdown-ready diagnostics must have a bounded debug-only phase.');
  const diagnosticBlock = userscript.slice(diagnosticStart, diagnosticEnd);
  assert.match(diagnosticBlock, /markdownHash = diagnosticTextHash\\(markdown\\)/);
  assert.match(diagnosticBlock, /markdown_hash: markdownHash/);
  assert.equal((diagnosticBlock.match(/diagnosticTextHash\\(markdown\\)/g) ?? []).length, 1,
    'The export-tail diagnostic phase should calculate its full Markdown fingerprint only once.');
});
"""
          new = """test('issue 119 keeps Markdown-ready diagnostics compact after removing full-document scans', () => {
  const readyIndex = userscript.indexOf(\"logDiagnostic('debug', 'conversation-export-markdown-ready'\");
  const blobIndex = userscript.indexOf(\"logDiagnostic('debug', 'conversation-export-blob-created'\");
  assert.ok(readyIndex > 0 && blobIndex > readyIndex);
  const readyGuard = userscript.lastIndexOf(\"if (diagnosticEnabled('debug'))\", readyIndex);
  assert.ok(readyGuard > 0 && readyIndex - readyGuard < 1000,
    'Markdown-ready diagnostics must still be guarded before their compact arguments are built.');
  const readyEnd = userscript.indexOf('});', readyIndex);
  const readyBlock = userscript.slice(readyIndex, readyEnd + 3);
  assert.match(readyBlock, /markdown_length: markdown.length/);
  assert.match(readyBlock, /source_tail: sourceTail/);
  assert.doesNotMatch(readyBlock, /markdown_hash|markdown_turn_ids|diagnosticTextHash|diagnosticMarkdownTurnInventory/,
    'Markdown-ready diagnostics must not rescan the complete rendered document.');
});
"""
          if text.count(old) != 1:
            raise SystemExit(f'stale fingerprint regression: expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Diff preflight
        run: |
          git diff --check
          git diff -- README.md DESIGN.md chatgpt-conversation-markdown-export.user.js tests/heading-metadata-controls.test.mjs tests/recorder-panel-ui.test.mjs tests/tool-language-diagnostics.test.mjs
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {
            'README.md',
            'DESIGN.md',
            'chatgpt-conversation-markdown-export.user.js',
            'tests/heading-metadata-controls.test.mjs',
            'tests/recorder-panel-ui.test.mjs',
            'tests/tool-language-diagnostics.test.mjs',
          }
          if changed != expected:
            raise SystemExit(f'Unexpected changed files: {sorted(changed)}')
          PY
          test ! -e README.md

      - name: Verify version, page size, and Core pin
        run: |
          grep -F '// @version      0.6.169' chatgpt-conversation-markdown-export.user.js
          grep -F 'const PAGE_TURNS = 100;' chatgpt-conversation-markdown-export.user.js
          grep -F '@require      https://raw.githubusercontent.com/Ma-XX-oN/AIConversationCore/3233cba838bbf2d2cea5a2a6f1900ed6014dcfb0/dist/aiconversationcore.chatgpt.browser.js' chatgpt-conversation-markdown-export.user.js
          ! grep -F "phase: 'markdown-diagnostics'" chatgpt-conversation-markdown-export.user.js
          ! grep -F 'diagnosticTextHash(' chatgpt-conversation-markdown-export.user.js
          ! grep -F 'diagnosticMarkdownTurnInventory(' chatgpt-conversation-markdown-export.user.js

      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs

      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js

      - name: Focused issue 119 regressions
        run: |
          node --test tests/heading-metadata-controls.test.mjs
          node --test tests/recorder-panel-ui.test.mjs
          node --test tests/tool-language-diagnostics.test.mjs

      - name: Full JavaScript suite
        run: node --test tests/*.test.mjs

      - name: Commit verified correction and accidental-overwrite repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A README.md DESIGN.md chatgpt-conversation-markdown-export.user.js tests/heading-metadata-controls.test.mjs tests/recorder-panel-ui.test.mjs tests/tool-language-diagnostics.test.mjs
          git diff --check --cached
          git commit -m 'perf: use measured export feedback path (#119)'
          git push origin HEAD:issue-119-image-export-timing
