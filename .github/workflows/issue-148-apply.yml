name: Issue 148 finalize shared-watcher design

on:
  push:
    branches:
      - issue-148-agent-favicon-state

permissions:
  contents: write

jobs:
  design:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update shared lifecycle design
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('DESIGN.md')
          text = path.read_text(encoding='utf-8')
          old = ('## Shared agent terminal dispatch\n\n'
                 'Structured terminal state is normalized exactly once before any terminal side effect. The normalizer determines terminal kind, conversation identity, exchange identity, terminal de-duplication key, and one monotonic completion timestamp. Successful-final exchange identity prefers the final Assistant message metadata; structured capture/request identity is used only by the same shared normalizer when needed. The normalized immutable terminal object is then dispatched to the sound and stopwatch handlers. Neither consumer independently classifies terminal state or reconstructs terminal identity. The stopwatch still rejects a normalized terminal whose exchange identity does not match the active stopwatch session. Rendered text and DOM error strings are not terminal detectors.')
          new = ('## Shared agent lifecycle observation and terminal dispatch\n\n'
                 'Agent lifecycle state is observed once and projected to independent consumers. Current-page processing begins at the existing structured `POST /backend-api/f/conversation` request boundary; the stopwatch and favicon consume that same observed generation start rather than installing separate prompt detectors. On reload, the single structured `/backend-api/conversation/<id>/stream_status` result already fetched for stopwatch restoration is also projected to the favicon consumer; no second status request or alternate state detector is introduced.\n\n'
                 'Structured terminal state is normalized exactly once before any terminal side effect. The normalizer determines terminal kind, conversation identity, exchange identity, terminal de-duplication key, and one monotonic completion timestamp. Successful-final exchange identity prefers the final Assistant message metadata; structured capture/request identity is used only by the same shared normalizer when needed. The normalized immutable terminal object is then dispatched to the sound, stopwatch, and favicon handlers. None of those consumers independently classifies terminal state or reconstructs terminal identity. The stopwatch still rejects a normalized terminal whose exchange identity does not match the active stopwatch session. Sound de-duplication distinguishes terminal kind as well as terminal identity so a successful completion followed by a structured same-exchange terminal error can emit one ding and one buzz without duplicate replay. Rendered text and DOM error strings are not terminal detectors.\n\n'
                 '## Agent favicon processing/completion state\n\n'
                 'The favicon is a presentation-only consumer of the shared lifecycle observer. When a current-page generation request is observed, or reload restoration reports structured `IS_STREAMING`, the userscript recolors only the near-white portion of the original stock ChatGPT favicon to yellow. A successful normalized terminal event changes that favicon to light green only when processing was observed in the current loaded page. A successful terminal arriving without such page-lifetime processing evidence does not infer green. A later terminal error, including `conversation_too_large` after a successful final response, does not replace the completed green state. A subsequent current-page prompt returns the favicon to yellow.\n\n'
                 'A reload whose structured stream status is not active leaves the stock favicon untouched; `NOT_STREAMING` is not treated as evidence that this page observed completion. The colored icon is rendered through a separate userscript-owned favicon link. The source href is captured from the stock favicon before the override and memoized, and every yellow or green render reloads that original source rather than recoloring a previously generated icon. Visible near-white pixels are recolored while alpha and non-white pixels are preserved. Image/canvas failure is diagnostic-only; there is no DOM-text, local-storage, alternate-network, or other fallback state path.')
          count = text.count(old)
          if count != 1:
            raise SystemExit(f'Expected one shared terminal design section, found {count}.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify design diff
        run: |
          git diff --check
          grep -Fq 'sound, stopwatch, and favicon handlers' DESIGN.md
          grep -Fq 'same observed generation start' DESIGN.md
          grep -Fq 'every yellow or green render reloads that original source' DESIGN.md
      - name: Commit design
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DESIGN.md
          git commit -m "docs(#148): document shared agent lifecycle watcher"
          git push origin HEAD:issue-148-agent-favicon-state
