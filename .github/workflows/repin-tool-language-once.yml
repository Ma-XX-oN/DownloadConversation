name: Repin tool language core once

on:
  push:
    paths:
      - .github/workflows/repin-tool-language-once.yml

permissions:
  contents: write

jobs:
  repin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded repin and regression patch
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Integration regressions
        run: node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs
      - name: UI regressions
        run: |
          node --test tests/test-list-ui.test.mjs
          node --test tests/recorder-panel-ui.test.mjs
      - name: Verify scoped diff
        run: |
          git status --short
          test -z "$(git status --short | grep -vE '^( M|\?\?) (chatgpt-conversation-markdown-export.user.js|tests/core-integration.test.mjs|tests/phase5-rich-core-integration.test.mjs)$')"
      - name: Commit verified repin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs
          git commit -m "fix: use normalized tool call languages"
          git push
