name: Temporary #106 DownloadConversation Core f56 compatibility

on:
  push:
    branches:
      - tmp/issue-106-core-f56-compat

permissions:
  contents: read

env:
  DC_SHA: d5818e346e46541b567ae879b7be42df16c99b6b
  OLD_CORE_SHA: cf34d9374f51ac525acfb90cfd6b247006a7bf6e
  CORE_SHA: f56b2438723085bc651af936f065cacc35ad77da
  OLD_CORE_BLOB: 5a999c8c02f127b4fc03b923a40496961c9cacc0
  CORE_VERSION: 1.0.0-issue.106.15

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable DownloadConversation baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DC_SHA }}
          fetch-depth: 0
          submodules: recursive

      - name: Assert immutable baseline
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$DC_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Measure exact Core browser artifact
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/Ma-XX-oN/AIConversationCore/$CORE_SHA/dist/aiconversationcore.chatgpt.browser.js"
          curl -fsSL "$url" -o "$RUNNER_TEMP/core-browser.js"
          blob="$(git hash-object "$RUNNER_TEMP/core-browser.js")"
          bytes="$(wc -c < "$RUNNER_TEMP/core-browser.js" | tr -d '[:space:]')"
          grep -F "const VERSION = \"$CORE_VERSION\"" "$RUNNER_TEMP/core-browser.js"
          echo "CORE_BLOB=$blob" >> "$GITHUB_ENV"
          echo "CORE_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "Measured Core bundle: commit=$CORE_SHA blob=$blob bytes=$bytes version=$CORE_VERSION"

      - name: Project exact Core dependency without mutating historical provenance
        shell: python
        run: |
          from pathlib import Path
          import json
          import os
          import subprocess

          old_sha = os.environ['OLD_CORE_SHA']
          new_sha = os.environ['CORE_SHA']
          old_blob = os.environ['OLD_CORE_BLOB']
          new_blob = os.environ['CORE_BLOB']
          new_bytes = os.environ['CORE_BYTES']
          new_version = os.environ['CORE_VERSION']

          manifest_path = Path('src/userscript-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          historical_fixture = manifest['migration_source']['path']

          files = set()
          for needle in (old_sha, old_blob):
            proc = subprocess.run(
              ['git', 'grep', '-l', '-F', needle],
              text=True, capture_output=True, check=False)
            if proc.returncode not in (0, 1):
              raise SystemExit(proc.stderr)
            files.update(line for line in proc.stdout.splitlines() if line)

          for name in sorted(files):
            if name == historical_fixture:
              continue
            path = Path(name)
            text = path.read_text(encoding='utf-8')
            text = text.replace(old_sha, new_sha).replace(old_blob, new_blob)
            path.write_text(text, encoding='utf-8', newline='')

          text = manifest_path.read_text(encoding='utf-8')
          if '"byte_length": 264693' not in text:
            raise SystemExit('Expected old Core byte length is missing from manifest.')
          manifest_path.write_text(
            text.replace('"byte_length": 264693', f'"byte_length": {new_bytes}'),
            encoding='utf-8', newline='')

          modular = Path('tests/modular-userscript-build.test.mjs')
          text = modular.read_text(encoding='utf-8')
          expected = 'assert.equal(dependency.byte_length, 264693);'
          if expected not in text:
            raise SystemExit('Expected old dependency byte-length oracle is missing.')
          modular.write_text(
            text.replace(expected, f'assert.equal(dependency.byte_length, {new_bytes});'),
            encoding='utf-8', newline='')

          version_test = Path('tests/version-identity.test.mjs')
          text = version_test.read_text(encoding='utf-8')
          expected = "assert.equal(context.AIConversationCore.getVersion(), '1.0.0');"
          if expected not in text:
            raise SystemExit('Expected stable Core version oracle is missing.')
          version_test.write_text(
            text.replace(expected, f"assert.equal(context.AIConversationCore.getVersion(), '{new_version}');"),
            encoding='utf-8', newline='')

      - name: Prove historical migration fixture is unchanged
        shell: bash
        run: |
          test "$(git hash-object tests/fixtures/legacy-userscript-issue-135.3.user.js)" = "44a4ab373a6515caed5527aeb19cbdff7ce91e07"

      - name: Regenerate userscript through authoritative builder
        run: node scripts/build-userscript.mjs

      - name: Assert exact projected dependency identity
        shell: bash
        run: |
          grep -F "\"commit\": \"$CORE_SHA\"" src/userscript-manifest.json
          grep -F "\"git_blob_sha1\": \"$CORE_BLOB\"" src/userscript-manifest.json
          grep -F "\"byte_length\": $CORE_BYTES" src/userscript-manifest.json
          grep -F "BEGIN bundled AIConversationCore commit=$CORE_SHA blob=$CORE_BLOB" chatgpt-conversation-markdown-export.user.js
          if git grep -n -F "$OLD_CORE_SHA" -- ':!*.md' ':!tests/fixtures/legacy-userscript-issue-135.3.user.js'; then
            echo 'Stale Core commit remains outside the immutable historical fixture.' >&2
            exit 1
          fi
          if git grep -n -F "$OLD_CORE_BLOB" -- ':!*.md' ':!tests/fixtures/legacy-userscript-issue-135.3.user.js'; then
            echo 'Stale Core blob remains outside the immutable historical fixture.' >&2
            exit 1
          fi

      - name: Verify generated userscript independently
        run: node scripts/verify-userscript-artifact.mjs

      - name: Run authoritative repository validation entry point
        run: python scripts/repoworkflow-validate.py

      - name: Validate projected workspace hygiene
        run: git diff --check
