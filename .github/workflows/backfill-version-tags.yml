name: Backfill version tags

on:
  push:
    paths:
      - .github/workflows/backfill-version-tags.yml

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAG_BACKFILL_PAT }}
    steps:
      - name: Verify PAT is available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "TAG_BACKFILL_PAT is not available to this workflow." >&2
            exit 1
          fi

      - name: Verify version targets and create missing tags
        shell: bash
        run: |
          set -euo pipefail

          mappings=$(cat <<'EOF'
          0.6.133 ecdbc112fc1b29e8f14281c74b79123a31490e84
          0.6.134 dc5084e2edc88f139cf5930f4c65c33cf9a848a9
          0.6.135 79a910dd8534533e0ed93a337d773010a76511a0
          0.6.136 b98b35f630ea61aa7ee761649282371180e33b16
          0.6.137 457bdc749e7f8f508c6cffd98911002fb3f19e4c
          0.6.138 c48b4aef5c687fd6cec4647ab85feb5aed070e43
          0.6.139 628862e6e88be23537122357c311d309b659515d
          0.6.140 c57ccf11d1ac3c5fa8d9a1c724173b02ce5cb4cd
          0.6.141 67e4447e1fe1a093590ea8d33c0bbb410925b17c
          0.6.142 84cad667f366e03f967c17a1065bb0db580a1ae6
          0.6.143 5d4602bd4f9a16ed99dcc5e98839ac5d89dd7dcc
          0.6.144 1b38e4f82128a33494908b72a067fcc3d8dad0ff
          0.6.145 da8b770375a6b667b234760b462f911be6fc0d25
          0.6.146 da7680b84e0dcf3e794bdbbaa62fc32a3a289dcd
          0.6.147 d1cc2cab79f1105f340dba55babb583ab5a4a369
          0.6.148 8a0ab61dc1d3d01d696fd266420d9becb50f1859
          0.6.149 39d5a2a448b98c0ae4b0dd498416edde7070a966
          0.6.150 02298a8d1473b328e98d87530a39a236687aaa07
          0.6.151 e3437d4a71428c95355129085149496878d5a7c7
          0.6.152 e78ddce89c4b788805aadc4f1b46d7de98682504
          EOF
          )

          while read -r version sha; do
            [[ -n "$version" ]] || continue
            tag="v${version}"

            file=$(gh api "repos/${GITHUB_REPOSITORY}/contents/chatgpt-conversation-markdown-export.user.js?ref=${sha}" --jq .content | tr -d '\n' | base64 --decode)
            if ! grep -Fqx "// @version      ${version}" <<<"$file"; then
              echo "Target ${sha} does not contain userscript version ${version}." >&2
              exit 1
            fi

            existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha 2>/dev/null || true)
            if [[ -n "$existing" ]]; then
              if [[ "$existing" != "$sha" ]]; then
                echo "${tag} already exists at ${existing}, expected ${sha}." >&2
                exit 1
              fi
              echo "${tag} already correct at ${sha}."
              continue
            fi

            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="${sha}" >/dev/null
            echo "Created ${tag} -> ${sha}."
          done <<<"$mappings"

      - name: Verify all backfilled tags
        shell: bash
        run: |
          set -euo pipefail
          expected='0.6.133:ecdbc112fc1b29e8f14281c74b79123a31490e84
          0.6.134:dc5084e2edc88f139cf5930f4c65c33cf9a848a9
          0.6.135:79a910dd8534533e0ed93a337d773010a76511a0
          0.6.136:b98b35f630ea61aa7ee761649282371180e33b16
          0.6.137:457bdc749e7f8f508c6cffd98911002fb3f19e4c
          0.6.138:c48b4aef5c687fd6cec4647ab85feb5aed070e43
          0.6.139:628862e6e88be23537122357c311d309b659515d
          0.6.140:c57ccf11d1ac3c5fa8d9a1c724173b02ce5cb4cd
          0.6.141:67e4447e1fe1a093590ea8d33c0bbb410925b17c
          0.6.142:84cad667f366e03f967c17a1065bb0db580a1ae6
          0.6.143:5d4602bd4f9a16ed99dcc5e98839ac5d89dd7dcc
          0.6.144:1b38e4f82128a33494908b72a067fcc3d8dad0ff
          0.6.145:da8b770375a6b667b234760b462f911be6fc0d25
          0.6.146:da7680b84e0dcf3e794bdbbaa62fc32a3a289dcd
          0.6.147:d1cc2cab79f1105f340dba55babb583ab5a4a369
          0.6.148:8a0ab61dc1d3d01d696fd266420d9becb50f1859
          0.6.149:39d5a2a448b98c0ae4b0dd498416edde7070a966
          0.6.150:02298a8d1473b328e98d87530a39a236687aaa07
          0.6.151:e3437d4a71428c95355129085149496878d5a7c7
          0.6.152:e78ddce89c4b788805aadc4f1b46d7de98682504'

          while IFS=: read -r version sha; do
            actual=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" --jq .object.sha)
            [[ "$actual" == "$sha" ]] || {
              echo "v${version} resolves to ${actual}, expected ${sha}." >&2
              exit 1
            }
            echo "Verified v${version} -> ${sha}."
          done <<<"$expected"

      - name: Record workflow result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(printf 'run_id=%s\nrun_attempt=%s\nstatus=%s\ncommit=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RESULT" "$GITHUB_SHA")
          encoded=$(printf '%s' "$body" | base64 -w0)
          endpoint="repos/${GITHUB_REPOSITORY}/contents/.tag-backfill-status.txt"
          existing=$(gh api "$endpoint" --jq .sha 2>/dev/null || true)
          if [[ -n "$existing" ]]; then
            gh api --method PUT "$endpoint" \
              -f message='maintenance: record tag backfill result' \
              -f content="$encoded" \
              -f sha="$existing" >/dev/null
          else
            gh api --method PUT "$endpoint" \
              -f message='maintenance: record tag backfill result' \
              -f content="$encoded" >/dev/null
          fi
