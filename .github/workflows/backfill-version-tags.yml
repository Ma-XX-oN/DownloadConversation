name: Backfill version tags

on:
  push:
    paths:
      - .github/workflows/backfill-version-tags.yml

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAG_BACKFILL_PAT }}
    steps:
      - name: Verify PAT is available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "TAG_BACKFILL_PAT is not available to this workflow." >&2
            exit 1
          fi

      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive exact version commits and create missing tags
        shell: bash
        run: |
          set -euo pipefail
          product='chatgpt-conversation-markdown-export.user.js'

          commit_has_version() {
            local sha="$1"
            local version="$2"
            local content
            content=$(git show "${sha}:${product}" 2>/dev/null) || return 1
            grep -Fqx "// @version      ${version}" <<<"$content"
          }

          find_version_commit() {
            local version="$1"
            local sha parent

            while read -r sha; do
              commit_has_version "$sha" "$version" || continue
              parent=$(git rev-parse "${sha}^" 2>/dev/null || true)
              if [[ -z "$parent" ]] || ! commit_has_version "$parent" "$version"; then
                printf '%s\n' "$sha"
                return 0
              fi
            done < <(git log --reverse --format='%H' v0.6.132..HEAD -- "$product")

            return 1
          }

          for patch in $(seq 133 152); do
            version="0.6.${patch}"
            tag="v${version}"
            sha=$(find_version_commit "$version") || {
              echo "Could not find the commit that introduced ${version}." >&2
              exit 1
            }

            commit_has_version "$sha" "$version" || {
              echo "Derived target ${sha} does not contain ${version}." >&2
              exit 1
            }

            parent=$(git rev-parse "${sha}^" 2>/dev/null || true)
            if [[ -n "$parent" ]] && commit_has_version "$parent" "$version"; then
              echo "Derived target ${sha} is not the introduction commit for ${version}." >&2
              exit 1
            fi

            existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha 2>/dev/null || true)
            if [[ -n "$existing" ]]; then
              if [[ "$existing" != "$sha" ]]; then
                echo "${tag} already exists at ${existing}, expected introduction commit ${sha}." >&2
                exit 1
              fi
              echo "${tag} already correct at ${sha}."
              continue
            fi

            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="${sha}" >/dev/null
            echo "Created ${tag} -> ${sha}."
          done

      - name: Verify all backfilled tags against history
        shell: bash
        run: |
          set -euo pipefail
          product='chatgpt-conversation-markdown-export.user.js'

          commit_has_version() {
            local sha="$1"
            local version="$2"
            local content
            content=$(git show "${sha}:${product}" 2>/dev/null) || return 1
            grep -Fqx "// @version      ${version}" <<<"$content"
          }

          find_version_commit() {
            local version="$1"
            local sha parent

            while read -r sha; do
              commit_has_version "$sha" "$version" || continue
              parent=$(git rev-parse "${sha}^" 2>/dev/null || true)
              if [[ -z "$parent" ]] || ! commit_has_version "$parent" "$version"; then
                printf '%s\n' "$sha"
                return 0
              fi
            done < <(git log --reverse --format='%H' v0.6.132..HEAD -- "$product")

            return 1
          }

          for patch in $(seq 133 152); do
            version="0.6.${patch}"
            expected=$(find_version_commit "$version") || {
              echo "Could not re-derive ${version}." >&2
              exit 1
            }
            actual=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" --jq .object.sha)
            [[ "$actual" == "$expected" ]] || {
              echo "v${version} resolves to ${actual}, expected ${expected}." >&2
              exit 1
            }
            echo "Verified v${version} -> ${actual}."
          done

      - name: Record workflow result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(printf 'run_id=%s\nrun_attempt=%s\nstatus=%s\ncommit=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RESULT" "$GITHUB_SHA")
          encoded=$(printf '%s' "$body" | base64 -w0)
          endpoint="repos/${GITHUB_REPOSITORY}/contents/.tag-backfill-status.txt"
          existing=$(gh api "$endpoint" --jq .sha 2>/dev/null || true)
          if [[ -n "$existing" ]]; then
            gh api --method PUT "$endpoint" \
              -f message='maintenance: record tag backfill result' \
              -f content="$encoded" \
              -f sha="$existing" >/dev/null
          else
            gh api --method PUT "$endpoint" \
              -f message='maintenance: record tag backfill result' \
              -f content="$encoded" >/dev/null
          fi
