name: Issue 102 single-snapshot migration

on:
  push:
    branches:
      - issue-102-single-api-snapshot

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize inherited version regression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/sediment-resolver.test.mjs')
          text = path.read_text(encoding='utf-8')
          marker = "test('userscript version advances for sediment resolver completion', () => {"
          start = text.index(marker)
          end = text.index('\n});', start) + len('\n});')
          canonical = "test('userscript version advances for sediment resolver completion', () => {\n  assert.match(userscript, /\\/\\/ @version      0\\.6\\.175/);\n});"
          path.write_text(text[:start] + canonical + text[end:], encoding='utf-8')
          PY
      - name: Apply issue 102 migration
        run: python scripts/issue102-migrate.py
      - name: Use stable production boundary in issue 102 regression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/export-single-snapshot.test.mjs')
          text = path.read_text(encoding='utf-8')
          start = text.index('function productionFunctionSource(name) {')
          end = text.index('\n\nfunction exportHarness()', start)
          replacement = '''function runExportSource() {
            const start = userscript.indexOf('  async function runExport(kinds) {');
            const end = userscript.indexOf(
              '\\n  /**\\n   * Tests API pagination logic.',
              start
            );
            assert.ok(start >= 0 && end > start, 'Production runExport function is missing.');
            return userscript.slice(start, end).trimStart();
          }'''
          text = text[:start] + replacement + text[end:]
          old = "${productionFunctionSource('runExport')}\\nthis.__runExport = runExport;"
          new = "${runExportSource()}\\nthis.__runExport = runExport;"
          if text.count(old) != 1:
            raise RuntimeError(f'runExport harness invocation: expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: Issue 102 regression
        run: node --test tests/export-single-snapshot.test.mjs
      - name: Complete DownloadConversation node test suite
        run: node --test tests/*.test.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Verify intended diff
        run: |
          git status --short
          git diff --stat
          git diff -- chatgpt-conversation-markdown-export.user.js DESIGN.md tests/export-single-snapshot.test.mjs tests/sediment-resolver.test.mjs
      - name: Commit production and regression
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js DESIGN.md tests/export-single-snapshot.test.mjs tests/sediment-resolver.test.mjs
          git commit -m 'export: share one API snapshot across formats (#102)'
          git push
