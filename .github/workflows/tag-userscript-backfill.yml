name: Backfill userscript version tags

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backfill version tags
        shell: bash
        run: |
          set -uo pipefail
          script='chatgpt-conversation-markdown-export.user.js'
          git fetch --force --tags origin

          mapfile -t versions < <(
            while IFS= read -r commit; do
              git show "${commit}:${script}" 2>/dev/null \
                | sed -nE 's#^//[[:space:]]*@version[[:space:]]+([^[:space:]]+).*$#\1#p' \
                | head -n 1 || true
            done < <(git rev-list --reverse "${GITHUB_SHA}" -- "$script") \
              | awk 'NF && !seen[$0]++'
          )

          failures=0
          for version in "${versions[@]}"; do
            tag="v${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "Existing ${tag}"
              continue
            fi

            tagged=false
            while IFS= read -r commit; do
              commit_version="$(git show "${commit}:${script}" 2>/dev/null \
                | sed -nE 's#^//[[:space:]]*@version[[:space:]]+([^[:space:]]+).*$#\1#p' \
                | head -n 1 || true)"
              [[ "$commit_version" == "$version" ]] || continue

              git tag "$tag" "$commit"
              if git push origin "refs/tags/${tag}"; then
                echo "Created ${tag} at ${commit}"
                tagged=true
                break
              fi
              git tag -d "$tag" >/dev/null 2>&1 || true
            done < <(git rev-list "${GITHUB_SHA}" -- "$script")

            if [[ "$tagged" != true ]]; then
              echo "FAILED ${tag}" >&2
              failures=$((failures + 1))
            fi
          done

          echo "Failed tag count: ${failures}"
          exit "$failures"
