name: Apply issue 75 materialization patch data

on:
  push:
    branches:
      - issue-102-single-api-snapshot
    paths:
      - .github/workflows/issue75-materialization-apply.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-102-single-api-snapshot
          fetch-depth: 0
      - name: Apply production and design correction
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent, indent

          source_path = Path('chatgpt-conversation-markdown-export.user.js')
          source = source_path.read_text(encoding='utf-8')
          workflow = Path('.github/workflows/issue75-materialization-fix.yml').read_text(encoding='utf-8')

          old_version = '// @version      0.6.177'
          new_version = '// @version      0.6.178'
          if source.count(old_version) != 1:
            raise SystemExit('Expected exactly one v0.6.177 userscript header.')
          source = source.replace(old_version, new_version, 1)

          block_start_marker = "          replacement = indent(dedent(r'''\\\n"
          block_end_marker = "\n          '''), '  ')"
          block_start = workflow.index(block_start_marker) + len(block_start_marker)
          block_end = workflow.index(block_end_marker, block_start)
          replacement = indent(dedent(workflow[block_start:block_end]).strip('\n'), '  ') + '\n'

          populate_function = source.index('  async function populateJumpTocIndex(')
          replacement_start = source.rfind('  /**', 0, populate_function)
          run_jump = source.index('  async function runJump()', populate_function)
          replacement_end = source.rfind('  /**', 0, run_jump)
          if replacement_start < 0 or replacement_end <= replacement_start:
            raise SystemExit('Could not isolate Jump materialization implementation.')
          source = source[:replacement_start] + replacement + source[replacement_end:]
          if 'populateJumpTocIndex' in source:
            raise SystemExit('Obsolete populateJumpTocIndex implementation remains after replacement.')
          source_path.write_text(source, encoding='utf-8')

          design_path = Path('DESIGN.md')
          design = design_path.read_text(encoding='utf-8')
          marker = '### Progress reports what is actually known\n'
          if marker not in design:
            raise SystemExit('Could not locate DESIGN.md traversal insertion point.')
          addition = '''### Jump materialization follows stable identity and convergence

Jump resolves User/Assistant IDs and numeric UAP indices from the Conversation API first.  When the resolved stable message ID is not currently mounted, virtualized DOM traversal treats either the requested message itself or ChatGPT's UAP index control as a materialization success.  The index control is a navigation mechanism, not a required correctness condition.

Automatic traversal starts at the oldest current boundary, checks the requested stable message ID after every settle, and advances in overlapping half-viewport steps.  Reaching one current `scrollHeight` endpoint is not completion: the endpoint must remain structurally stable across repeated observations of scroll geometry, mounted turn identities, and exposed UAP index controls.  A later virtualized extent resets convergence and traversal continues.

**Why:** ChatGPT can replace or extend its virtualized scroll extent asynchronously.  Stable API identity is authoritative, while one transient DOM extent cannot prove that historical navigation has converged.

'''
          design = design.replace(marker, addition + marker, 1)
          design_path.write_text(design, encoding='utf-8')
      - name: Validate repair before commit
        run: |
          node --check chatgpt-conversation-markdown-export.user.js
          node scripts/check-jsdoc.mjs
          node --test tests/jump-materialization.test.mjs
          git diff --check
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js DESIGN.md
          git commit -m "fix: converge Jump materialization on stable target identity (#75)"
          git push origin HEAD:issue-102-single-api-snapshot
