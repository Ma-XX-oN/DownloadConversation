name: List variable declarations once

on:
  push:
    paths:
      - .github/workflows/list-variable-declarations-once.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Top-level declarations
        run: grep -nE '^  (const|let|var) [A-Za-z_$][A-Za-z0-9_$]*' chatgpt-conversation-markdown-export.user.js || true
      - name: Potentially non-obvious local state declarations
        run: grep -nE '^    (const|let|var) .*([Ss]tate|[Cc]ache|[Cc]ursor|[Oo]rdinal|[Ss]equence|[Cc]ontext|[Ii]ndex|[Mm]ap|[Ss]et|[Rr]ecover|[Pp]ending|[Aa]nchor|[Gg]roup|[Cc]lassif|[Ss]pine|[Pp]age|[Rr]ecord|[Ll]ookup|[Ww]ake|[Ee]xport|[Dd]iagnostic)' chatgpt-conversation-markdown-export.user.js || true
