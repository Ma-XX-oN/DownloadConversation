name: Isolated DC297 registration rebase RED/GREEN
on:
  push:
    branches:
      - verify-rebase-dc297-20261024
permissions:
  contents: read
jobs:
  identity-witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact mainline ancestry and current provider bridge
        run: |
          git rev-parse HEAD
          git merge-base --is-ancestor e6a083cd883e99e9d30e7ba440062bea6060b9be HEAD
          grep -q 'core.createAgent' src/userscript/04-conversation-rendering/08-agent-plugin-bridge.js
          if grep -q 'import(blobUrl)' src/userscript/04-conversation-rendering/08-agent-plugin-bridge.js; then exit 1; fi
      - name: Rebased old witness RED/GREEN tests
        run: |
          node --test tests/issue127-queued-witness.test.mjs
      - name: Canonical network and queue regression
        if: always()
        run: |
          node --test tests/issue309-csc-canonical-ingress.test.mjs \
            tests/issue310-plugin-backlog.test.mjs \
            tests/issue306-csc-queue-host-integration.test.mjs
      - name: New registered-agent path regression
        if: always()
        run: node --test tests/cgp2-core-integration.test.mjs tests/core-integration.test.mjs
      - name: Rebased syntax/types
        if: always()
        run: |
          node scripts/check-userscript-types.mjs
          node scripts/check-jsdoc.mjs
      - name: Assemble against stable merged AICC and validate generated source
        if: always()
        run: |
          node scripts/build-userscript.mjs --output "$RUNNER_TEMP/rebased-dc297.user.js"
          node scripts/verify-userscript-artifact.mjs "$RUNNER_TEMP/rebased-dc297.user.js"
          node --check "$RUNNER_TEMP/rebased-dc297.user.js"
