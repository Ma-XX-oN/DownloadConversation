name: DC 297 independent rebase acceptance matrix
on:
  push:
    branches:
      - verify-rebase-dc297-20261024
      - verify-dc297-registration-host-20261025
permissions:
  contents: read
jobs:
  test:
    name: matrix-${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: witness, command: 'node --test tests/issue127-queued-witness.test.mjs' }
          - { label: queue, command: 'node --test tests/issue309-csc-canonical-ingress.test.mjs tests/issue310-plugin-backlog.test.mjs tests/issue306-csc-queue-host-integration.test.mjs' }
          - { label: registration, command: 'node --test tests/cgp2-core-integration.test.mjs tests/core-integration.test.mjs' }
          - { label: typescript, command: 'node scripts/check-userscript-types.mjs' }
          - { label: jsdoc, command: 'node scripts/check-jsdoc.mjs' }
          - { label: bundle, command: 'node scripts/build-userscript.mjs --output /tmp/dc297-rebase.user.js && node scripts/verify-userscript-artifact.mjs /tmp/dc297-rebase.user.js' }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Establish ancestry
        run: git merge-base --is-ancestor e6a083cd883e99e9d30e7ba440062bea6060b9be HEAD
      - name: Run ${{ matrix.label }} acceptance
        run: ${{ matrix.command }}
