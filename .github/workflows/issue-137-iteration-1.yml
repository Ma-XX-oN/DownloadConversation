name: Issue 137 iteration 1 apply

on:
  push:
    branches:
      - issue-137-agent-sound-volume-popup

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply asserted issue-137 correction
        run: python scripts/apply-issue-137-iteration-1.py
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Agent completion sound regression
        run: node --test tests/agent-completion-sounds.test.mjs
      - name: Agent turn stopwatch regression
        run: node --test tests/agent-turn-stopwatch.test.mjs
      - name: Agent turn stopwatch stream integration
        run: node --test tests/agent-turn-stopwatch-stream.test.mjs
      - name: Agent turn stopwatch live total
        run: node --test tests/agent-turn-stopwatch-live-total.test.mjs
      - name: Stream tail recovery regression
        run: node --test tests/stream-tail-recovery.test.mjs
      - name: Recorder panel UI regression
        run: node --test tests/recorder-panel-ui.test.mjs
      - name: Commit verified correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js DESIGN.md tests/agent-turn-stopwatch.test.mjs
          git diff --cached --check
          git commit -m "fix(#137): add reliable 0-10 sound volume control"
          git push
