name: DC 318 independent rebase acceptance matrix
on:
  push:
    branches:
      - verify-rebase-dc318-20261024
permissions:
  contents: read
jobs:
  test:
    name: matrix-${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: controls, command: 'node --test tests/issue318-csc-control-plane.test.mjs tests/issue318-csc-gm-cross-tab.test.mjs' }
          - { label: chromium, command: 'node --test tests/issue318-csc-popup-chromium.test.mjs' }
          - { label: adjacent, command: 'node --test tests/recording-panel-modes.test.mjs tests/recording-panel-chromium-layout.test.mjs tests/recording-group-tab-identity.test.mjs tests/issue347-log-category-settings.test.mjs tests/issue347-startup-order.test.mjs tests/ci-test-inventory.test.mjs tests/recorder-panel-ui.test.mjs' }
          - { label: typescript, command: 'node scripts/check-userscript-types.mjs' }
          - { label: jsdoc, command: 'node scripts/check-jsdoc.mjs' }
          - { label: bundle, command: 'node scripts/build-userscript.mjs --output /tmp/dc318-rebase.user.js && node scripts/verify-userscript-artifact.mjs /tmp/dc318-rebase.user.js' }
          - { label: full, command: 'python scripts/repoworkflow-validate.py' }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Establish ancestry
        run: git merge-base --is-ancestor e6a083cd883e99e9d30e7ba440062bea6060b9be HEAD
      - name: Run ${{ matrix.label }} acceptance
        run: ${{ matrix.command }}
