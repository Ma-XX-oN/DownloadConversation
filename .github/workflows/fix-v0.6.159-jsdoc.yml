name: Fix v0.6.159 documentation

on:
  push:
    paths:
      - .github/workflows/fix-v0.6.159-jsdoc.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add required documentation
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('chatgpt-conversation-markdown-export.user.js'); t=p.read_text(encoding='utf-8'); old='  const launcherTopologyNodeIds = new WeakMap();\\n  const launcherTopologyInitialBodyIndexes = new WeakMap();\\n  const launcherTopologyCandidateStats = new WeakMap();\\n  let launcherTopologyNextNodeId = 1;\\n  let launcherTopologyStartedAt = performance.now();\\n  let launcherTopologyLastBodyMutationAt = launcherTopologyStartedAt;\\n  let launcherTopologyQuietTimer = null;\\n'; new='  /** Stable page-local identities assigned to nodes observed by topology diagnostics. */\\n  const launcherTopologyNodeIds = new WeakMap();\\n  /** Initial direct-BODY index for each node present when topology observation begins. */\\n  const launcherTopologyInitialBodyIndexes = new WeakMap();\\n  /** Mutation and lifetime counters for direct-BODY children considered as mount candidates. */\\n  const launcherTopologyCandidateStats = new WeakMap();\\n  /** Next page-local node identity number assigned by topology diagnostics. */\\n  let launcherTopologyNextNodeId = 1;\\n  /** Performance timestamp when topology observation began. */\\n  let launcherTopologyStartedAt = performance.now();\\n  /** Performance timestamp of the most recent direct-BODY child mutation. */\\n  let launcherTopologyLastBodyMutationAt = launcherTopologyStartedAt;\\n  /** Pending timer that reports a 500 ms direct-BODY structural quiet interval. */\\n  let launcherTopologyQuietTimer = null;\\n'; assert t.count(old)==1, t.count(old); t=t.replace(old,new,1); old2='    const startForBody = body => {\\n'; new2='    /**\\n     * Begins topology observation for the BODY instance that exists during startup.\\n     *\\n     * @param {HTMLBodyElement} body - BODY element whose direct children are tracked.\\n     * @returns {void} No value is returned.\\n     */\\n    const startForBody = body => {\\n'; assert t.count(old2)==1, t.count(old2); p.write_text(t.replace(old2,new2,1), encoding='utf-8')"
          node scripts/check-jsdoc.mjs
          node --check chatgpt-conversation-markdown-export.user.js
          node --test tests/*.test.mjs
          git diff --check
      - name: Commit fix and self-clean workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-v0.6.159-jsdoc.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: document launcher topology diagnostics'
          git push origin HEAD:main
