name: Issue 136 apply stopwatch

on:
  push:
    branches:
      - issue-136-agent-turn-stopwatch

permissions:
  contents: write

jobs:
  apply-stopwatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply asserted issue 136 patch
        run: python scripts/apply-issue-136.py
      - name: Align observer guard with explicit event contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('chatgpt-conversation-markdown-export.user.js')
          text = path.read_text(encoding='utf-8')
          old = "    if (event?.type === 'input_message' && event?.input_message?.author?.role === 'user') {"
          new = "    if (event && event.type === 'input_message' && event.input_message?.author?.role === 'user') {"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Supply stopwatch observer to isolated stream-tail harness
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/stream-tail-recovery.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = "    agentSoundObserveTerminal() {},\n"
          new = old + "    agentStopwatchObserveStreamEvent() {},\n"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Agent turn stopwatch regression
        run: node --test tests/agent-turn-stopwatch.test.mjs
      - name: Existing agent completion sound regression
        run: node --test tests/agent-completion-sounds.test.mjs
      - name: Stream tail recovery regression
        run: node --test tests/stream-tail-recovery.test.mjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js DESIGN.md tests/stream-tail-recovery.test.mjs
          git diff --cached --check
          git commit -m "feat(#136): add agent-turn stopwatch"
          git push
