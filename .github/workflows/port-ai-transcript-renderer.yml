name: Port AI-transcript ChatGPT renderer parity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/port-ai-transcript-renderer.yml']
permissions:
  contents: write
jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply renderer parity patch
        run: python3 .github/port_renderer.py
      - name: Verify source
        run: |
          node --check chatgpt-conversation-markdown-export.user.js
          grep -q '// @version      0.6.121' chatgpt-conversation-markdown-export.user.js
          grep -q 'cgBuildFileReferenceIndex(records)' chatgpt-conversation-markdown-export.user.js
          grep -q 'AI-transcript renderer parity' chatgpt-conversation-markdown-export.user.js
          ! grep -q 'function extractTurn' chatgpt-conversation-markdown-export.user.js
      - name: Commit scoped fix and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/port_renderer.py .github/workflows/port-ai-transcript-renderer.yml
          git add chatgpt-conversation-markdown-export.user.js
          git commit -m 'fix: port AI-transcript citation and image rendering [skip ci]'
          git push origin main
