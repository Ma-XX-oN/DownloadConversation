name: Tag v0.6.153

on:
  push:
    paths:
      - .github/workflows/tag-v0.6.153.yml

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAG_BACKFILL_PAT }}
    steps:
      - name: Create and verify tag
        shell: bash
        run: |
          set -euo pipefail
          target='fb405b62b66aa0a3002827e2feae5c50a5ff45b5'
          tag='v0.6.153'
          if existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha 2>/dev/null); then
            test "$existing" = "$target"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="$target" >/dev/null
          fi
          actual=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha)
          test "$actual" = "$target"
          echo "Verified ${tag} -> ${actual}."
