name: Retry single export snapshot fix

on:
  push:
    paths:
      - .github/workflows/fix-single-export-snapshot-retry.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply corrected guarded export orchestration fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          workflow = Path('.github/workflows/fix-single-export-snapshot-once.yml').read_text(encoding='utf-8')
          match = re.search(r"run: echo '([^']+)' \| base64 -d \| python", workflow)
          assert match, 'Could not recover staged patch payload.'
          patch = base64.b64decode(match.group(1)).decode('utf-8')
          assert 'text[3tart]' in patch
          patch = patch.replace('text[3tart]', 'text[start]')
          exec(compile(patch, '<single-snapshot-patch>', 'exec'))
          PY
      - name: Run complete DownloadConversation preflight
        run: |
          node --check chatgpt-conversation-markdown-export.user.js
          node --test tests/*.test.mjs
          grep -Fq '// @version      0.6.144' chatgpt-conversation-markdown-export.user.js
          test "$(sed -n '/async function runExport(kinds)/,/async function testApiPaginationLogic/p' chatgpt-conversation-markdown-export.user.js | grep -c 'await fetchConversationPages')" -eq 1
          ! grep -Fq "if (jsonl?.checked) await runExport('jsonl')" chatgpt-conversation-markdown-export.user.js
          ! grep -Fq "if (md?.checked) await runExport('md')" chatgpt-conversation-markdown-export.user.js
      - name: Verify scoped diff
        run: |
          test -z "$(git status --short | grep -vE '^( M|\?\?) (chatgpt-conversation-markdown-export.user.js|tests/export-orchestration.test.mjs)$')"
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js tests/export-orchestration.test.mjs
          git commit -m "fix: reuse one API snapshot for selected exports"
          git push
