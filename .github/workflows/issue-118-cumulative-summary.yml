name: Issue 118 cumulative summary

on:
  push:
    branches:
      - issue-118-worked-duration

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply cumulative-summary patch
        run: python scripts/issue-118-cumulative-summary.py

      - name: Verify intended product files only
        run: |
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {
            'DESIGN.md',
            'chatgpt-conversation-markdown-export.user.js',
            'tests/heading-metadata-controls.test.mjs',
          }
          if changed != expected:
            raise SystemExit(f'Unexpected changed files: {sorted(changed)}')
          PY

      - name: Verify pinned AIConversationCore is unchanged
        run: |
          grep -F '@require      https://raw.githubusercontent.com/Ma-XX-oN/AIConversationCore/3233cba838bbf2d2cea5a2a6f1900ed6014dcfb0/dist/aiconversationcore.chatgpt.browser.js' chatgpt-conversation-markdown-export.user.js

      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs

      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js

      - name: Worked-duration regressions
        run: node --test tests/heading-metadata-controls.test.mjs

      - name: Existing canonical final-render regressions
        run: node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs tests/tool-language-diagnostics.test.mjs

      - name: Existing UI regressions
        run: node --test tests/test-list-ui.test.mjs tests/recorder-panel-ui.test.mjs

      - name: Diff preflight
        run: git diff --check

      - name: Commit cumulative-summary correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DESIGN.md chatgpt-conversation-markdown-export.user.js tests/heading-metadata-controls.test.mjs
          git diff --check --cached
          git commit -m 'fix: make reasoning summary duration cumulative (#118)'
          git push origin HEAD:issue-118-worked-duration
