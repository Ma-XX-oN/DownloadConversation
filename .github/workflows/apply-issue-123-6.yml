name: Apply issue 123.6 implementation

on:
  push:
    branches:
      - issue-123-tail-consistency

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-123-tail-consistency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply production and design patch
        run: python scripts/apply-issue-123-6.py
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Version identity regression
        run: node --test tests/version-identity.test.mjs
      - name: Single-snapshot export regression
        run: node --test tests/export-single-snapshot.test.mjs
      - name: Issue 123 regressions
        run: node --test tests/tail-consistency.test.mjs tests/stream-tail-recovery.test.mjs tests/stock-network-diagnostics.test.mjs
      - name: Console lifecycle and provenance controls
        run: node --test tests/console-diagnostics.test.mjs
      - name: Canonical final-render regressions
        run: node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs tests/tool-language-diagnostics.test.mjs tests/sediment-resolver.test.mjs
      - name: UI regressions
        run: node --test tests/test-list-ui.test.mjs tests/recorder-panel-ui.test.mjs tests/heading-metadata-controls.test.mjs
      - name: Diff whitespace check
        run: git diff --check
      - name: Remove staging machinery
        run: |
          rm scripts/apply-issue-123-6.py
          rm .github/workflows/apply-issue-123-6.yml
          git diff --check
      - name: Commit verified issue 123.6 implementation
        run: |
          git config user.name "Ma-XX-oN"
          git config user.email "Ma-XX-oN@users.noreply.github.com"
          git add -A
          git commit -m "fix: trace delayed stock hydration for #123"
          git push origin HEAD:issue-123-tail-consistency
