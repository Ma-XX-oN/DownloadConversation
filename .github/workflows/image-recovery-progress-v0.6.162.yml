name: Image recovery progress v0.6.162

on:
  push:
    paths:
      - .github/workflows/image-recovery-progress-v0.6.162.yml
      - .github/scripts/apply-image-recovery-progress-v162.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply image recovery progress patch
        run: python .github/scripts/apply-image-recovery-progress-v162.py
      - name: Verify full repository checks
        run: |
          node scripts/check-jsdoc.mjs
          node --check chatgpt-conversation-markdown-export.user.js
          node --test tests/*.test.mjs
          git diff --check
      - name: Commit product change and self-clean helpers
        run: |
          rm .github/workflows/image-recovery-progress-v0.6.162.yml
          rm .github/scripts/apply-image-recovery-progress-v162.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ui: show image recovery progress v0.6.162'
          git push origin HEAD:main
