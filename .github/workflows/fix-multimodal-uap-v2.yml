name: Apply multimodal User and UAP fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-multimodal-uap-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch
        run: python3 .github/fix_multimodal_uap.py
      - name: Verify
        run: |
          node --check chatgpt-conversation-markdown-export.user.js
          grep -q '@version      0.6.118' chatgpt-conversation-markdown-export.user.js
          grep -q 'multimodal_text' chatgpt-conversation-markdown-export.user.js
          grep -q 'apiConversationUapFinalGrouping' chatgpt-conversation-markdown-export.user.js
          ! grep -q 'extractTurn(' chatgpt-conversation-markdown-export.user.js
          ! grep -q 'nodeToMarkdown(' chatgpt-conversation-markdown-export.user.js
      - name: Commit
        run: |
          rm -f .github/workflows/fix-multimodal-uap.yml .github/workflows/fix-multimodal-uap-v2.yml .github/fix_multimodal_uap.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix multimodal User rendering and UAP identity in v0.6.118 [skip ci]'
          git push
