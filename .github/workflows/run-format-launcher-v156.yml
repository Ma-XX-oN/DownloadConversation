name: Run launcher formatter v0.6.156

on:
  push:
    paths:
      - .github/workflows/run-format-launcher-v156.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply formatter correction
        shell: bash
        run: |
          set -euo pipefail
          python scripts/format-launcher-v156.py

      - name: Commit formatted instrumentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js
          git diff --cached --check
          git diff --cached --quiet && { echo 'No formatter changes produced.' >&2; exit 1; }
          git commit -m 'diagnostics: format launcher evidence v0.6.156'
          git push origin HEAD:main
