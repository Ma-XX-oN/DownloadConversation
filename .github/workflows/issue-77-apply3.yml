name: Apply issue 77 resolver patch 3

on:
  push:
    branches:
      - issue-77-sediment-resolver
    paths:
      - '.github/workflows/issue-77-apply3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct and validate patch helper
        run: |
          python scripts/issue77_patch_fix.py
          python -m py_compile scripts/issue77_patch.py
      - name: Apply production patch
        run: python scripts/issue77_patch.py
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Sediment resolver regressions
        run: node --test tests/sediment-resolver.test.mjs
      - name: Relevant production regressions
        run: node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs tests/tool-language-diagnostics.test.mjs tests/sediment-resolver.test.mjs
      - name: UI regressions
        run: node --test tests/test-list-ui.test.mjs tests/recorder-panel-ui.test.mjs tests/heading-metadata-controls.test.mjs
      - name: Diff preflight
        run: git diff --check
      - name: Commit implementation and remove temporary scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-77-apply2.yml .github/workflows/issue-77-apply3.yml .github/workflows/issue-77-sediment-resolver.yml scripts/issue77_patch.py scripts/issue77_patch_fix.py
          git add chatgpt-conversation-markdown-export.user.js DESIGN.md tests/heading-metadata-controls.test.mjs .github/workflows/ci.yml
          git commit -m 'fix: resolve sediment images through core transport (#77)'
          git push
