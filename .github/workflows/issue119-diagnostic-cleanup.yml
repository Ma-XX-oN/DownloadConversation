name: Issue 119 diagnostic cleanup

on:
  push:
    branches:
      - issue-119-image-export-timing
    paths:
      - .github/workflows/issue119-diagnostic-cleanup.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-119-image-export-timing
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply diagnostic cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('chatgpt-conversation-markdown-export.user.js')
          script = script_path.read_text(encoding='utf-8')

          replacements = [
            ('// @version      0.6.171', '// @version      0.6.172'),
            ("""      if (diagnosticEnabled('debug')) {
        const diagnosticBlocks = Array.isArray(enrichedEvent?.blocks)
          ? enrichedEvent.blocks.filter(block =>
            block?.type === 'tool_call' || block?.type === 'tool_result')
          : [];
        if (diagnosticBlocks.length) {
          logDiagnostic('debug', 'canonical-tool-normalization', {
            source_record_id: sourceRecordId,
            source_index: sourceIndex,
            source_role: original?.author?.role ?? null,
            source_recipient: original?.recipient ?? null,
            source_channel: original?.channel ?? null,
            source_content_type: original?.content?.content_type ?? null,
            source_language: original?.content?.language ?? null,
            event_kind: enrichedEvent?.kind ?? null,
            event_role: enrichedEvent?.role ?? null,
            event_visibility: enrichedEvent?.visibility ?? null,
            blocks: diagnosticBlocks.map(block => ({
              type: block?.type ?? null,
              name: block?.name ?? null,
              input_format: block?.input_format ?? null,
              language: block?.language ?? null,
              source_language: block?.source_language ?? null,
              input_prefix: boundedDiagnosticText(block?.input ?? '', 240),
              source_input_prefix: boundedDiagnosticText(block?.source_input ?? '', 240)
            }))
          });
        }
      }
""", ''),
          ]
          for old, new in replacements:
            count = script.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one production marker, found {count}: {old[:80]!r}')
            script = script.replace(old, new, 1)

          marker = """  /**
   * Logs diagnostic.
"""
          if script.count(marker) != 1:
            raise SystemExit('Could not locate logDiagnostic documentation marker.')

          helper = """  /**
   * Redacts transient signed URL tokens from diagnostic payloads without mutating callers.
   *
   * @param {Object} value - The diagnostic value to sanitize.
   * @param {WeakMap<Object, Object>} seen - Previously cloned objects keyed by source identity.
   * @returns {Object} The sanitized diagnostic value.
   */
  function redactDiagnosticSignedTokens(value, seen = new WeakMap()) {
    if (typeof value === 'string') {
      return value.replace(/([?&](?:sig|signature)=)[^&#\\s]*/gi, '$1[redacted]');
    }
    if (Array.isArray(value)) {
      if (seen.has(value)) return seen.get(value);
      const clone = [];
      seen.set(value, clone);
      for (const item of value) clone.push(redactDiagnosticSignedTokens(item, seen));
      return clone;
    }
    if (value && typeof value === 'object' &&
        (Object.getPrototypeOf(value) === Object.prototype || Object.getPrototypeOf(value) === null)) {
      if (seen.has(value)) return seen.get(value);
      const clone = {};
      seen.set(value, clone);
      for (const [key, item] of Object.entries(value)) {
        clone[key] = redactDiagnosticSignedTokens(item, seen);
      }
      return clone;
    }
    return value;
  }

"""
          script = script.replace(marker, helper + marker, 1)

          old_logger = """  function logDiagnostic(level, message, data = null) {
    if (!diagnosticEnabled(level)) return;
    const entry = {
      timestamp: new Date().toISOString(),
      level,
      message,
      data
    };
"""
          new_logger = """  function logDiagnostic(level, message, data = null) {
    if (!diagnosticEnabled(level)) return;
    const safeData = redactDiagnosticSignedTokens(data);
    const entry = {
      timestamp: new Date().toISOString(),
      level,
      message,
      data: safeData
    };
"""
          if script.count(old_logger) != 1:
            raise SystemExit('Could not locate exact logDiagnostic entry construction.')
          script = script.replace(old_logger, new_logger, 1)
          old_console = """    if (data !== null) args.push(data);
"""
          new_console = """    if (safeData !== null) args.push(safeData);
"""
          if script.count(old_console) != 1:
            raise SystemExit('Could not locate exact diagnostic console payload.')
          script = script.replace(old_console, new_console, 1)
          script_path.write_text(script, encoding='utf-8')

          heading_path = Path('tests/heading-metadata-controls.test.mjs')
          heading = heading_path.read_text(encoding='utf-8')
          old = r'/\/\/ @version      0\.6\.171/'
          new = r'/\/\/ @version      0\.6\.172/'
          if heading.count(old) != 1:
            raise SystemExit(f'Expected one heading version assertion, found {heading.count(old)}')
          heading_path.write_text(heading.replace(old, new, 1), encoding='utf-8')

          sediment_path = Path('tests/sediment-resolver.test.mjs')
          sediment = sediment_path.read_text(encoding='utf-8')
          old = r'/\/\/ @version      0\.6\.171/'
          new = r'/\/\/ @version      0\.6\.172/'
          if sediment.count(old) != 1:
            raise SystemExit(f'Expected one sediment version assertion, found {sediment.count(old)}')
          sediment_path.write_text(sediment.replace(old, new, 1), encoding='utf-8')

          diagnostics_path = Path('tests/tool-language-diagnostics.test.mjs')
          diagnostics = diagnostics_path.read_text(encoding='utf-8')
          old_test = """test('tool language diagnostics expose canonical normalization and production routing at debug level', () => {
  assert.match(userscript, /logDiagnostic\\('debug', 'canonical-tool-normalization'/);
  assert.match(userscript, /input_format: block\\?\\.input_format \\?\\? null/);
  assert.match(userscript, /language: block\\?\\.language \\?\\? null/);
  assert.match(userscript, /source_language: block\\?\\.source_language \\?\\? null/);
  assert.match(userscript, /source_input_prefix: boundedDiagnosticText/);
  assert.match(userscript, /logDiagnostic\\('debug', 'canonical-tool-segment-routing'/);
  assert.match(userscript, /complete: canonicalSegmentComplete/);
  assert.match(userscript, /eligible: canonicalSegmentEligible/);
});
"""
          new_test = """test('tool routing diagnostics retain production segment decisions without per-record normalization dumps', () => {
  assert.doesNotMatch(userscript, /canonical-tool-normalization/,
    'Closed #103 instrumentation must not emit one normalization payload per tool record.');
  assert.doesNotMatch(userscript, /source_input_prefix: boundedDiagnosticText/,
    'Closed #103 instrumentation must not retain source tool-input prefixes.');
  assert.match(userscript, /logDiagnostic\\('debug', 'canonical-tool-segment-routing'/);
  assert.match(userscript, /complete: canonicalSegmentComplete/);
  assert.match(userscript, /eligible: canonicalSegmentEligible/);
});
"""
          if diagnostics.count(old_test) != 1:
            raise SystemExit('Could not locate exact closed-#103 diagnostic regression.')
          diagnostics = diagnostics.replace(old_test, new_test, 1)

          anchor = """test('issue 114 traces an accepted assistant segment through Markdown assembly and download boundaries', () => {
"""
          if diagnostics.count(anchor) != 1:
            raise SystemExit('Could not locate diagnostic-regression insertion point.')
          redaction_test = r'''test('diagnostic logging redacts signed URL tokens recursively before retention or console output', async () => {
  const vm = await import('node:vm');
  const sourceOf = name => {
    const start = userscript.indexOf(`  function ${name}(`);
    assert.ok(start >= 0, `${name} is missing.`);
    const brace = userscript.indexOf('{', start);
    let depth = 0;
    for (let index = brace; index < userscript.length; index += 1) {
      if (userscript[index] === '{') depth += 1;
      else if (userscript[index] === '}') {
        depth -= 1;
        if (depth === 0) return userscript.slice(start, index + 1);
      }
    }
    throw new Error(`${name} has an unterminated body.`);
  };
  const context = {};
  vm.runInNewContext(
    `${sourceOf('redactDiagnosticSignedTokens')}\nthis.redact = redactDiagnosticSignedTokens;`,
    context
  );
  const original = {
    dom_candidate: {
      src: 'https://chatgpt.com/backend-api/estuary/content?id=file_x&sig=secret-token&v=0'
    },
    nested: [{ url: 'https://example.test/path?x=1&signature=other-secret#fragment' }],
    ordinary: 'https://example.test/path?x=1'
  };
  const redacted = context.redact(original);
  assert.equal(
    redacted.dom_candidate.src,
    'https://chatgpt.com/backend-api/estuary/content?id=file_x&sig=[redacted]&v=0'
  );
  assert.equal(
    redacted.nested[0].url,
    'https://example.test/path?x=1&signature=[redacted]#fragment'
  );
  assert.equal(redacted.ordinary, original.ordinary);
  assert.match(original.dom_candidate.src, /sig=secret-token/,
    'Diagnostic redaction must not mutate the caller payload.');
  const logger = sourceOf('logDiagnostic');
  assert.match(logger, /const safeData = redactDiagnosticSignedTokens\(data\)/);
  assert.match(logger, /data: safeData/);
  assert.match(logger, /args\.push\(safeData\)/);
  assert.doesNotMatch(logger, /args\.push\(data\)/);
});

'''
          diagnostics = diagnostics.replace(anchor, redaction_test + anchor, 1)
          diagnostics_path.write_text(diagnostics, encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          git diff --check
          node --check chatgpt-conversation-markdown-export.user.js
          node scripts/check-jsdoc.mjs
          node --test tests/tool-language-diagnostics.test.mjs tests/sediment-resolver.test.mjs tests/heading-metadata-controls.test.mjs
          node --test tests/*.test.mjs
          grep -q '// @version      0.6.172' chatgpt-conversation-markdown-export.user.js
          ! grep -q 'canonical-tool-normalization' chatgpt-conversation-markdown-export.user.js
          ! grep -q 'source_input_prefix: boundedDiagnosticText' chatgpt-conversation-markdown-export.user.js

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js \
            tests/heading-metadata-controls.test.mjs \
            tests/sediment-resolver.test.mjs \
            tests/tool-language-diagnostics.test.mjs
          git commit -m 'fix: redact signed diagnostics and remove stale tool dumps (#119)'
          git push origin HEAD:issue-119-image-export-timing
