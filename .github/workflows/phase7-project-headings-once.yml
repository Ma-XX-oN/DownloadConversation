name: Phase 7 project headings once

on:
  push:
    paths:
      - .github/workflows/phase7-project-headings-once.yml
      - scripts/phase7-project-headings.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Phase 7 projection bridge
        run: python scripts/phase7-project-headings.py
      - name: Production documentation
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Rendering regressions
        run: node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs tests/tool-language-diagnostics.test.mjs
      - name: Remaining regressions
        run: node --test tests/test-list-ui.test.mjs tests/recorder-panel-ui.test.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified production integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs
          git commit -m "phase7: project source headings through completed core"
          git push
