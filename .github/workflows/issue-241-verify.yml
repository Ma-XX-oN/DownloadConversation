name: Issue 241 COMM boundary verification
on:
  push:
    branches: [issue-241-comm-boundary-version-v3]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused independent unit tests
        run: node --test tests/issue-241-comm-boundary.test.cjs
      - name: Rebuild exact userscript
        run: node scripts/build-userscript.mjs
      - name: Verify generated artifact
        run: |
          node --check chatgpt-conversation-markdown-export.user.js
          node scripts/build-userscript.mjs --check
      - name: Commit built artifact to issue branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add chatgpt-conversation-markdown-export.user.js
          if ! git diff --cached --quiet; then
            git commit -m "build(#241): regenerate tested userscript artifact"
            git push origin HEAD:issue-241-comm-boundary-version-v3
          fi
