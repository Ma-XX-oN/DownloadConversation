name: Apply Issue 96 Modal Focus Fix

on:
  push:
    branches:
      - issue-96-preserve-modal-focus
    paths:
      - .github/workflows/apply-issue-96-focus.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-96-preserve-modal-focus
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply production fix
        run: python scripts/apply-issue-96-focus.py
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Version identity regression
        run: node --test tests/version-identity.test.mjs
      - name: Modal focus regression
        run: node --test tests/modal-focus-retention.test.mjs tests/recorder-panel-ui.test.mjs tests/test-list-ui.test.mjs
      - name: Existing export regression
        run: node --test tests/export-single-snapshot.test.mjs tests/heading-metadata-controls.test.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js DESIGN.md
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "fix: preserve modal focus on static clicks (#96)"
          git push origin HEAD:issue-96-preserve-modal-focus
