name: DC 298 independent rebase acceptance matrix
on:
  push:
    branches:
      - verify-rebase-dc298-20261024
permissions:
  contents: read
jobs:
  test:
    name: matrix-${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: last, command: 'node --test tests/issue298-aicc-bridge.test.mjs' }
          - { label: timer, command: 'node --test tests/agent-turn-stopwatch.test.mjs tests/agent-stopwatch-v1-identity.test.mjs tests/recording-panel-modes.test.mjs' }
          - { label: typescript, command: 'node scripts/check-userscript-types.mjs' }
          - { label: jsdoc, command: 'node scripts/check-jsdoc.mjs' }
          - { label: bundle, command: 'node scripts/build-userscript.mjs --output /tmp/dc298-rebase.user.js && node scripts/verify-userscript-artifact.mjs /tmp/dc298-rebase.user.js' }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Establish ancestry
        run: git merge-base --is-ancestor e6a083cd883e99e9d30e7ba440062bea6060b9be HEAD
      - name: Run ${{ matrix.label }} acceptance
        run: ${{ matrix.command }}
