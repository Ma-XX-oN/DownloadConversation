name: Promote Issue 123

on:
  push:
    branches:
      - issue-123-tail-consistency
    paths:
      - .github/workflows/promote-issue-123.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-123-tail-consistency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply release promotion
        run: python scripts/promote-issue-123.py
      - name: Verify promoted version
        run: |
          grep -F '// @version      1.1.0' chatgpt-conversation-markdown-export.user.js
          ! grep -F '1.0.1-issue.123.11' chatgpt-conversation-markdown-export.user.js
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Version identity regression
        run: node --test tests/version-identity.test.mjs
      - name: Full project tests
        run: node --test tests/*.test.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit release promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js DESIGN.md
          git commit -m "release: promote Issue 123 to DownloadConversation 1.1.0"
          git push origin HEAD:issue-123-tail-consistency
