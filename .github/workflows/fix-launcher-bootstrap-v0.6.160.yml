name: Fix launcher bootstrap v0.6.160

on:
  push:
    paths:
      - .github/workflows/fix-launcher-bootstrap-v0.6.160.yml
      - .github/patch-launcher-bootstrap-v0.6.160.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply delayed launcher bootstrap
        run: python .github/patch-launcher-bootstrap-v0.6.160.py
      - name: Verify full repository checks
        run: |
          set -euo pipefail
          node scripts/check-jsdoc.mjs
          node --check chatgpt-conversation-markdown-export.user.js
          node --test tests/*.test.mjs
          git diff --check
      - name: Commit product fix and self-clean helpers
        run: |
          set -euo pipefail
          rm .github/workflows/fix-launcher-bootstrap-v0.6.160.yml
          rm .github/patch-launcher-bootstrap-v0.6.160.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: delay launcher until BODY reconciliation settles v0.6.160'
          git push origin HEAD:main
