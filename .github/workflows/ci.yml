name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Canonical final-render regressions
        run: node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs tests/tool-language-diagnostics.test.mjs
      - name: Built-in test list UI regression
        run: node --test tests/test-list-ui.test.mjs
      - name: Recorder panel UI regression
        run: node --test tests/recorder-panel-ui.test.mjs

  cross-consumer-final-render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DownloadConversation
        uses: actions/checkout@v4
      - name: Check out pinned AIConversationCore
        uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/AIConversationCore
          ref: 29a9fea4903f0214d450e1399a7af8e20823fcd1
          path: .phase7-core
      - name: Check out pinned AI-General-Memory
        uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/AI-General-Memory
          ref: 264379d7f5db42217dc56498605ce03da0459b60
          path: .phase7-aigm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install AI-transcript presentation dependencies
        run: python -m pip install colorama regex
      - name: Mixed rich final-render parity
        env:
          PHASE7_CORE_ROOT: ${{ github.workspace }}/.phase7-core
          PHASE7_AIGM_ROOT: ${{ github.workspace }}/.phase7-aigm
        run: node tests/phase7-cross-consumer-parity.mjs
      - name: Markdown-shape and multi-exchange parity
        env:
          PHASE7_CORE_ROOT: ${{ github.workspace }}/.phase7-core
          PHASE7_AIGM_ROOT: ${{ github.workspace }}/.phase7-aigm
        run: node tests/phase7-cross-consumer-markdown-shape.mjs
      - name: Adversarial containment and normalization parity
        env:
          PHASE7_CORE_ROOT: ${{ github.workspace }}/.phase7-core
          PHASE7_AIGM_ROOT: ${{ github.workspace }}/.phase7-aigm
        run: node tests/phase7-cross-consumer-adversarial.mjs

  apply-issue-109:
    if: github.event_name == 'push' && github.event.head_commit.message == 'ci: run issue 109 implementation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply staged patch
        shell: python
        run: |
          import base64
          import re
          from pathlib import Path
          workflow = Path('.github/workflows/issue-109-heading-metadata.yml').read_text(encoding='utf-8')
          match = re.search(r"base64\.b64decode\('([^']+)'\)", workflow)
          if not match:
            raise SystemExit('staged patch payload not found')
          exec(base64.b64decode(match.group(1)).decode())
      - name: Restore workflow file and run gates
        run: |
          git checkout -- .github/workflows/ci.yml
          node --check chatgpt-conversation-markdown-export.user.js
          node scripts/check-jsdoc.mjs
          node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs tests/tool-language-diagnostics.test.mjs
          node --test tests/test-list-ui.test.mjs
          node --test tests/recorder-panel-ui.test.mjs
          git diff --check
      - name: Commit gated feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js tests/core-integration.test.mjs tests/recorder-panel-ui.test.mjs DESIGN.md
          git commit -m 'export: add Markdown heading metadata controls'
          git push
