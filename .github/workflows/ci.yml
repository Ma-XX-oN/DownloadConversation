name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Canonical final-render regressions
        run: node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs tests/tool-language-diagnostics.test.mjs
      - name: Built-in test list UI regression
        run: node --test tests/test-list-ui.test.mjs
      - name: Recorder panel UI regression
        run: node --test tests/recorder-panel-ui.test.mjs

  cross-consumer-final-render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DownloadConversation
        uses: actions/checkout@v4
      - name: Check out pinned AIConversationCore
        uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/AIConversationCore
          ref: 3233cba838bbf2d2cea5a2a6f1900ed6014dcfb0
          path: .phase7-core
      - name: Check out pinned AI-General-Memory
        uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/AI-General-Memory
          ref: 070e7436ca68d4897f99cf86e92f9ee97b87ee02
          path: .phase7-aigm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install AI-transcript presentation dependencies
        run: python -m pip install colorama regex
      - name: Mixed rich final-render parity
        env:
          PHASE7_CORE_ROOT: ${{ github.workspace }}/.phase7-core
          PHASE7_AIGM_ROOT: ${{ github.workspace }}/.phase7-aigm
        run: node tests/phase7-cross-consumer-parity.mjs
      - name: Markdown-shape and multi-exchange parity
        env:
          PHASE7_CORE_ROOT: ${{ github.workspace }}/.phase7-core
          PHASE7_AIGM_ROOT: ${{ github.workspace }}/.phase7-aigm
        run: node tests/phase7-cross-consumer-markdown-shape.mjs
      - name: Adversarial containment and normalization parity
        env:
          PHASE7_CORE_ROOT: ${{ github.workspace }}/.phase7-core
          PHASE7_AIGM_ROOT: ${{ github.workspace }}/.phase7-aigm
        run: node tests/phase7-cross-consumer-adversarial.mjs

  fix-isolated-metadata-state:
    if: github.event_name == 'push' && github.event.head_commit.message == 'ci-self-contained-metadata'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make renderer metadata options safe in isolated VM tests
        shell: python
        run: |
          from pathlib import Path
          path = Path('chatgpt-conversation-markdown-export.user.js')
          text = path.read_text(encoding='utf-8')
          old = """    if (showTimestamps) {
                const timestamp = transcriptTimestamp(record);
                if (timestamp) metadata.timestamp = timestamp;
              }
              if (showRecordNumbers && Number.isInteger(recordNumber)) metadata.record_number = recordNumber;
          """
          new = """    if (typeof showTimestamps !== 'undefined' && showTimestamps) {
                const timestamp = transcriptTimestamp(record);
                if (timestamp) metadata.timestamp = timestamp;
              }
              if (typeof showRecordNumbers !== 'undefined' && showRecordNumbers &&
                  Number.isInteger(recordNumber)) metadata.record_number = recordNumber;
          """
          if old not in text:
            raise SystemExit('metadata state guard insertion point not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Run complete normal gates
        run: |
          node --check chatgpt-conversation-markdown-export.user.js
          node scripts/check-jsdoc.mjs
          node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs tests/tool-language-diagnostics.test.mjs
          node --test tests/test-list-ui.test.mjs
          node --test tests/recorder-panel-ui.test.mjs
          git diff --check
      - name: Commit renderer guard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js
          git commit -m 'export: default isolated heading metadata options off'
          git push
