name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Phase 5 canonical integration regression
        run: node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs
      - name: Built-in test list UI regression
        run: node --test tests/test-list-ui.test.mjs
      - name: Recorder panel UI regression
        run: node --test tests/recorder-panel-ui.test.mjs
