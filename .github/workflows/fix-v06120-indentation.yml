name: Fix v0.6.120 indentation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-v06120-indentation.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct indentation in #71 changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('chatgpt-conversation-markdown-export.user.js')
          text = path.read_text(encoding='utf-8')
          assert '// @version      0.6.120' in text

          def extract_js_function(source, name):
            marker = f'  function {name}('
            start = source.index(marker)
            brace = source.index('{', start)
            depth = 0
            quote = None
            escape = False
            i = brace
            while i < len(source):
              ch = source[i]
              if quote:
                if escape:
                  escape = False
                elif ch == '\\':
                  escape = True
                elif ch == quote:
                  quote = None
              else:
                if ch in "'\"`":
                  quote = ch
                elif ch == '{':
                  depth += 1
                elif ch == '}':
                  depth -= 1
                  if depth == 0:
                    end = i + 1
                    while end < len(source) and source[end] in '\r\n':
                      end += 1
                    return source[start:end]
              i += 1
            raise RuntimeError(name)

          def indent_body(source, name):
            old = extract_js_function(source, name)
            trailing = '\n\n' if old.endswith('\n\n') else '\n' if old.endswith('\n') else ''
            core = old.rstrip('\r\n')
            lines = core.splitlines()
            assert len(lines) >= 3
            assert lines[0].startswith(f'  function {name}(')
            assert lines[-1] == '  }'
            lines[1:-1] = [('  ' + line) if line else line for line in lines[1:-1]]
            new = '\n'.join(lines) + trailing
            return source.replace(old, new, 1)

          text = indent_body(text, 'renderConversationMarkdown')
          text = indent_body(text, 'testMultimodalUserAndChronologicalOrder')

          assert "  function renderConversationMarkdown(spine, onProgress) {\n    assert(" in text
          assert "  async function testMultimodalUserAndChronologicalOrder() {\n    const record" in text
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify source
        shell: bash
        run: |
          node --check chatgpt-conversation-markdown-export.user.js
          grep -q '@version      0.6.120' chatgpt-conversation-markdown-export.user.js
          grep -q 'Multimodal User + chronological order' chatgpt-conversation-markdown-export.user.js
          ! grep -A80 'function renderConversationMarkdown' chatgpt-conversation-markdown-export.user.js | grep -q 'apiConversationUapFinalGrouping'
      - name: Commit correction and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-v06120-indentation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chatgpt-conversation-markdown-export.user.js .github/workflows/fix-v06120-indentation.yml
          git commit -m 'Correct v0.6.120 chronological-rendering indentation [skip ci]'
          git push
