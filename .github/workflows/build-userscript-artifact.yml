name: Build committed userscript artifact

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'scripts/build-userscript.mjs'
      - 'scripts/userscript-build-lib.mjs'
      - '.github/workflows/build-userscript-artifact.yml'
  workflow_dispatch:

concurrency:
  group: userscript-artifact-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure generated-artifact identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Materialize and publish only the generated userscript
        run: node scripts/test-cycle-artifact.mjs prepare --branch "${GITHUB_REF_NAME}" --push
      - name: Assert generated-artifact-only bot commit
        shell: bash
        run: |
          if [ "$(git log -1 --pretty=%an)" = "github-actions[bot]" ]; then
            changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
            if [ "$changed" != "chatgpt-conversation-markdown-export.user.js" ]; then
              echo "Generated-artifact workflow changed unexpected path(s):"
              echo "$changed"
              exit 1
            fi
          fi
