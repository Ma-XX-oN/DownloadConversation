name: Add pagination diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-pagination-diagnostics.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instrument Conversation API pagination
        run: python3 .github/scripts/add-pagination-diagnostics.py
      - name: Syntax check
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Verify diagnostics and preserve UI contracts
        shell: bash
        run: |
          grep -q "@version      0.6.116" chatgpt-conversation-markdown-export.user.js
          grep -q "conversation-api-page-http-failure" chatgpt-conversation-markdown-export.user.js
          grep -q "conversation-api-page-success" chatgpt-conversation-markdown-export.user.js
          grep -q "textContent = 'Record'" chatgpt-conversation-markdown-export.user.js
          grep -q "panel.style.display = 'none'" chatgpt-conversation-markdown-export.user.js
          ! grep -q "discoverPageCount" chatgpt-conversation-markdown-export.user.js
      - name: Commit instrumented source and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/add-pagination-diagnostics.yml
          rm .github/scripts/add-pagination-diagnostics.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chatgpt-conversation-markdown-export.user.js .github/workflows/add-pagination-diagnostics.yml .github/scripts/add-pagination-diagnostics.py
          git commit -m "Add Conversation API pagination diagnostics in v0.6.116 [skip ci]"
          git push
