import { readFile } from 'node:fs/promises';
import test from 'node:test';

const userscript = await readFile(new URL('../chatgpt-conversation-markdown-export.user.js', import.meta.url), 'utf8');

test('sediment image recovery consumes Core canonical transport instead of reconstructing provider mapping', () => {
  assert.match(userscript, /function canonicalImageResourcesByPart\(record\)/);
  assert.match(userscript, /canonicalCore\(\)\.adaptChatGPTRecords\(\[record\]\)/);
  assert.match(userscript, /resource\?\.resource_kind !== 'conversation_image'/);
  assert.match(userscript, /typeof resource\?\.download_url === 'string'/);
  assert.match(userscript, /fetchCanonicalResolvedImageDataUrl\(resource\.download_url\.trim\(\), timing\)/);
  assert.doesNotMatch(
    userscript,
    /sediment:\/\/.*backend-api\/files\/download/s,
    'DownloadConversation must not duplicate the sediment-to-download endpoint mapping owned by AIConversationCore.'
  );
});

test('Core-resolved images do not depend on mounted DOM recovery', () => {
  const transportAt = userscript.indexOf("const hasCanonicalTransport = typeof resource?.download_url === 'string'");
  const domAt = userscript.indexOf('if (candidates[index] instanceof HTMLImageElement)', transportAt);
  const continueAt = userscript.indexOf('continue;', transportAt);
  assert.ok(transportAt >= 0 && continueAt > transportAt && domAt > continueAt,
    'Core transport/data path must complete before the optional DOM fallback is considered.');
  assert.match(userscript, /path: hasCanonicalData \? 'core-data' : 'core-resolver'/);
});

test('resolver follows transient download_url without logging or persisting it', () => {
  assert.match(userscript, /const resolverPayload = await resolverResponse\.json\(\)/);
  assert.match(userscript, /typeof resolverPayload\?\.download_url === 'string'/);
  assert.match(userscript, /dataUrl = await fetchCanonicalResolvedImageDataUrl\(resource\.download_url\.trim\(\), timing\)/);
  assert.doesNotMatch(userscript, /logDiagnostic\([^\n]*download_url/,
    'Signed resolver download_url must not be emitted to diagnostics.');
});

test('image resolution preserves missing versus unavailable semantics', () => {
  assert.match(userscript, /cgImageFailureMarkdown\(source, Number\.isFinite\(status\) \? status : null\)/);
  assert.match(userscript, /if \(httpStatus === 404 \|\| httpStatus === 410\) return '\[image missing\]'/);
  assert.match(userscript, /return cgImageUnavailableMarkdown\(source\)/);
});

test('userscript version advances for sediment resolver completion', () => {
  assert.match(userscript, /\/\/ @version      0\.6\.170/);
});
