name: Issue 136 iteration 4 apply

on:
  push:
    branches:
      - issue-136-agent-turn-stopwatch

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply asserted iteration-4 correction
        run: python scripts/apply-issue-136-iteration-4.py
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Stopwatch unit regression
        run: node --test tests/agent-turn-stopwatch.test.mjs
      - name: Stopwatch stream integration
        run: node --test tests/agent-turn-stopwatch-stream.test.mjs
      - name: Stopwatch live total regression
        run: node --test tests/agent-turn-stopwatch-live-total.test.mjs
      - name: Existing completion sound regression
        run: node --test tests/agent-completion-sounds.test.mjs
      - name: Stream-tail recovery regression
        run: node --test tests/stream-tail-recovery.test.mjs
      - name: Commit verified correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js DESIGN.md tests/agent-turn-stopwatch.test.mjs
          git diff --cached --check
          git commit -m "feat(#136): show live stopwatch total"
          git push
