name: Temporary #156 Stable Integration Build
on:
  push:
    branches:
      - integrate-156-provider-core-isolation
permissions:
  contents: write
jobs:
  build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build exact stable userscript
        run: node scripts/build-userscript.mjs
      - name: Commit generated artifact at stable version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified stable 1.11.0 #156 userscript"
            git push origin HEAD:integrate-156-provider-core-isolation
          fi
      - name: Verify exact built userscript
        run: node scripts/verify-userscript-artifact.mjs
      - name: Run repository acceptance validation
        run: python scripts/repoworkflow-validate.py
