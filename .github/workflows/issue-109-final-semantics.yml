name: Issue 109 final semantics gate

on:
  push:
    paths:
      - .github/workflows/issue-109-final-semantics.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover and apply verified issue 109 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output([
            'git', 'show',
            'c25305ba341816307069f78b0a42e011f14fd222:.github/workflows/issue-109-final-semantics.yml'
          ], text=True)
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          patch = '\n'.join(
            line[10:] if line.startswith('          ') else line
            for line in lines
          ) + '\n'
          old = "  assert.doesNotMatch(userscript, /<!-- turn_id=[^>]+-->/);"
          new = "  assert.doesNotMatch(userscript, /<!-- turn_id=[^>\\r\\n]+-->/);"
          if patch.count(old) != 1:
            raise RuntimeError(f'expected one broad assertion in recovered patch, found {patch.count(old)}')
          patch = patch.replace(old, new, 1)
          Path('/tmp/issue-109-patch.py').write_text(patch, encoding='utf-8')
          PY
          python /tmp/issue-109-patch.py
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: Focused local regressions
        run: node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs tests/tool-language-diagnostics.test.mjs tests/test-list-ui.test.mjs tests/recorder-panel-ui.test.mjs tests/heading-metadata-controls.test.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js DESIGN.md tests/heading-metadata-controls.test.mjs tests/phase5-rich-core-integration.test.mjs tests/phase7-cross-consumer-parity.mjs tests/phase7-cross-consumer-markdown-shape.mjs tests/phase7-cross-consumer-adversarial.mjs .github/workflows/ci.yml
          git commit -m "export: finalize first-class heading metadata controls"
          git push
