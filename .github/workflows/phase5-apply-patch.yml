name: Phase 5 apply guarded patch

on:
  push:
    paths:
      - .github/workflows/phase5-apply-patch.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: python scripts/phase5-integration-patch.py
      - name: Verify patched production source
        run: |
          node --check chatgpt-conversation-markdown-export.user.js
          node --test tests/core-integration.test.mjs
          grep -Fq '// @version      0.6.134' chatgpt-conversation-markdown-export.user.js
          grep -Fq '456b14c565e0745b1cc89e6522a7f1a160a290ba/dist/aiconversationcore.chatgpt.browser.js' chatgpt-conversation-markdown-export.user.js
          test "$(grep -c 'BEGIN AIConversationCore Phase 5 integration' chatgpt-conversation-markdown-export.user.js)" -eq 1
      - name: Commit verified production source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js
          git commit -m "feat: integrate canonical plain Markdown rendering"
          git push
