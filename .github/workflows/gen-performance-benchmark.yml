name: GEN persistence performance benchmark

on:
  push:
    branches:
      - issue-251-gen-performance-benchmark
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Candidate source benchmark
        run: node tests/gen-persistence-performance.bench.mjs HEAD | tee candidate.json
      - name: Original main source benchmark
        run: node tests/gen-persistence-performance.bench.mjs origin/main | tee baseline.json
      - name: Publish benchmark measurements
        uses: actions/upload-artifact@v4
        with:
          name: gen-performance-issue-251
          path: |
            candidate.json
            baseline.json
