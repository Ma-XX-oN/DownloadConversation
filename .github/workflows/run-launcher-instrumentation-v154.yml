name: Run launcher instrumentation v0.6.154

on:
  push:
    paths:
      - .github/workflows/run-launcher-instrumentation-v154.yml

permissions:
  contents: write

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract instrumentation script
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /^      - name: Instrument launcher lifecycle$/ { found=1; next }
            found && /^        run: \|$/ { capture=1; next }
            capture && /^      - name: Commit instrumentation$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/instrument-launcher-lifecycle-v154.yml > /tmp/instrument-launcher-v154.py
          test -s /tmp/instrument-launcher-v154.py
          python /tmp/instrument-launcher-v154.py

      - name: Commit instrumentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js
          git diff --cached --check
          git diff --cached --quiet && { echo 'No instrumentation changes produced.' >&2; exit 1; }
          git commit -m 'diagnostics: preserve launcher removal evidence v0.6.154'
          git push origin HEAD:main
