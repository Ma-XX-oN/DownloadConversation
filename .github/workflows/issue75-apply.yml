name: Issue 75 Apply

on:
  push:
    branches:
      - issue-75-jump-materialization-convergence

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check correction state
        id: gate
        shell: bash
        run: |
          if grep -q '1.2.0-issue.75.3' chatgpt-conversation-markdown-export.user.js; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply issue 75 correction
        if: steps.gate.outputs.needed == 'true'
        run: python3 tools/issue75-apply.py
      - name: Align direct-mount regression with incremental traversal
        if: steps.gate.outputs.needed == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/jump-materialization.test.mjs')
          text = path.read_text(encoding='utf-8')
          old_name = "test('Jump 0 succeeds when moving to the top directly mounts the requested message without a TOC control', async () => {"
          new_name = "test('Jump 0 succeeds when upward traversal directly mounts the requested message without a TOC control', async () => {"
          old_condition = "      if (kind === 'to' && root.scrollTop === 0) state.mounted = true;"
          new_condition = "      if (kind === 'by' && root.scrollTop === 0) state.mounted = true;"
          assert text.count(old_name) == 1, 'Expected one old direct-mount test name.'
          assert text.count(old_condition) == 1, 'Expected one old direct scrollTo test condition.'
          text = text.replace(old_name, new_name, 1)
          text = text.replace(old_condition, new_condition, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify focused correction
        if: steps.gate.outputs.needed == 'true'
        run: |
          node --check chatgpt-conversation-markdown-export.user.js
          node scripts/check-jsdoc.mjs
          node --test tests/jump-materialization.test.mjs
          git diff --check
          if git diff --exit-code --quiet; then
            echo 'Patch produced no changes.' >&2
            exit 1
          fi
      - name: Commit correction
        if: steps.gate.outputs.needed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js tests/jump-materialization.test.mjs DESIGN.md
          git commit -m 'fix(#75): follow stock historical pagination re-arm'
          git push origin HEAD:issue-75-jump-materialization-convergence
