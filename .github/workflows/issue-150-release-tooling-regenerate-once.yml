name: Issue 150 regenerate userscript after release tooling once

on:
  push:
    branches:
      - issue-150-modular-userscript-build
    paths:
      - .github/workflows/issue-150-release-tooling-regenerate-once.yml

permissions:
  contents: write

jobs:
  regenerate-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Regenerate deterministic userscript artifact
        run: node scripts/build-userscript.mjs

      - name: Verify complete local CI gate
        run: node scripts/run-ci.mjs

      - name: Verify diff hygiene
        run: git diff --check

      - name: Commit regenerated artifact and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js
          git rm .github/workflows/issue-150-release-tooling-regenerate-once.yml
          git diff --cached --exit-code --quiet && {
            echo "Expected regenerated artifact/workflow removal changes were not produced."
            exit 1
          }
          git commit -m "build(#150): regenerate userscript after release tooling"
          git push origin HEAD:issue-150-modular-userscript-build
