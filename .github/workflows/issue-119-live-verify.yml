name: Issue 119 live verify

on:
  push:
    branches:
      - issue-119-image-export-timing

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify helper syntax
        run: python -m py_compile scripts/issue-119-live-fix.py
      - name: Apply patch in workspace
        run: python scripts/issue-119-live-fix.py
      - name: Diff preflight
        run: |
          git diff --check
          git diff -- DESIGN.md chatgpt-conversation-markdown-export.user.js tests/tool-language-diagnostics.test.mjs
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {
            'DESIGN.md',
            'chatgpt-conversation-markdown-export.user.js',
            'tests/tool-language-diagnostics.test.mjs',
          }
          if changed != expected:
            raise SystemExit(f'Unexpected changed files: {sorted(changed)}')
          PY
      - name: Verify page size and Core pin
        run: |
          grep -F 'const PAGE_TURNS = 20;' chatgpt-conversation-markdown-export.user.js
          grep -F '@require      https://raw.githubusercontent.com/Ma-XX-oN/AIConversationCore/3233cba838bbf2d2cea5a2a6f1900ed6014dcfb0/dist/aiconversationcore.chatgpt.browser.js' chatgpt-conversation-markdown-export.user.js
      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Focused issue 119 regressions
        run: node --test tests/tool-language-diagnostics.test.mjs tests/recorder-panel-ui.test.mjs
      - name: Full JavaScript suite
        run: node --test tests/*.test.mjs
      - name: Commit verified correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DESIGN.md chatgpt-conversation-markdown-export.user.js tests/tool-language-diagnostics.test.mjs
          git diff --check --cached
          git commit -m 'perf: remove redundant Markdown diagnostic scans (#119)'
          git push origin HEAD:issue-119-image-export-timing
