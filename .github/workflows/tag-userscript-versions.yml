name: Tag userscript versions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create missing version tags
        shell: bash
        run: |
          set -euo pipefail

          script='chatgpt-conversation-markdown-export.user.js'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --force --tags origin

          mapfile -t versions < <(
            while IFS= read -r commit; do
              git show "${commit}:${script}" 2>/dev/null \
                | sed -nE 's#^//[[:space:]]*@version[[:space:]]+([^[:space:]]+).*$#\1#p' \
                | head -n 1 || true
            done < <(git rev-list --reverse "${GITHUB_SHA}" -- "$script") \
              | awk 'NF && !seen[$0]++'
          )

          for version in "${versions[@]}"; do
            tag="v${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "Existing ${tag}"
              continue
            fi

            tagged=false
            while IFS= read -r commit; do
              commit_version="$(git show "${commit}:${script}" 2>/dev/null \
                | sed -nE 's#^//[[:space:]]*@version[[:space:]]+([^[:space:]]+).*$#\1#p' \
                | head -n 1 || true)"
              if [[ "$commit_version" != "$version" ]]; then
                continue
              fi

              if git diff-tree --no-commit-id --name-only -r "$commit" \
                | grep -q '^\.github/workflows/'; then
                continue
              fi

              git tag "$tag" "$commit"
              if git push origin "refs/tags/${tag}"; then
                echo "Created ${tag} at ${commit}"
                tagged=true
                break
              fi
              git tag -d "$tag"
            done < <(git rev-list "${GITHUB_SHA}" -- "$script")

            if [[ "$tagged" != true ]]; then
              echo "Unable to create ${tag}: no pushable commit found" >&2
              exit 1
            fi
          done
