name: Tag userscript versions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create missing version tags
        shell: bash
        run: |
          set -euo pipefail

          script='chatgpt-conversation-markdown-export.user.js'
          previous_version=''

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --force --tags origin

          while IFS= read -r commit; do
            version="$(git show "${commit}:${script}" 2>/dev/null | sed -nE 's#^//[[:space:]]*@version[[:space:]]+([^[:space:]]+).*$#\1#p' | head -n 1 || true)"
            if [[ -z "$version" || "$version" == "$previous_version" ]]; then
              continue
            fi
            previous_version="$version"

            tag="v${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "Existing ${tag}"
              continue
            fi

            git tag "$tag" "$commit"
            git push origin "refs/tags/${tag}"
            echo "Created ${tag} at ${commit}"
          done < <(git rev-list --reverse "${GITHUB_SHA}" -- "$script")
