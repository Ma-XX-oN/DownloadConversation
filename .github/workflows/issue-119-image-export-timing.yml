name: Issue 119 image export timing

on:
  push:
    branches:
      - issue-119-image-export-timing

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Patch helper syntax
        run: python -m py_compile scripts/issue-119-image-export-timing.py

      - name: Apply issue 119 instrumentation
        run: |
          python scripts/issue-119-image-export-timing.py
          python - <<'PY'
          from pathlib import Path

          userscript = Path('chatgpt-conversation-markdown-export.user.js')
          text = userscript.read_text(encoding='utf-8')
          old = 'http_status: timing.http_status ?? Number(error?.httpStatus) || null,'
          new = 'http_status: (timing.http_status ?? Number(error?.httpStatus)) || null,'
          if text.count(old) != 1:
            raise SystemExit(f'Generated syntax correction expected one match, found {text.count(old)}')
          userscript.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/tool-language-diagnostics.test.mjs')
          text = tests.read_text(encoding='utf-8')
          old = '''  const tailStart = userscript.lastIndexOf("if (diagnosticEnabled('debug'))", readyIndex);\n  assert.ok(tailStart > 0, 'Markdown-ready diagnostics must be debug-gated before fingerprint evaluation.');\n  const readyBlock = userscript.slice(tailStart, blobIndex + 400);\n  assert.match(readyBlock, /markdownHash = diagnosticTextHash\\(markdown\\)/);\n  assert.match(readyBlock, /markdown_hash: markdownHash/);\n  assert.equal((readyBlock.match(/diagnosticTextHash\\(markdown\\)/g) ?? []).length, 1,\n    'The export tail should calculate its full Markdown fingerprint only once.');\n'''
          new = '''  const diagnosticStart = userscript.lastIndexOf('const diagnosticStartedAt = performance.now();', readyIndex);\n  const diagnosticEnd = userscript.indexOf('const blobStartedAt = performance.now();', readyIndex);\n  assert.ok(diagnosticStart > 0 && diagnosticEnd > diagnosticStart,\n    'Markdown-ready diagnostics must have a bounded debug-only phase.');\n  const diagnosticBlock = userscript.slice(diagnosticStart, diagnosticEnd);\n  assert.match(diagnosticBlock, /markdownHash = diagnosticTextHash\\(markdown\\)/);\n  assert.match(diagnosticBlock, /markdown_hash: markdownHash/);\n  assert.equal((diagnosticBlock.match(/diagnosticTextHash\\(markdown\\)/g) ?? []).length, 1,\n    'The export-tail diagnostic phase should calculate its full Markdown fingerprint only once.');\n'''
          if text.count(old) != 1:
            raise SystemExit(f'Generated regression-scope correction expected one match, found {text.count(old)}')
          tests.write_text(text.replace(old, new, 1), encoding='utf-8')

          recorder = Path('tests/recorder-panel-ui.test.mjs')
          text = recorder.read_text(encoding='utf-8')
          old = '''  assert.match(userscript, /recoveredImages \\+= expected;/,\n    'Image recovery progress must advance by the number of images processed in each source message.');\n'''
          new = '''  assert.match(userscript, /recoveredImages = Math\\.max\\(recoveredImages, context\\.image_number\\);/,\n    'Image recovery progress must advance as each individual image operation completes.');\n'''
          if text.count(old) != 1:
            raise SystemExit(f'Per-image progress regression correction expected one match, found {text.count(old)}')
          recorder.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify intended product files only
        run: |
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {
            'DESIGN.md',
            'chatgpt-conversation-markdown-export.user.js',
            'tests/heading-metadata-controls.test.mjs',
            'tests/recorder-panel-ui.test.mjs',
            'tests/tool-language-diagnostics.test.mjs',
          }
          if changed != expected:
            raise SystemExit(f'Unexpected changed files: {sorted(changed)}')
          PY

      - name: Verify version and pinned AIConversationCore
        run: |
          grep -F '// @version      0.6.164' chatgpt-conversation-markdown-export.user.js
          grep -F '@require      https://raw.githubusercontent.com/Ma-XX-oN/AIConversationCore/3233cba838bbf2d2cea5a2a6f1900ed6014dcfb0/dist/aiconversationcore.chatgpt.browser.js' chatgpt-conversation-markdown-export.user.js

      - name: Production JSDoc coverage
        run: node scripts/check-jsdoc.mjs

      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js

      - name: Focused issue 119 diagnostics regressions
        run: node --test tests/tool-language-diagnostics.test.mjs tests/heading-metadata-controls.test.mjs

      - name: Existing image and final-render regressions
        run: node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs

      - name: Existing UI regressions
        run: node --test tests/test-list-ui.test.mjs tests/recorder-panel-ui.test.mjs

      - name: Diff preflight
        run: git diff --check

      - name: Commit verified issue 119 product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DESIGN.md chatgpt-conversation-markdown-export.user.js tests/heading-metadata-controls.test.mjs tests/recorder-panel-ui.test.mjs tests/tool-language-diagnostics.test.mjs
          git diff --check --cached
          git commit -m 'perf: instrument image export timing (#119)'
          git push origin HEAD:issue-119-image-export-timing
