name: Materialize compressor package

on:
  push:
    branches:
      - issue-188-codec-neutral-compressor
    paths:
      - '.github/workflows/materialize-compressor-package.yml'
      - 'vendor/compressor/wrapper.c'
      - 'vendor/compressor/manifest.json'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-188-codec-neutral-compressor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984
        with:
          version: 3.1.51
          no-cache: true
      - name: Checkout pinned Zstd source
        uses: actions/checkout@v4
        with:
          repository: facebook/zstd
          ref: 01b7154f1172432f8abe9b3bb9909e14a1176b7d
          path: .zstd-src
      - name: Build package-owned compressor ABI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .compressor-build
          emcc vendor/compressor/wrapper.c \
            .zstd-src/lib/common/*.c \
            .zstd-src/lib/compress/*.c \
            .zstd-src/lib/decompress/*.c \
            -I.zstd-src/lib -Os \
            -s STANDALONE_WASM=1 -s ALLOW_MEMORY_GROWTH=1 -Wl,--no-entry \
            -Wl,--export=compressor_encoder_new \
            -Wl,--export=compressor_encoder_write \
            -Wl,--export=compressor_encoder_finish \
            -Wl,--export=compressor_encoder_free \
            -Wl,--export=compressor_decompress \
            -Wl,--export=compressor_malloc \
            -Wl,--export=compressor_free \
            -Wl,--export=compressor_buffer_free \
            -o .compressor-build/compressor.wasm
      - name: Verify ABI and materialize payload
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const zlib = require('zlib');

          const manifestPath = 'vendor/compressor/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (manifest.wasm_wrapper !== 'wrapper.c') throw new Error('Unexpected compressor wrapper path.');
          const wasm = fs.readFileSync('.compressor-build/compressor.wasm');
          const module = new WebAssembly.Module(wasm);
          const exports = new Set(WebAssembly.Module.exports(module).map(item => item.name));
          for (const name of [
            'compressor_encoder_new', 'compressor_encoder_write',
            'compressor_encoder_finish', 'compressor_encoder_free',
            'compressor_decompress', 'compressor_malloc',
            'compressor_free', 'compressor_buffer_free', 'memory'
          ]) {
            if (!exports.has(name)) throw new Error(`Missing compressor ABI export: ${name}`);
          }

          const gzip = zlib.gzipSync(wasm, { level: 9, mtime: 0 });
          const sha256 = data => crypto.createHash('sha256').update(data).digest('hex');
          manifest.wasm_raw_bytes = wasm.length;
          manifest.wasm_raw_sha256 = sha256(wasm);
          manifest.wasm_gzip_bytes = gzip.length;
          manifest.wasm_gzip_sha256 = sha256(gzip);
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

          const dir = 'vendor/compressor/wasm-gzip-base64';
          fs.rmSync(dir, { recursive: true, force: true });
          fs.mkdirSync(dir, { recursive: true });
          const base64 = gzip.toString('base64');
          for (let offset = 0, index = 0; offset < base64.length; offset += 8000, index += 1) {
            fs.writeFileSync(`${dir}/${String(index).padStart(2, '0')}.txt`, base64.slice(offset, offset + 8000));
          }

          const rebuiltGzip = Buffer.from(
            fs.readdirSync(dir).sort().map(name => fs.readFileSync(`${dir}/${name}`, 'utf8')).join(''),
            'base64'
          );
          const rebuiltWasm = zlib.gunzipSync(rebuiltGzip);
          if (sha256(rebuiltGzip) !== manifest.wasm_gzip_sha256) throw new Error('gzip hash mismatch');
          if (sha256(rebuiltWasm) !== manifest.wasm_raw_sha256) throw new Error('WASM hash mismatch');
          if (!rebuiltWasm.equals(wasm)) throw new Error('WASM byte mismatch');
          console.log(JSON.stringify({
            raw_bytes: wasm.length,
            raw_sha256: manifest.wasm_raw_sha256,
            gzip_bytes: gzip.length,
            gzip_sha256: manifest.wasm_gzip_sha256,
            chunks: fs.readdirSync(dir).length
          }, null, 2));
          NODE
      - name: Commit materialized package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor/compressor/manifest.json vendor/compressor/wasm-gzip-base64/
          if git diff --cached --quiet; then
            echo 'Compressor payload already matches package source.'
            exit 0
          fi
          git commit -m 'build: materialize generic zstd compressor ABI [skip ci]'
          git push origin HEAD:issue-188-codec-neutral-compressor
