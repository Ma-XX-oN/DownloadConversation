name: JSDoc type audit once

on:
  push:
    paths:
      - .github/workflows/jsdoc-type-audit-once.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type-check userscript JSDoc
        run: npx --yes --package typescript tsc --allowJs --checkJs --noEmit --target ES2022 --module ESNext --lib ES2022,DOM --skipLibCheck chatgpt-conversation-markdown-export.user.js
