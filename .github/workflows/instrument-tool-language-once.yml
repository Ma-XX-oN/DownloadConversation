name: Instrument tool language once

on:
  push:
    paths:
      - .github/workflows/instrument-tool-language-once.yml
      - scripts/instrument-tool-language.py

permissions:
  contents: write

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded diagnostics patch
        run: python scripts/instrument-tool-language.py
      - name: JavaScript syntax
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: Focused diagnostics regression
        run: node --test tests/tool-language-diagnostics.test.mjs tests/phase5-rich-core-integration.test.mjs
      - name: Full tests
        run: node --test tests/*.test.mjs
      - name: Verify scoped diff
        run: |
          git status --short
          test -z "$(git status --short | grep -vE '^( M|\?\?) (chatgpt-conversation-markdown-export.user.js|tests/tool-language-diagnostics.test.mjs)$')"
      - name: Commit verified instrumentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-markdown-export.user.js tests/tool-language-diagnostics.test.mjs
          git commit -m "debug: instrument tool language rendering path"
          git push
