name: Issue 121 bare Turn ID migration

on:
  push:
    branches:
      - issue-121-turn-id-without-prefix

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply issue 121 migration
        shell: bash
        run: python scripts/apply-issue121.py
      - name: Production JSDoc coverage
        shell: bash
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        shell: bash
        run: node --check chatgpt-conversation-markdown-export.user.js
      - name: DownloadConversation regressions
        shell: bash
        run: node --test tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/fallback-adaptive-fence.test.mjs tests/tool-language-diagnostics.test.mjs tests/sediment-resolver.test.mjs tests/test-list-ui.test.mjs tests/recorder-panel-ui.test.mjs tests/heading-metadata-controls.test.mjs
      - name: Diff hygiene
        shell: bash
        run: git diff --check
      - name: Commit verified production migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-conversation-markdown-export.user.js DESIGN.md tests/core-integration.test.mjs tests/phase5-rich-core-integration.test.mjs tests/heading-metadata-controls.test.mjs
          git commit -m 'export: render bare Turn IDs (#121)'
          git push
